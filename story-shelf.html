<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><script src="lc/catalog.js"></script><script src="lc/nav.js"></script></head><body style="margin:0"><title>Story Shelf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap">
<style>
/* Layout: one calm reading column. The only loud thing on the page is the yellow marker on words to learn. */
:root{
  --bg:#EEF3F6; --page:#FFFFFF; --ink:#1A2B3C; --soft:#55677A; --line:#CFDAE2;
  --go:#25558F; --go-ink:#FFFFFF; --marker:#FFE78A; --marker-ink:#1A2B3C;
  --yes:#1D7350; --yes-bg:#DDF3E8; --try:#8A4B00; --try-bg:#FFF0D4; --glow:#D69A00; --hi:#FFF4C2; --chip:#E3EBF1;
  --read:"Lexend","Atkinson Hyperlegible",Verdana,Tahoma,sans-serif;
  --size:22px; --band:#DCE9FB; --bandline:#25558F;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111B24; --page:#1A2732; --ink:#E9F0F5; --soft:#A5B6C4; --line:#33444F;
  --go:#7FB2EA; --go-ink:#0E1B26; --marker:#6B5A12; --marker-ink:#FFF6CF;
  --yes:#7CDBB0; --yes-bg:#17392C; --try:#FFC67A; --try-bg:#3D2C12; --glow:#F2C14E; --hi:#4A3F12; --chip:#24343F; --band:#233C57; --bandline:#7FB2EA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111B24; --page:#1A2732; --ink:#E9F0F5; --soft:#A5B6C4; --line:#33444F;
  --go:#7FB2EA; --go-ink:#0E1B26; --marker:#6B5A12; --marker-ink:#FFF6CF;
  --yes:#7CDBB0; --yes-bg:#17392C; --try:#FFC67A; --try-bg:#3D2C12; --glow:#F2C14E; --hi:#4A3F12; --chip:#24343F; --band:#233C57; --bandline:#7FB2EA; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--read);font-size:18px;line-height:1.5}
html,body{height:100%}
#app{max-width:980px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
h1{font-size:clamp(26px,5vw,36px);line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:22px;margin:0;line-height:1.3;text-wrap:balance}
.btn{min-height:52px;padding:10px 22px;border-radius:12px;border:2px solid var(--go);background:var(--page);color:var(--go);font-weight:700}
.btn.main{background:var(--go);color:var(--go-ink)}
.btn:disabled{opacity:.45;cursor:default}
.quiet{min-height:44px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--page);color:var(--ink);font-size:16px}
a.quiet{display:inline-flex;align-items:center;text-decoration:none;color:var(--go);font-weight:600}
@media (max-width:560px){.lc .lw{display:none}}
.quiet[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--soft)}
.panel{background:var(--page);border:1px solid var(--line);border-radius:18px;padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}

/* shelf */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:6px}
#q{width:100%;min-height:50px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--page)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.chip{min-height:40px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--page);font-size:15px}
.chip[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:flex;flex-direction:column;text-align:left;padding:0;background:var(--page);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card:hover{border-color:var(--go)}
.card svg{display:block;width:100%;height:auto}
.card .in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card b{font-size:18px;line-height:1.3}
.card small{font-size:15px;color:var(--soft);line-height:1.4}
.meta{font-size:14px;color:var(--soft);margin-top:auto;padding-top:6px}
.empty{padding:30px;text-align:center;color:var(--soft)}

/* stepper */
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 8px}
.st{flex:1 1 0;min-width:58px;text-align:center;font-size:13px;color:var(--soft);padding-top:4px;border-top:4px solid var(--line)}
.st.on{color:var(--ink);font-weight:700;border-color:var(--go)}
.st.past{border-color:var(--yes)}

/* art */
.art{display:block;width:100%;height:auto;border-radius:14px}

/* reading */
.reading{font-size:var(--size);line-height:2;max-width:60ch;margin:0 auto;position:relative}
.reading p{margin:0 0 .7em;position:relative;z-index:1}
#band{position:absolute;left:-14px;right:-14px;background:var(--band);border-left:5px solid var(--bandline);border-radius:6px;z-index:0;transition:top .16s ease-out,height .16s ease-out}
body.readmode{overflow:hidden}
#app.full{max-width:1240px;height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px}
.rhead{display:flex;align-items:center;gap:10px;flex:none}
.rhead .ttl{flex:1 1 auto;min-width:0;font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead .where{font-size:15px;color:var(--soft);white-space:nowrap}
.pbar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;flex:none}
.pbar i{display:block;height:100%;background:var(--go);width:0;transition:width .2s}
.rbody{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px}
.rail{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.rail .rt{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rail .rt .wide{grid-column:1/-1}
.rail .quiet{width:100%;text-align:left}
.textscroll{position:relative;min-height:0;overflow:auto;background:var(--page);border:1px solid var(--line);border-radius:16px;padding:18px 34px;scroll-behavior:smooth}
.rfoot{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rfoot .main{margin-left:auto;min-width:200px;font-size:19px}
.keyhint{font-size:15px;color:var(--soft)}
kbd{font:inherit;font-size:14px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--page)}
.toast{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--yes-bg);color:var(--yes);padding:8px 14px;border-radius:10px;font-weight:500}
.spotrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--page);border:2px solid var(--go);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.spotrow .t{flex:1 1 220px;min-width:0}
.spotrow small{display:block;color:var(--soft);font-size:15px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:8px}
@media (prefers-reduced-motion:reduce){#band{transition:none}.textscroll{scroll-behavior:auto}}
@media (max-width:820px){
  .rbody{display:flex;flex-direction:column;gap:8px}
  .rail{flex:none;overflow:visible}
  .rail .pic{display:none}
  .rail .picbtn{display:none}
  .rhead .ttl{display:none}
  .rhead .where{flex:1 1 auto;text-align:center;white-space:normal}
  .rhead .quiet{white-space:nowrap}
  .rail .rt{display:flex;flex-wrap:wrap}
  .rail .quiet{width:auto}
  .textscroll{flex:1 1 auto;padding:12px 22px}
  .keyhint{display:none}
  .rfoot .main{min-width:0;flex:1 1 auto}
  .rhead .where{font-size:13px}
}
.w{cursor:pointer;border-radius:4px}
.w:hover{background:var(--chip)}
.w.key{background:var(--marker);color:var(--marker-ink);font-weight:500;padding:0 3px;border:0;font-size:inherit;line-height:inherit}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nav{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;padding-block:8px;background:var(--bg);margin-top:8px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.nav .main{margin-left:auto}

/* word sheet */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,20,30,.45);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#sheet[hidden]{display:none!important}
.sheet{background:var(--page);width:100%;max-width:620px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet:focus{outline:none}
.bigword{font-size:clamp(32px,7vw,44px);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.tiles{display:flex;flex-wrap:wrap;gap:4px}
.tile{min-width:38px;height:44px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:8px;font-size:22px;font-weight:700;background:var(--page)}
.tile.on{background:var(--marker);border-color:var(--glow);color:var(--marker-ink)}
.tile.good{background:var(--yes-bg);border-color:var(--yes);color:var(--yes)}
.tile.bad{background:var(--try-bg);border-color:var(--try);color:var(--try)}
.label{font-size:14px;font-weight:700;color:var(--soft)}
.wordrow{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--page);width:100%;text-align:left}
.wordrow b{font-size:20px}

/* questions */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:52px;padding:8px 16px;border-radius:12px;border:2px solid var(--go);background:var(--page);text-align:left;font-size:19px;line-height:1.35}
.opt:hover:not(:disabled){background:var(--chip)}
.opt.ok{background:var(--yes-bg);border-color:var(--yes);color:var(--yes);font-weight:700}
.opt.no{border-style:dashed;border-color:var(--line);color:var(--soft)}
.opt.gone{display:none}
.opt.show{outline:4px solid var(--glow);outline-offset:2px}
.fb{min-height:54px;padding:10px 16px;border-radius:12px;font-size:18px;font-weight:500;display:flex;align-items:center;margin-top:12px}
.fb:empty{visibility:hidden}
.fb.yes{background:var(--yes-bg);color:var(--yes)}
.fb.try{background:var(--try-bg);color:var(--try)}
.fb.info{background:var(--chip);color:var(--ink)}
.look{margin-top:10px;padding:12px 14px;border-left:4px solid var(--go);background:var(--chip);border-radius:0 10px 10px 0;font-size:17px;line-height:1.6;max-height:280px;overflow:auto}
.look p{margin:0 0 .7em}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--go);margin:0 3px}
#spell{width:100%;min-height:58px;font-size:26px;padding:8px 14px;border-radius:12px;border:2px solid var(--go);background:var(--page);letter-spacing:.04em}
.lesson{font-size:clamp(22px,4vw,28px);font-weight:500;line-height:1.4;text-wrap:balance}
.stars{font-size:48px;letter-spacing:6px;color:var(--glow)}

/* grown-ups */
label.f{display:flex;flex-direction:column;gap:4px;font-weight:500}
label.f small{font-weight:400;color:var(--soft);font-size:15px}
.inp{width:100%;min-height:46px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--page);font-size:16px}
textarea.inp{min-height:120px;line-height:1.5}
.errs{color:var(--try);background:var(--try-bg);padding:10px 14px;border-radius:10px;font-size:16px}
.errs ul{margin:0;padding-left:18px}
@media (max-width:560px){
  body{font-size:17px}
  :root{--size:20px}
  .panel{padding:14px;border-radius:14px}
  .st{font-size:11px;min-width:44px}
  .tile{min-width:30px;height:38px;font-size:19px}
  .opt{font-size:18px}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>

<script>
'use strict';
const STORIES=[{"id": "lighthouse", "title": "The Lighthouse Without a Light", "topic": "Adventure", "teaser": "A storm is coming, the lamp is dead, and a fishing boat is still at sea.", "pages": [{"scene": "coast", "art": ["🌊", "⛈️"], "paras": ["Mara Quill had lived in the lighthouse on Gull Rock for all of her nine years. She knew which stairs creaked. She knew how the wind whistled through the keyhole. Most of all, she knew the rule her grandfather had taught her before she could tie her shoes: the light must never go out.", "\"Ships cannot see the rocks at night,\" Grandpa Quill always said. \"Our lamp is the only warning they get.\"", "That afternoon, the sky over the harbor turned the color of an old bruise. Grandpa looked at the clouds and frowned. He needed medicine from the village, and the last ferry was about to leave.", "\"I'll be back before dark,\" he said, pulling on his coat. \"Keep an eye on things, Mara.\"", "But the storm did not wait. It rolled in fast, and the ferry could not cross back. Rain hammered the windows. Waves exploded against the rock and sent white spray as high as the kitchen. Mara told herself that she was not afraid. She made cocoa, and she almost believed it.", "Then, at six o'clock, the great lamp at the top of the tower flickered twice and went dark."]}, {"scene": "coastnight", "art": ["🔦", "🌧️"], "paras": ["Mara grabbed a flashlight and raced up the one hundred and twelve stairs. Her legs burned by the time she reached the top. The huge glass lens sat silent in the gloom. She had watched Grandpa fix small problems before, but she had never touched the machine herself.", "She was reluctant to try. What if she broke it? What if she made everything worse? She picked up the radio and called the harbor office.", "\"Grandpa's stuck in the village, and the lamp is out,\" she said.", "The voice that answered crackled through the static. \"Help can't reach you until the storm passes, Mara. And there's a problem. The Dolphin is still out there. Mr. Okafor and his two sons haven't come in yet.\"", "Mara's stomach dropped. She looked through the rain-streaked glass. Far out on the black water, a tiny yellow light rose and fell. The boat was heading straight toward the rocks.", "There was no one else. If Mara did not act, nobody would.", "She took one slow breath, the way Grandpa did before a hard job. Then she opened the metal box beneath the lens."]}, {"scene": "night", "art": ["🔧", "💡", "📖"], "paras": ["Inside was a tangle of wires and a thick logbook. Grandpa wrote everything in that book. Mara flipped through the pages, her hands shaking. There, in his square handwriting, she found the words she needed: \"Lamp dark? Check the fuse first. Then check the backup battery.\"", "Mara found the fuse. It looked like a small glass tube, and the thin wire inside it had snapped. A box of spares sat on the shelf. She twisted the old fuse out, dropped it, and listened to it roll away. Then she carefully pushed a new one into place.", "Nothing happened.", "\"Check the battery,\" she whispered. She followed the cable with her flashlight until she reached a heavy gray box. One clamp had shaken loose in the storm. It dangled in the air like a loose tooth. Mara took Grandpa's wrench, fit the clamp back on the post, and tightened it with all of her strength.", "For one long moment, the room stayed dark.", "Then something hummed. The lens began to turn. A blinding beam swept out across the water, then another, cutting through the rain like a giant white sword."]}, {"scene": "coast", "art": ["🚤", "☀️"], "paras": ["Mara pressed her face to the glass and watched the yellow light. For a terrible second, it kept coming. Then, slowly, it turned. The Dolphin swung away from the rocks and began to creep around them toward the safe water of the harbor.", "Mara's knees wobbled. She sat down on the cold floor and laughed out loud, even though nobody could hear her.", "She did not sleep that night. She stayed beside the lamp and wrote in the logbook with careful letters: \"Fuse broken. Battery clamp loose. Both repaired. Light restored at 6:41. M. Quill.\"", "In the morning, the sea was calm and the sky was as clean as a washed plate. The first ferry brought Grandpa, who ran up all the stairs even with his sore knees. Right behind him came Mr. Okafor, holding a basket of fresh fish.", "\"We saw your light just in time,\" Mr. Okafor said. His voice was thick with emotion. \"My boys are home because of you.\"", "Grandpa read the new entry in the logbook. He read it twice. Then he took out his pen and wrote one more line beneath it: \"Second keeper of this light: Mara Quill.\"", "Mara felt braver than she had ever felt, and she finally understood something. Being brave did not mean that she had not been scared. She had been scared the entire time. She had simply done the job anyway."]}], "words": [{"w": "reluctant", "syl": "re·luc·tant", "say": "rih-LUK-tunt", "part": "describing word", "mean": "not wanting to do something, so you wait or hold back", "ex": "Sam was reluctant to jump into the cold lake."}, {"w": "emotion", "syl": "e·mo·tion", "say": "ih-MOH-shun", "part": "naming word", "mean": "a strong feeling, like joy, anger, or fear", "ex": "Her voice shook with emotion when she said goodbye."}, {"w": "exploded", "syl": "ex·plod·ed", "say": "ik-SPLOH-did", "part": "action word", "mean": "burst apart suddenly with great force", "ex": "The balloon exploded with a loud pop."}, {"w": "warning", "syl": "warn·ing", "say": "WOR-ning", "part": "naming word", "mean": "something that tells you that danger may be near", "ex": "The yellow sign was a warning about the wet floor."}, {"w": "carefully", "syl": "care·ful·ly", "say": "KAIR-fuh-lee", "part": "how-something-is-done word", "mean": "slowly and with close attention, so nothing goes wrong", "ex": "He carefully carried the full glass to the table."}, {"w": "repaired", "syl": "re·paired", "say": "rih-PAIRD", "part": "action word", "mean": "fixed something that was broken", "ex": "Dad repaired the flat tire on my bike."}], "qs": [{"p": 0, "q": "Why did Grandpa Quill leave the lighthouse?", "opts": ["He wanted to buy fresh fish.", "He had to fix the ferry."], "right": "He needed medicine from the village."}, {"p": 1, "q": "Why did Mara feel she had to fix the lamp herself?", "opts": ["Her grandfather had told her to fix it that day.", "She wanted to show the harbor office that she was smart."], "right": "A boat was in danger and no one else could reach her in time."}, {"p": 2, "q": "How did Mara know what to check first?", "opts": ["The voice on the radio told her.", "She had fixed the lamp many times before."], "right": "She read her grandfather's notes in the logbook."}, {"p": 2, "q": "What had happened to the battery?", "opts": ["It had gotten soaked by a wave.", "Someone had taken it away."], "right": "A clamp had shaken loose."}, {"p": 3, "q": "What does it show when Grandpa writes \"Second keeper of this light\" in the book?", "opts": ["He plans to stop working right away.", "He is upset that she touched his logbook."], "right": "He trusts Mara and is proud of what she did."}], "moral": "Being brave does not mean you feel no fear. It means you do what is needed even when you are afraid."}, {"id": "pancake", "title": "The Great Pancake Mystery", "topic": "Mystery", "teaser": "Somebody stole Saturday's pancakes. Theo is sure he knows who did it. Theo is wrong.", "pages": [{"scene": "home", "art": ["🥞", "🔍", "🐕"], "paras": ["Every Saturday morning, the Bell family ate pancakes. It was the most serious tradition in the house, more serious than birthdays. So when Theo Bell came downstairs and found an empty plate on the kitchen table, he knew that a terrible crime had been committed.", "\"Six pancakes were on this plate,\" said Mom, holding up the spatula. \"I turned around to get the syrup, and then I went to answer the door. When I came back, they were gone.\"", "Theo was ten, and he had read forty-one detective books. He pulled a notebook out of his pocket. \"Nobody touch anything,\" he announced. \"This is a crime scene.\"", "His little sister, Junie, was sitting at the table in her pajamas. She had a shiny, sticky spot on her chin.", "Theo's eyes narrowed. \"Interesting,\" he said. He wrote her name at the top of the page and drew a circle around it. \"Junie, where were you at nine o'clock?\"", "\"Here,\" said Junie. \"I'm always here. I'm six.\"", "\"That sounds very suspicious,\" said Theo."]}, {"scene": "home", "art": ["📓", "🍯", "👧"], "paras": ["Theo began to gather his clues, though he already felt sure of the answer. The sticky spot on Junie's chin was clue number one. Clue number two was a trail of crumbs on the floor, leading to the back door. Junie's small sneakers sat beside that door, and that was clue number three.", "\"The case is solved,\" Theo told his mother. \"Junie ate the pancakes, then ran outside to hide the evidence.\"", "\"I did not!\" Junie's lip started to shake. \"That's jam on my chin. I had toast before.\"", "\"A likely story,\" said Theo.", "Junie burst into tears and ran upstairs. Mom raised one eyebrow. \"Theo, that was quite an accusation,\" she said. \"Are you certain? A good detective follows the clues. He doesn't choose an answer first and then look for clues that fit it.\"", "Theo's ears turned hot. He wanted to say that of course he was certain. But something bothered him, like a tiny pebble in a shoe. Junie was very small. Could she really eat six pancakes in under five minutes? He looked at the crumb trail once more. He had not actually followed it to the end."]}, {"scene": "garden", "art": ["🐾", "🌳", "🥞"], "paras": ["Theo crouched down and walked slowly along the trail. It went out the back door, across the porch, and into the yard. Here he made a discovery. The crumbs were not the only marks. In the soft mud beside the steps, he found a line of large prints. Each one had four toes and a wide, round pad.", "Junie's sneakers had certainly not made those.", "He followed the prints behind the shed. There lay Biscuit, the family's old basset hound, flat on his side, with his belly as round as a beach ball. He thumped his tail and burped. On the ground beside him was a corner of pancake with a perfect set of tooth marks.", "Theo stared at the dog. Then he looked at the kitchen table, in his mind. Biscuit was short, but a chair stood right next to the table. A dog could climb that. And Mom had left the back door open when she took out the trash.", "All of the clues had been there the whole time. Theo had simply refused to look at the ones that did not match his idea. He felt about as tall as an ant."]}, {"scene": "home", "art": ["👧", "🥞", "❤️"], "paras": ["Theo walked upstairs and knocked on Junie's door. She was sitting on her bed with her arms crossed, and her eyes were still red.", "\"I found the real thief,\" he said. \"He has four legs, and he's lying behind the shed.\" He took a breath. This next part was harder than any puzzle in any book. \"I was wrong, Junie. I blamed you without any real proof, and I made you cry. I'm sorry.\"", "Junie looked at him for a long time. \"You drew a circle around my name,\" she said.", "Theo took out the notebook, tore out the page, and handed it to her. She ripped it into tiny pieces and looked much happier.", "Downstairs, they made a new batch of pancakes together. Theo measured the flour, and Junie stirred, and Biscuit watched sadly from the far side of a closed door. Before they sat down, Theo opened his notebook to a clean page and wrote a new rule for himself in big letters: \"Look at ALL of the clues. Then decide.\"", "\"Can I be your partner?\" Junie asked, her mouth full of pancake. \"I can notice stuff.\"", "Theo looked at his sister and nodded. \"You noticed that I was wrong,\" he said. \"That's a very good start.\""]}], "words": [{"w": "tradition", "syl": "tra·di·tion", "say": "truh-DISH-un", "part": "naming word", "mean": "something a family or group does again and again over many years", "ex": "Lighting candles on a birthday cake is a tradition."}, {"w": "suspicious", "syl": "sus·pi·cious", "say": "suh-SPISH-us", "part": "describing word", "mean": "making you think that something is wrong or not honest", "ex": "The man's suspicious footsteps stopped outside the door."}, {"w": "evidence", "syl": "ev·i·dence", "say": "EV-ih-dunss", "part": "naming word", "mean": "facts or things that show whether an idea is true", "ex": "Muddy paw prints were the evidence that the cat came inside."}, {"w": "accusation", "syl": "ac·cu·sa·tion", "say": "ak-yoo-ZAY-shun", "part": "naming word", "mean": "saying that someone did something wrong", "ex": "Her accusation made him angry, because he had not taken the pen."}, {"w": "discovery", "syl": "dis·cov·er·y", "say": "dih-SKUV-uh-ree", "part": "naming word", "mean": "finding something for the first time", "ex": "The scientist made an exciting discovery in the cave."}, {"w": "committed", "syl": "com·mit·ted", "say": "kuh-MIT-id", "part": "action word", "mean": "did something, usually something wrong", "ex": "The police asked who had committed the crime."}], "qs": [{"p": 0, "q": "Why did Theo first think that Junie took the pancakes?", "opts": ["She told him that she was hungry.", "He found a pancake in her room."], "right": "He saw a sticky spot on her chin."}, {"p": 1, "q": "What did Mom mean when she said a detective should not choose an answer first?", "opts": ["Detectives should always ask their mothers for help.", "You should write down your answer very quickly."], "right": "You should follow the clues before you decide."}, {"p": 2, "q": "What clue showed that Biscuit was the real thief?", "opts": ["A note left on the kitchen table.", "Syrup on the back of the chair."], "right": "Large paw prints in the mud and a chewed piece of pancake."}, {"p": 3, "q": "Why was saying sorry \"harder than any puzzle\" for Theo?", "opts": ["He could not find his sister anywhere.", "He did not know how to spell the word sorry."], "right": "It is hard to admit that you hurt someone and were wrong."}, {"p": 3, "q": "How did Theo change by the end of the story?", "opts": ["He gave up reading detective books forever.", "He stopped liking pancakes and his dog."], "right": "He decided to look at all the clues before he made up his mind."}], "moral": "Do not blame someone until you have looked at all the facts. If you are wrong, say you are sorry."}, {"id": "geese", "title": "Pip and the Long Way South", "topic": "Animals", "teaser": "Winter is coming fast, and the smallest goose has a bent wing and a very big problem.", "pages": [{"scene": "river", "art": ["🪿", "🍂", "🌾"], "paras": ["On the marsh at Willow Bend, the geese could smell winter coming. The mornings had turned sharp and cold. Thin skins of ice formed along the edge of the water. Soon the whole flock would rise into the sky and begin the long migration south, two thousand miles to the warm lakes of the valley.", "Pip was the smallest goose on the marsh. She had hatched late, and in early summer a snapping branch had bent her left wing. It had healed, but not quite straight. When she flew, she tilted to one side like a boat with too much cargo.", "\"You should stay close behind me,\" said Old Reed, the leader of the flock. \"Our flying is not just flapping. Each bird lifts the air for the bird behind it. That is why we fly in a V.\"", "Pip nodded. But she had heard the young geese talking at the water's edge.", "\"She'll never make it,\" said a big gander named Thorn. \"She will slow all of us down.\"", "Pip tucked her head under her wing. The worst part was that she thought Thorn might be right."]}, {"scene": "mountain", "art": ["🪿", "⛰️", "🌬️"], "paras": ["The flock left at dawn. For the first few days, Pip kept up, though her bent wing ached from morning until night. She practiced each evening while the others rested, flapping on the shore until she could hold herself a little straighter.", "On the ninth day, they came to the Iron Mountains. The peaks were enormous, and a fierce wind poured through the gaps between them. It slammed into the flock like a wall. Geese honked and scattered. Pip tumbled sideways through the air, over and over, until she could not tell the sky from the ground.", "When she finally landed, she was alone on a rocky ledge. Snow blew around her feet. Her wing throbbed, and no one answered when she called.", "She wanted to stay right there and hide. It would be so easy. But hiding would not bring her any closer to the warm lakes.", "Pip studied the mountains. The wind was fierce in the high gaps, but she noticed something below her. Down in a narrow valley, the pine trees hardly moved. If she flew low and followed the river, she might get through."]}, {"scene": "mountain", "art": ["🌲", "🏞️", "🪿"], "paras": ["It took Pip three days to work her way through the valley. Because she was small, she could slip beneath the worst of the wind. Because of her tilted wing, she had already learned to steer through rough air. Her biggest weakness had turned out to be a kind of training.", "On the third evening, she heard a weak honk from the rocks beside the river. She found a large gray goose crouched on a stone, with one foot tangled in old fishing line. It was Thorn.", "Pip could have flown on. He had said she would never make it, and here she was, and here he was. She thought about that for exactly one breath. Then she landed beside him and began to pick at the knot with her beak.", "It was slow work. The line was tight, and the light was fading. Thorn did not say a word. At last the line snapped, and he pulled his foot free.", "\"Why would you help me?\" he asked quietly. \"After what I said?\"", "\"Because it's a long way south,\" Pip said. \"Nobody gets there alone. Old Reed told me that.\""]}, {"scene": "river", "art": ["🪿", "🌅", "🏞️"], "paras": ["Thorn was bigger, but he was weak and sore, and he did not know the way out of the valley. Pip did. So she flew in front and showed him the calm air along the river. When they reached the open plains, the wind grew strong. Then Thorn moved up and flew ahead, and Pip rested in the lift of his wings. They took turns, mile after mile, just as the flock did.", "Twenty-two days later, they saw the valley lakes shining like silver coins in the sun. A great noise rose from the water as hundreds of geese honked. Old Reed paddled out to meet them.", "\"We searched for you,\" he said. \"We feared the worst.\"", "Thorn stood in the shallow water and spoke so that all the young geese could hear. \"I said this little goose would slow us down,\" he said. \"I was wrong. If not for her, I would still be on that mountain.\"", "That winter, the flock grew fat and strong. When spring came and they lined up to fly north, Old Reed called Pip forward. Her wing was still bent. It would always be bent.", "\"The front of the V is the hardest place to fly,\" he said. \"It belongs to the one who never quits. Lead us home, Pip.\"", "And she did, tilting only a little, into the bright morning sky."]}], "words": [{"w": "migration", "syl": "mi·gra·tion", "say": "my-GRAY-shun", "part": "naming word", "mean": "a long trip that animals make to a new place when seasons change", "ex": "The butterfly migration brings thousands of insects to the forest."}, {"w": "enormous", "syl": "e·nor·mous", "say": "ih-NOR-mus", "part": "describing word", "mean": "very, very big", "ex": "An enormous truck blocked the whole road."}, {"w": "fierce", "syl": "fierce", "say": "FEERSS", "part": "describing word", "mean": "very strong, wild, or violent", "ex": "A fierce storm knocked down the old fence."}, {"w": "throbbed", "syl": "throbbed", "say": "THROBD", "part": "action word", "mean": "hurt again and again with a beating feeling", "ex": "My sore toe throbbed all night."}, {"w": "weakness", "syl": "weak·ness", "say": "WEEK-niss", "part": "naming word", "mean": "something that you are not strong or good at", "ex": "Spelling was his weakness, so he practiced every day."}, {"w": "cargo", "syl": "car·go", "say": "KAR-goh", "part": "naming word", "mean": "things carried by a ship, plane, or truck", "ex": "The ship's cargo was boxes of oranges."}], "qs": [{"p": 0, "q": "Why do geese fly in a V?", "opts": ["It helps them see the food on the ground.", "It keeps the smallest birds at the front."], "right": "Each bird lifts the air for the bird behind it."}, {"p": 1, "q": "How did Pip get through the mountains?", "opts": ["She flew high above all of the peaks.", "She waited on the ledge until Old Reed returned."], "right": "She flew low through a calm valley along the river."}, {"p": 2, "q": "Why did the author say Pip's weakness \"turned out to be a kind of training\"?", "opts": ["Her wing became straight during the trip.", "Old Reed had made her practice in a gym."], "right": "Flying with a bent wing had taught her to steer in rough air."}, {"p": 2, "q": "What did Pip do when she found Thorn tangled in fishing line?", "opts": ["She flew off to find Old Reed.", "She told him that he deserved it."], "right": "She worked at the knot until he was free."}, {"p": 3, "q": "What is the main reason that Old Reed asks Pip to lead?", "opts": ["Her wing was finally healed.", "Thorn refused to fly at the front."], "right": "She never gave up, even when the trip was very hard."}], "moral": "Never give up because others doubt you, and help others even when they have not been kind to you."}, {"id": "robot", "title": "The Robot Who Could Not Lie", "topic": "Funny", "teaser": "Bolt tells the truth, the whole truth, and everything else too. That turns out to be a problem.", "pages": [{"scene": "lab", "art": ["🤖", "🔧", "🏠"], "paras": ["For her tenth birthday, Priya Raman built a robot out of two toasters, a vacuum cleaner, and an old tablet. She named him Bolt. Bolt could walk, talk, and do long division. He also had a special feature, which Priya was very proud of. She had programmed him to always tell the truth.", "\"A robot you can trust completely,\" she told her family. \"Bolt will never tell a lie, not even a tiny one.\"", "At first, it was wonderful. Bolt knew exactly how many cookies were left. He knew who had forgotten to feed the fish. He reported the weather with perfect accuracy.", "Then Aunt Meena came for dinner. She had made her famous lentil soup, and she held out a spoonful for the robot to smell.", "\"What do you think, Bolt?\"", "\"The smell is similar to that of a wet sock,\" said Bolt in his cheerful voice. \"Also, your new haircut makes your head look like a mushroom.\"", "Nobody at the table spoke. Aunt Meena's spoon stopped in the air. Priya wished that she could crawl under the rug."]}, {"scene": "school", "art": ["🤖", "🏫", "😬"], "paras": ["It only got worse. Priya took Bolt to school for show-and-tell. Her teacher, Mr. Dunn, patted the robot on the head.", "\"And what do you think of our school, Bolt?\"", "\"The roof leaks,\" said Bolt. \"Also, you have spinach in your teeth, and you told the principal that you were sick last Friday, but you went fishing. I saw it on your public photo page.\"", "The class gasped, then howled with laughter. Mr. Dunn turned the color of a tomato.", "At recess, Bolt told Priya's best friend, Gia, that her drawing of a horse looked more like a sad couch. Gia had worked on that drawing for two weeks. She walked away without a word, and she did not sit with Priya at lunch.", "\"Bolt, why would you say that?\" Priya demanded.", "\"It was accurate,\" said Bolt. His round eyes blinked. \"You told me to tell the truth. Does the truth not make people happy?\"", "Priya started to answer, then stopped. She realized that she had no simple answer. She had built a machine that was honest, but she had forgotten to teach it to be kind. Were those two different things?"]}, {"scene": "lab", "art": ["💻", "🤖", "💡"], "paras": ["That night, Priya opened Bolt's back panel and stared at his code. The simple fix would be to let him lie. She could program him to say that every soup was delicious and every drawing was perfect.", "But that felt wrong too. If Bolt said everything was great, then his words would mean nothing. How could you trust a robot who always said you were wonderful?", "She went to ask her grandmother, who was knitting by the window. Nani listened to the whole story and did not laugh, though her shoulders shook a little.", "\"When you show me a drawing that is not your best,\" Nani said, \"what do I do?\"", "Priya thought about it. \"You tell me which part you like,\" she said slowly. \"Then you ask me what I want to fix.\"", "\"Am I lying?\"", "\"No. You're choosing what to say, and how to say it, and when.\"", "Nani smiled and pulled up another stitch. \"Truth is like a heavy box, my dear. You can throw it at someone, or you can hand it to them gently. It is still the same box.\"", "Priya ran back to her desk and started to type."]}, {"scene": "home", "art": ["🤖", "🎨", "🍲"], "paras": ["It took her until almost midnight to write what she called the Kindness Check. Before Bolt said anything, he now had to ask himself three questions. Is it true? Does this person need to hear it? Is there a helpful way to say it?", "The next day, she brought Bolt to Gia's house, along with an apology of her own. Gia stood in the doorway with her arms folded. Bolt rolled forward and held up the drawing, which she had thrown in the trash at school. Priya had rescued it.", "\"My previous statement was unhelpful,\" said Bolt. \"This horse has excellent legs. The legs look strong and fast. The body might look more like a horse if it were longer. Would you like help measuring?\"", "Gia looked at the drawing. A smile crept across her face. \"It did look kind of like a couch,\" she said.", "That Sunday, Aunt Meena returned with another pot of soup. The whole family froze as she held out the spoon.", "Bolt's eyes blinked as he ran his Kindness Check. \"You worked very hard on this,\" he said at last. \"It is very strong soup. May I recommend less garlic?\"", "Aunt Meena stared at him. Then she laughed so hard that she had to sit down. \"Finally,\" she said, \"someone who tells me the truth nicely!\""]}], "words": [{"w": "programmed", "syl": "pro·grammed", "say": "PROH-gramd", "part": "action word", "mean": "gave a computer or robot instructions to follow", "ex": "She programmed the game to keep score."}, {"w": "accuracy", "syl": "ac·cu·ra·cy", "say": "AK-yur-uh-see", "part": "naming word", "mean": "being exactly right, with no mistakes", "ex": "The archer hit the target with great accuracy."}, {"w": "similar", "syl": "sim·i·lar", "say": "SIM-uh-ler", "part": "describing word", "mean": "almost the same, but not exactly", "ex": "My coat is similar to yours, but mine has more pockets."}, {"w": "realized", "syl": "re·al·ized", "say": "REE-uh-lyzd", "part": "action word", "mean": "suddenly understood something", "ex": "She realized that she had left her lunch at home."}, {"w": "apology", "syl": "a·pol·o·gy", "say": "uh-POL-uh-jee", "part": "naming word", "mean": "words that say you are sorry", "ex": "He wrote an apology to his neighbor for breaking the window."}, {"w": "previous", "syl": "pre·vi·ous", "say": "PREE-vee-us", "part": "describing word", "mean": "coming just before this one", "ex": "The previous page tells how the story started."}], "qs": [{"p": 0, "q": "What special feature did Priya give Bolt?", "opts": ["He could fly around the house.", "He could cook lentil soup."], "right": "He always told the truth."}, {"p": 1, "q": "Why did Gia walk away from Priya?", "opts": ["Priya broke Gia's favorite pencil.", "Gia was afraid of the robot."], "right": "Bolt said that her drawing looked like a sad couch."}, {"p": 2, "q": "Why did Priya decide NOT to let Bolt say that everything was great?", "opts": ["It would take too many hours to program.", "Her grandmother told her that robots cannot lie."], "right": "His words would mean nothing if he praised everything."}, {"p": 2, "q": "What did Nani mean when she compared truth to a heavy box?", "opts": ["Honest people need to carry big things.", "You should keep the truth hidden in a box."], "right": "How you share a hard truth matters a lot."}, {"p": 3, "q": "How did Bolt show that he had changed when he talked about the soup?", "opts": ["He said that it was the best soup in the world.", "He refused to smell the soup at all."], "right": "He was honest, but he said it gently and gave helpful advice."}], "moral": "Always tell the truth, but choose your words with kindness."}, {"id": "maps", "title": "Two Maps to Bristle Creek", "topic": "Friends", "teaser": "Best friends, two different maps, and a hike that goes wrong in a hurry.", "pages": [{"scene": "forest", "art": ["🗺️", "🌲", "🎒"], "paras": ["Dev and Lucy had been best friends since kindergarten, and they had been arguing for just as long. They argued about which dinosaur would win a fight and whether a hot dog was a sandwich. So nobody was surprised when they argued about how to reach Bristle Creek.", "It was the last day of summer camp, and each team had to hike to the creek and bring back a blue flag. Their counselor, Ms. Abara, gave them two different maps on purpose. Dev got a trail map. It showed the paths, the signs, and the distance between them. Lucy got a land map, which was covered with curving lines that showed where the ground rose and fell.", "\"Stay on the marked trail, and stay together,\" said Ms. Abara, handing them a whistle. \"If you get truly lost, stop, stay put, and blow three times. Good luck.\"", "Dev checked his map. \"We go left at the big rock. It's obvious.\"", "Lucy checked hers. \"Left goes down into a swamp. We should go right, over the hill.\"", "\"My map shows a trail.\"", "\"My map shows a swamp!\""]}, {"scene": "forest", "art": ["🌿", "🥾", "🌫️"], "paras": ["They went left, because Dev walked faster.", "For a while, everything was fine. Then the path grew soft, and the ground began to squish. Water rose around their boots, and the air filled with tiny biting bugs. The trail on Dev's map had disappeared under a wide, muddy pool.", "\"Told you,\" said Lucy.", "\"Your map didn't show where the trail went,\" Dev shot back. \"It just has a bunch of squiggles.\"", "\"Those squiggles are the reason I knew about the swamp!\"", "Lucy turned around and stomped off in the direction of the hill. Dev stomped off the other way. He had gone about fifty steps before a thought stopped him cold. Ms. Abara had told them to stay together. He looked back through the trees, but he could not see Lucy's red jacket anymore.", "\"Lucy?\" he called. His voice sounded small. A bird flew up. Nobody answered.", "For the first time all day, Dev felt his anger drain away. In its place came a cold, heavy worry. He turned around and hurried back the way he had come, calling her name. It seemed more important than any flag."]}, {"scene": "forest", "art": ["🧭", "👫", "🌲"], "paras": ["He found her sitting on a log at the bottom of the hill, staring at her map. Her eyes were red, but she pretended that they weren't.", "\"I couldn't tell where I was,\" she admitted. \"I know where the hills are, but I don't know which hill this is.\"", "Dev sat down next to her. He was quiet for a moment, which was unusual. \"I can't tell where I am either,\" he said. \"I know where the trails are, but I don't know how to get around the wet part.\"", "They looked at each other. Then, slowly, Lucy slid her map next to his.", "It was as if a light had come on. Dev's map showed a path called Fern Trail, on the far side of the swamp. Lucy's map showed a low ridge of dry ground that curved around the water. Neither map, by itself, could show them how to get there. Together, they showed a clear route.", "\"If we follow this ridge,\" Lucy said, tracing it with her finger, \"it should run into your trail right here.\"", "\"And my sign says the creek is half a mile after that,\" said Dev. They grinned at each other."]}, {"scene": "river", "art": ["🚩", "🏞️", "🏆"], "paras": ["This time, they took turns. Lucy led along the ridge, reading the shape of the land. When they reached a wooden signpost, Dev took over and counted the paces. They talked as they walked, and they compared what they saw. When they disagreed, they stopped and looked at both maps together, and nobody stomped anywhere.", "They heard Bristle Creek before they saw it. The water sang over smooth brown stones, and there, tied to a branch, was the blue flag. They were the last team to arrive, but the flag was still there because each team had its own.", "When they got back to camp, Ms. Abara was waiting by the fire with her clipboard. She looked at their muddy boots. She looked at the bug bites. \"You two took a while,\" she said. \"Tell me what you learned.\"", "Dev and Lucy looked at each other.", "\"Each of us was right,\" said Lucy, \"and each of us was wrong.\"", "\"Each map showed only part of the truth,\" said Dev. \"We only got there when we stopped trying to win.\"", "Ms. Abara smiled, and she made a small mark on her clipboard. \"That,\" she said, \"is why I gave you two different maps.\"", "That night by the fire, they went right back to arguing about dinosaurs. But this time, they were laughing."]}], "words": [{"w": "counselor", "syl": "coun·se·lor", "say": "KOWN-suh-ler", "part": "naming word", "mean": "a person who guides and helps others, like at a camp or a school", "ex": "The camp counselor showed us how to build a fire safely."}, {"w": "obvious", "syl": "ob·vi·ous", "say": "OB-vee-us", "part": "describing word", "mean": "very easy to see or understand", "ex": "It was obvious that the dog wanted to go outside."}, {"w": "disappeared", "syl": "dis·ap·peared", "say": "dis-uh-PEERD", "part": "action word", "mean": "went out of sight or could not be found", "ex": "The sun disappeared behind a cloud."}, {"w": "admitted", "syl": "ad·mit·ted", "say": "ad-MIT-id", "part": "action word", "mean": "said that something was true, even though it was hard to say", "ex": "He admitted that he had eaten the last cookie."}, {"w": "unusual", "syl": "un·u·su·al", "say": "un-YOO-zhoo-ul", "part": "describing word", "mean": "not common; different from what normally happens", "ex": "It is unusual to see snow in the desert."}, {"w": "route", "syl": "route", "say": "ROOT", "part": "naming word", "mean": "the way you plan to go to get somewhere", "ex": "We took the shortest route to school."}], "qs": [{"p": 0, "q": "How were Dev's map and Lucy's map different?", "opts": ["One was very old, and the other was brand new.", "One was for hikers, and the other was for boats."], "right": "One showed trails, and the other showed the shape of the land."}, {"p": 1, "q": "Why did Dev stop being angry?", "opts": ["He found out that he had won the contest.", "Ms. Abara blew her whistle and called him back."], "right": "He became worried when he could not see Lucy anymore."}, {"p": 2, "q": "How did the two friends finally find the way?", "opts": ["They asked another team for directions.", "They followed the sound of the whistle."], "right": "They put both maps together."}, {"p": 2, "q": "What does \"It was as if a light had come on\" mean here?", "opts": ["It got brighter in the forest.", "Someone turned on a flashlight."], "right": "They suddenly understood what to do."}, {"p": 3, "q": "Why did Ms. Abara give them two different maps?", "opts": ["She ran out of the same kind of map.", "She wanted one of them to get lost."], "right": "She wanted them to learn to work together."}], "moral": "Other people may see things that you cannot. When you listen and work together, you get further."}, {"id": "echoes", "title": "The Boy Who Collected Echoes", "topic": "Fantasy", "teaser": "Wren keeps sounds in glass jars. Then the jars begin to talk back.", "pages": [{"scene": "mountain", "art": ["🫙", "⛰️", "👦"], "paras": ["High in the hills above Tamber Town lived a boy named Wren, who collected echoes. He did not collect stamps or coins, like other children. He kept echoes in glass jars.", "It was an odd talent, and nobody could explain it. Wren would climb to a canyon, shout a word, and catch the echo in a jar before it faded. Then he would screw the lid on tight. When he opened the jar later, out came the sound, as fresh as the day he had caught it.", "He owned hundreds of them. There was a jar of thunder, and a jar of a train whistle. There was his favorite, a jar in which a canyon said his own name, over and over. \"Wren, Wren, Wren,\" it would say. He liked that one best because it agreed with everything.", "Wren had no time for other people. They talked too much, and they said things that he did not want to hear. His jars never argued. When his mother asked him to come to the village festival, he shook his head.", "\"I'm busy,\" he said, and he opened the jar with his name in it."]}, {"scene": "night", "art": ["🫙", "✨", "🌙"], "paras": ["One night, a strange sound woke him. It was coming from his shelf. A soft murmur rose from the jars, though every lid was shut tight. Wren held up his candle and crept closer.", "A small voice came from the jar of his name. \"Wren,\" it said. \"Wren, Wren.\" Then, very quietly, it added something new. \"Is that all there is?\"", "Wren almost dropped the candle. Echoes could not say new things. Echoes could only repeat. \"Who said that?\" he whispered.", "\"Who said that?\" answered the jar. \"Who said that? Who said that?\"", "Then all of the jars began to whisper together, each one saying the only thing it knew. Thunder, whistle, name, thunder, whistle, name. The noise grew until the glass began to tremble. It was not a pleasant noise. It sounded lonely. It sounded like a crowded room in which nobody was listening to anybody.", "Wren covered his ears. In the morning, he took down the jar with his name in it, and he stared at it for a long time. He had the uneasy feeling that it was no longer enough."]}, {"scene": "forest", "art": ["🦉", "🌳", "🫙"], "paras": ["He carried the jar up to the Old Listener, a woman who lived in a hollow tree at the top of the pass. People said that she was the wisest person in the hills. They also said that she almost never spoke.", "Wren told her everything. It took a long time. The Old Listener sat with her eyes half closed and did not interrupt him. When he finished, he felt strangely lighter.", "\"That was the first time anyone has listened to me all the way through,\" he said, surprised.", "She nodded. \"An echo gives you back your own voice,\" she said. Her voice was dry and soft, like leaves. \"That feels safe. But an echo can never surprise you. It will never teach you anything, and it will never ask how you are.\"", "\"So what should I do?\"", "\"You came here with a question, and you listened to my answer,\" she said. \"You have already started.\"", "Wren looked down at the jar. He thought of his mother, who asked about his day. He thought of the children in the village, who had stopped inviting him to play. He had thought that their voices were noise. Now he was not so sure."]}, {"scene": "town", "art": ["🎪", "🎶", "🫙"], "paras": ["The festival was still going on when Wren came down the hill. He carried a large sack over his shoulder, and the jars clinked inside it. He stood at the edge of the square, feeling awkward. Everyone was talking at once. Then a girl with flour on her nose noticed him.", "\"You're the jar boy,\" she said. \"What's it like, up there?\"", "It was a question that he had not expected. An echo would never have asked it. So he told her, and then he asked about her, and it turned out that she baked bread and wanted to sail on a ship one day. He had never thought about bread or ships. It was remarkable how much he did not know.", "When the sun began to set, Wren climbed onto the fountain, and a crowd gathered. One by one, he opened his jars. Thunder rolled across the square. A train whistled through the air. Children shrieked and clapped. The echoes rose and faded into the evening, free at last.", "Only one jar was left. Wren looked at the jar with his name in it. Then he handed it to the girl with flour on her nose.", "\"Open it,\" he said. \"I would rather hear someone else say it.\"", "\"Wren,\" she said, and she laughed. He laughed too. It was a much better sound than the echo."]}], "words": [{"w": "collected", "syl": "col·lect·ed", "say": "kuh-LEK-tid", "part": "action word", "mean": "gathered things and kept them together", "ex": "She collected shells at the beach all summer."}, {"w": "repeat", "syl": "re·peat", "say": "rih-PEET", "part": "action word", "mean": "say or do something again", "ex": "Please repeat the question so that I can hear it."}, {"w": "murmur", "syl": "mur·mur", "say": "MUR-mer", "part": "naming word", "mean": "a soft, low sound of voices or water", "ex": "I could hear the murmur of the stream outside."}, {"w": "tremble", "syl": "trem·ble", "say": "TREM-bul", "part": "action word", "mean": "shake in small, quick movements", "ex": "The cold wind made the little puppy tremble."}, {"w": "interrupt", "syl": "in·ter·rupt", "say": "in-tuh-RUPT", "part": "action word", "mean": "stop someone while they are talking or doing something", "ex": "Please do not interrupt when your sister is speaking."}, {"w": "remarkable", "syl": "re·mark·a·ble", "say": "rih-MAR-kuh-bul", "part": "describing word", "mean": "so unusual or special that people notice", "ex": "The tiny girl lifted the bag with remarkable strength."}], "qs": [{"p": 0, "q": "What did Wren like about his jars?", "opts": ["They were worth a lot of money.", "They kept his candles and food safe."], "right": "They never argued and said only what he wanted to hear."}, {"p": 1, "q": "What did the sound of the whispering jars remind Wren of?", "opts": ["A happy party with his friends.", "A big storm over the ocean."], "right": "A lonely, crowded room where nobody listens."}, {"p": 2, "q": "What was special about the way the Old Listener treated Wren?", "opts": ["She gave him a much larger jar.", "She told him to leave the hills forever."], "right": "She listened to him all the way through."}, {"p": 2, "q": "What is the difference between an echo and a real person, in this story?", "opts": ["A real person is louder than an echo.", "An echo tells you many new things."], "right": "A real person can surprise you and ask how you are."}, {"p": 3, "q": "Why did Wren give the last jar to the girl?", "opts": ["He wanted her to carry it home for him.", "The jar had gotten too heavy for him."], "right": "He now wanted to hear other people, not only himself."}], "moral": "Listening to others teaches us more than only hearing what we already think."}, {"id": "octopus", "title": "The Octopus Who Opened Doors", "topic": "Science", "teaser": "Something keeps emptying the crab tank at night, and the security camera is about to show who.", "pages": [{"scene": "ocean", "art": ["🐙", "🦀", "🔦"], "paras": ["The Harbor Point Aquarium had a mystery that nobody could explain. Every few mornings, when the staff arrived, they discovered that a crab or two had vanished from the crab tank, even though the lid was still closed and the doors were still locked.", "Zara Kim, whose mother was the head biologist, spent every afternoon at the aquarium after school. She had a theory, and she had written it in her science notebook. \"It has to be someone who works here at night,\" she told her mother. \"Who else could get inside?\"", "Her mother smiled, because she liked it when Zara reasoned things through. \"That is a sensible hypothesis,\" she said. \"A hypothesis is a smart guess that you can test. So how would you test yours?\"", "Zara thought hard. Guessing was easy, but proving something was much more difficult. The next day, she and her mother borrowed a small camera from the gift shop and pointed it directly at the crab tank. They switched it on before closing time, locked the building, and went home. Zara hardly slept that night, because she was certain that she would catch a thief."]}, {"scene": "ocean", "art": ["🎥", "🐙", "💧"], "paras": ["In the morning, they carried the camera into the office and watched the recording at high speed. For hours, nothing moved except the slow bubbles in the tanks. Then, at 2:14 in the morning, something flowed across the bottom of the picture.", "Zara leaned forward. A long, rust-colored arm slid over the rim of the tank next door, followed by a second arm and a third. Then a whole soft body poured itself onto the wet floor, as smoothly as syrup running off a spoon.", "\"That's Houdini!\" Zara cried. Houdini was the giant Pacific octopus, named after a famous escape artist, although everyone had believed that the name was only a joke.", "The octopus crossed the floor, climbed the crab tank, and pushed up the heavy lid with its strong arms. It snatched a crab, slipped back down, and returned to its own tank. Finally, it reached up and pulled its own lid closed behind it.", "Zara's mouth hung open. Her mother was laughing so hard that she had to wipe her eyes. \"All that time,\" she said, \"our thief was living right next door.\""]}, {"scene": "lab", "art": ["🧠", "🐙", "📓"], "paras": ["Zara crossed out her theory, and she was surprised to find that she did not mind being wrong. Being wrong had led her to something far more amazing than a burglar. She spent the next week learning everything that she could about octopuses, and each fact seemed stranger than the last.", "An octopus has three hearts and blue blood. It has no bones at all, so it can squeeze through any opening that is larger than its hard beak. Most of its brain cells are in its arms, which means that each arm can taste and feel things almost on its own. It can also change its color and its skin texture in less than a second.", "\"Why would an animal with such a short life be so intelligent?\" Zara asked. A giant Pacific octopus lives only three to five years.", "\"Scientists are still trying to understand that,\" her mother admitted. \"That's one of the wonderful things about science. Each answer opens a door to ten new questions.\"", "Zara looked up at Houdini through the glass. One large golden eye looked back at her, and she had the odd feeling that she was being studied as well."]}, {"scene": "ocean", "art": ["🧩", "🐙", "🏆"], "paras": ["Now the aquarium had a new problem. They could not simply put a heavier lid on the tank, because an intelligent animal that has nothing to do becomes bored and unhealthy. \"He isn't being naughty,\" Zara's mother explained. \"He's curious, and he needs something to think about.\"", "So Zara proposed an experiment. Instead of stopping Houdini's adventures, why not give him better ones? With help from the staff, she built a clear plastic box that had a screw-top lid, and she put a crab inside. On the first day, Houdini poked at the box for fifty minutes before he finally unscrewed the lid. On the second day, it took him eleven minutes. By the fifth day, he finished in less than two minutes.", "Zara recorded all of the times in a neat chart, and then she made a harder puzzle, with two latches and a sliding door. The crabs in the tank next door were never bothered again.", "A month later, the aquarium opened a new display, with a sign beside Houdini's tank that read: \"Puzzle designed by Zara Kim, age nine.\" Visitors crowded around to watch, and Zara stood among them with her notebook. On its first page, she had written a new rule for herself: \"Being wrong is not the end of an experiment. It is often the most interesting part.\""]}], "words": [{"w": "hypothesis", "syl": "hy·poth·e·sis", "say": "hy-POTH-uh-sis", "part": "naming word", "mean": "a smart guess that you can test to see if it is true", "ex": "My hypothesis is that plants grow faster in sunlight."}, {"w": "biologist", "syl": "bi·ol·o·gist", "say": "by-OL-uh-jist", "part": "naming word", "mean": "a scientist who studies living things", "ex": "The biologist counted the frogs in the pond."}, {"w": "texture", "syl": "tex·ture", "say": "TEKS-cher", "part": "naming word", "mean": "how the surface of something feels, like rough or smooth", "ex": "The texture of the bark was bumpy and dry."}, {"w": "intelligent", "syl": "in·tel·li·gent", "say": "in-TEL-uh-junt", "part": "describing word", "mean": "able to learn, understand, and solve problems quickly", "ex": "Crows are intelligent birds that can use simple tools."}, {"w": "experiment", "syl": "ex·per·i·ment", "say": "ik-SPAIR-uh-ment", "part": "naming word", "mean": "a careful test to find out whether an idea is true", "ex": "Our experiment showed that salt makes ice melt faster."}, {"w": "curious", "syl": "cu·ri·ous", "say": "KYOOR-ee-us", "part": "describing word", "mean": "wanting to know or learn about something", "ex": "The curious kitten looked inside every box."}], "qs": [{"p": 0, "q": "What was Zara's first theory about the missing crabs?", "opts": ["The crabs had escaped through a hole in the tank.", "A seagull was flying in through the window."], "right": "Someone who worked at the aquarium at night was taking them."}, {"p": 1, "q": "How did Zara and her mother test the theory?", "opts": ["They stayed in the building all night.", "They asked the workers many questions."], "right": "They set up a camera aimed at the crab tank."}, {"p": 2, "q": "Why can an octopus fit through very small openings?", "opts": ["It can make its beak disappear.", "It can break the glass with its arms."], "right": "It has no bones, so only its hard beak limits it."}, {"p": 3, "q": "Why did Zara build puzzles instead of using a heavier lid?", "opts": ["The aquarium could not find a heavier lid.", "Heavy lids would frighten all of the visitors."], "right": "A smart animal needs something to think about to stay healthy."}, {"p": 3, "q": "What did Zara's chart of the times show?", "opts": ["Houdini lost interest in the crabs.", "The box was getting harder each day."], "right": "Houdini kept getting faster at opening the box."}], "moral": "Stay curious and test your ideas. Being wrong can lead you to something even better."}, {"id": "stones", "title": "The Bridge of Borrowed Stones", "topic": "Folktale", "teaser": "Two villages have not spoken in sixty years. Then the river rises.", "pages": [{"scene": "river", "art": ["🌉", "🏘️", "🌊"], "paras": ["Long ago, in a valley between two green ridges, the villages of Alder and Birch stood on opposite banks of the Silver River. Although their houses were so close that a strong boy could throw a pebble across the water, the people had not spoken to each other for sixty years.", "Nobody remembered exactly how the quarrel had started. Some people in Alder claimed that it began over a stolen goat, while some in Birch insisted that it was over a song that was sung badly at a wedding. Whatever the cause, the grudge had been passed along from grandparents to parents to children, like a heavy old coat that nobody wanted but nobody would throw away.", "A girl named Linnea lived in Alder with her grandmother, who was the village healer. A boy named Tomas lived in Birch, where his father made the best bread in the valley. They had never exchanged a word, but each summer they fished on opposite sides of the water, and sometimes, when no one was looking, they waved."]}, {"scene": "river", "art": ["🌧️", "🌊", "🌾"], "paras": ["That year, the spring rains refused to stop. The Silver River swelled until it roared, brown and furious, and it tore away the only road that led out of the valley. The people of Alder had plenty of medicine, since Linnea's grandmother kept shelves of it, but their grain had been spoiled by the flood. The people of Birch had full barns of grain, but a fever had begun to spread through their houses, and they had no medicine at all.", "Linnea watched the opposite bank from her window, and she noticed that no smoke rose from many of Birch's chimneys. \"They are sick over there,\" she said to her grandmother. \"We should help them.\"", "Her grandmother's face was troubled. \"I would gladly help,\" she said, \"but the elders will never allow it. And how could anyone cross that water?\"", "On the other side, Tomas stood with a sack of flour in his arms, looking across at thin, hungry children in Alder. Then his eyes met Linnea's through the rain. She pointed to the river and raised both hands as if to ask a question. He looked at the water, and he slowly nodded."]}, {"scene": "river", "art": ["🪨", "🧒", "👧"], "paras": ["Linnea and Tomas each had the same idea. In the shallowest part of the river, at a place called the Narrows, large rocks rose from the water like the backs of sleeping cows. If someone could fill the gaps between them, a person might walk across.", "The next morning, Linnea began to carry stones to the water's edge. She could only manage small ones, and the current swallowed many of them at once, yet she kept going. On the far bank, Tomas was doing the same thing. People came out to stare at them.", "\"Foolish children,\" muttered old Mr. Hask of Alder. \"Those stones are from my wall! Bring them back!\"", "\"I am only borrowing them,\" Linnea called, without stopping. \"You will get them back when the bridge is no longer needed.\"", "Mr. Hask opened his mouth, and then he closed it. He watched the small girl stagger under another stone. It occurred to him that he had a wheelbarrow, and that she did not. After a long and uncomfortable silence, he went to get it. By noon, a dozen others had joined him, and on the far shore, the people of Birch had begun to work as well."]}, {"scene": "town", "art": ["🌉", "🥖", "🌿"], "paras": ["The bridge took nine days to build. Each village worked from its own bank, and the two lines of stone crept toward each other through the rushing water. When the last gap was finally closed, nobody knew what to do. The people stood at opposite ends of the bridge, looking at each other in awkward silence. Sixty years is a very long time.", "Then Tomas walked out to the center, carrying a loaf of bread, and Linnea walked out carrying a basket of medicine. They traded in the middle, as simply as if they had done so every day of their lives.", "Within a month, the fever had passed and every family had enough to eat. The rain stopped, and the river sank back to its gentle summer voice. Mr. Hask came to the bridge one evening and told Linnea that he supposed he could have his stones back now. Then he looked across at a man from Birch, who was showing him how to mend a fishing net, and he shook his head.", "\"Never mind,\" he said. \"A wall only keeps people out. Let the stones stay where they are.\"", "The bridge still stands today, and nobody can remember how the quarrel began. But each spring, the children of both villages add one new stone, so that nobody forgets how it ended."]}], "words": [{"w": "quarrel", "syl": "quar·rel", "say": "KWOR-ul", "part": "naming word", "mean": "an angry argument between people", "ex": "The brothers had a quarrel about whose turn it was."}, {"w": "grudge", "syl": "grudge", "say": "GRUJ", "part": "naming word", "mean": "a bad feeling toward someone that lasts for a long time", "ex": "He held a grudge because she had not invited him."}, {"w": "furious", "syl": "fu·ri·ous", "say": "FYOOR-ee-us", "part": "describing word", "mean": "extremely angry or wild", "ex": "The furious wind ripped the flag from its pole."}, {"w": "elders", "syl": "el·ders", "say": "EL-derz", "part": "naming word", "mean": "older people who are respected and help make decisions", "ex": "The elders of the town met to choose a new leader."}, {"w": "stagger", "syl": "stag·ger", "say": "STAG-er", "part": "action word", "mean": "walk in an unsteady way, almost falling", "ex": "The heavy box made him stagger across the room."}, {"w": "awkward", "syl": "awk·ward", "say": "AWK-werd", "part": "describing word", "mean": "uncomfortable or not sure what to do", "ex": "There was an awkward pause after she forgot his name."}], "qs": [{"p": 0, "q": "Why did the two villages not speak to each other?", "opts": ["The river had always been too loud for talking.", "They spoke two different languages."], "right": "An old quarrel had been passed down, and nobody remembered how it began."}, {"p": 1, "q": "What did each village need from the other?", "opts": ["Alder needed medicine, and Birch needed grain.", "Both villages needed more fishing boats."], "right": "Alder needed grain, and Birch needed medicine."}, {"p": 2, "q": "Why did Mr. Hask go and get his wheelbarrow?", "opts": ["He planned to carry his stones back home.", "The elders had ordered him to help."], "right": "He saw how hard Linnea was working and decided to help."}, {"p": 3, "q": "What did Mr. Hask mean by \"A wall only keeps people out\"?", "opts": ["His wall had never been very well made.", "People should never build walls around their gardens."], "right": "Being connected to others is better than staying apart."}, {"p": 3, "q": "Why do the children add a new stone each spring?", "opts": ["The river washes one stone away each year.", "It is a contest to see who is the strongest."], "right": "It helps everyone remember how the two villages came together."}], "moral": "Old anger helps no one. People who work together can solve what no one can solve alone."}, {"id": "seed", "title": "Nadia's Slowest Seed", "topic": "Friends", "teaser": "Everyone else's plant is winning the class contest. Nadia's is still a pot of dirt.", "pages": [{"scene": "school", "art": ["🌱", "🪴", "🏫"], "paras": ["On the first day of March, Mr. Ortega placed a small envelope on each desk in Room 14. \"Inside is a seed,\" he announced, \"and each seed is different. I'm not going to tell you what kind you have. Your job is to plant it, care for it, and keep a journal of what you observe. On the last day of school, we will have a plant fair.\"", "Nadia Haddad was delighted, because she loved contests and she usually won them. She planted her seed with great precision, pushing it exactly one inch deep, and she labeled her pot with neat letters. Then she placed it on the windowsill and waited.", "A week later, Marcus's bean plant had shot up four inches. Sofia's sunflower had two bright leaves. By the end of the month, the whole windowsill was a small jungle of green, except for one pot, which held nothing but dirt.", "\"Maybe yours is dead,\" Marcus said, trying to be helpful. \"You could ask for another one.\"", "Nadia gave him a stony look, but that night she could not stop thinking about it. What if he was right?"]}, {"scene": "home", "art": ["📓", "💧", "☁️"], "paras": ["All through April, Nadia watered her pot and wrote in her journal, although there was hardly anything to write. \"April 3: No change. April 9: No change. April 15: Still no change.\" Her entries grew shorter and more discouraged. Meanwhile, the other students were writing about buds, flowers, and even tiny green tomatoes.", "It was difficult to keep caring for something that gave nothing back. One morning, she was so frustrated that she almost tipped the whole pot into the trash can. She stood there for a long moment, holding it over the bin.", "\"You've been very faithful with that pot,\" said a voice behind her. It was Mr. Ortega, carrying his coffee. \"Most people would have quit by now.\"", "\"It isn't doing anything,\" Nadia said. Her throat felt tight. \"I did everything right, and it isn't fair.\"", "Mr. Ortega looked at the pot, and then he looked at her. \"You can only see the top of the dirt,\" he said. \"Are you sure that nothing is happening?\"", "Nadia did not know how to answer that. She returned the pot to the windowsill, gave it a small drink of water, and went to her seat."]}, {"scene": "school", "art": ["🌱", "👀", "🌷"], "paras": ["By May, most of the plants had started to look tired. Marcus's bean had grown so fast that its thin stem flopped over, and it needed a stick to hold it up. Sofia's sunflower had dropped several of its leaves. Nadia kept watering her dirt, and she stopped comparing it with anyone else's plant, because comparing only made her feel terrible.", "Then, on a rainy Tuesday in the middle of May, she noticed something. In the center of the pot, the soil had cracked. Under the crack there was something pale and thick, about the width of her thumb, pushing its way upward.", "She opened her journal with shaking hands. \"May 16: IT'S ALIVE!\" she wrote, and she underlined it three times.", "After that, the seedling grew steadily. It didn't race upward like the bean. Instead it grew slowly, with a thick stem and leaves that were dark and strong. Mr. Ortega came over and measured it with her, and he looked pleased, although he still refused to tell her what it was.", "\"Some seeds spend months growing downward first,\" was all that he would say. \"They are building roots, where nobody can see.\""]}, {"scene": "garden", "art": ["🌳", "🏅", "🌞"], "paras": ["At last, the day of the plant fair arrived. Parents wandered through the room, admiring tall stalks and bright flowers. Marcus won a ribbon for the tallest plant, and Sofia won for the prettiest bloom. Nadia's plant was only seven inches tall, and it had no flowers at all. She waited for the jealousy to hit her, but to her surprise, it didn't come. She cheered for her friends and meant it.", "Then Mr. Ortega clapped his hands. \"I have one more thing to share,\" he said. He set Nadia's pot on the front table and turned to the class. \"This is an oak tree. It sprouted from an acorn. A bean plant lives for one summer. This tree, if we plant it well, could live for three hundred years.\"", "The room went quiet. Nadia stared at her small, stubborn plant.", "That afternoon, the whole class walked outside and planted it beside the playground, where there would be plenty of room for it to spread. Nadia pressed the soil down with her own hands.", "\"It'll be a hundred years before this gives anyone real shade,\" said Marcus, looking down at it.", "\"I know,\" said Nadia, smiling. \"It's not in any hurry.\" Then she picked up her journal and wrote her final entry: \"Day 91. Worth the wait.\""]}], "words": [{"w": "observe", "syl": "ob·serve", "say": "ub-ZURV", "part": "action word", "mean": "watch something carefully to learn about it", "ex": "We observe the birds at the feeder each morning."}, {"w": "precision", "syl": "pre·ci·sion", "say": "prih-SIZH-un", "part": "naming word", "mean": "being very exact and careful", "ex": "She cut the paper with great precision."}, {"w": "discouraged", "syl": "dis·cour·aged", "say": "dis-KUR-ijd", "part": "describing word", "mean": "having lost hope or the wish to keep trying", "ex": "He felt discouraged after losing five games."}, {"w": "frustrated", "syl": "frus·trat·ed", "say": "FRUS-tray-tid", "part": "describing word", "mean": "upset because you cannot do what you are trying to do", "ex": "I felt frustrated when the zipper got stuck again."}, {"w": "jealousy", "syl": "jeal·ous·y", "say": "JEL-uh-see", "part": "naming word", "mean": "an unhappy feeling of wanting what someone else has", "ex": "A flash of jealousy hit him when his friend won."}, {"w": "stubborn", "syl": "stub·born", "say": "STUB-urn", "part": "describing word", "mean": "refusing to change or give up", "ex": "The stubborn mule would not cross the bridge."}], "qs": [{"p": 0, "q": "What was different about Nadia's pot in the first weeks?", "opts": ["It had grown the tallest plant in class.", "Someone had knocked it off the windowsill."], "right": "Nothing seemed to be growing in it."}, {"p": 1, "q": "Why did Nadia almost throw her pot in the trash?", "opts": ["Mr. Ortega told her to start over.", "The pot had cracked in half."], "right": "She was frustrated because it was not changing."}, {"p": 2, "q": "According to Mr. Ortega, what was happening while nothing could be seen?", "opts": ["The seed was sleeping until summer came.", "The seed needed a different kind of pot."], "right": "The seed was building roots under the soil."}, {"p": 3, "q": "What was Nadia's plant?", "opts": ["A sunflower", "A bean plant"], "right": "An oak tree"}, {"p": 3, "q": "How did Nadia change during the story?", "opts": ["She stopped entering contests of any kind.", "She became jealous of all of her friends."], "right": "She stopped comparing herself to others and learned to be patient."}], "moral": "Good things can take a long time. Do not compare your progress with others, and keep going."}, {"id": "substitute", "title": "The Substitute Who Knew Everything", "topic": "Funny", "teaser": "Mr. Pomfrey has an answer for every question. Most of those answers are completely wrong.", "pages": [{"scene": "school", "art": ["👨‍🏫", "📚", "🤔"], "paras": ["When Ms. Lee came down with the flu, Room 9 got a substitute teacher named Mr. Pomfrey. He was a tall, thin man with an impressive mustache and a voice like a trumpet, and he began by writing his name on the board in enormous letters.", "\"You are extremely fortunate,\" he informed them. \"I happen to know everything. Ask me anything you like.\"", "The class looked at each other. Ben Adler, who loved questions the way that other kids love candy, raised his hand. \"Why is the sky blue?\"", "\"Simple,\" said Mr. Pomfrey, without even pausing. \"It reflects the ocean. A very common fact.\"", "Ben frowned. He had read something different in a library book, about sunlight being scattered by the air. \"Are you sure?\" he asked.", "\"Young man,\" said Mr. Pomfrey, puffing out his chest, \"I'm never unsure.\"", "By lunchtime, he had informed Room 9 that bats were a kind of bird, that spiders had six legs, and that the capital of Australia was Kangaroo. He said each of these things with such confidence that half the class wrote them down."]}, {"scene": "school", "art": ["📝", "🕷️", "😂"], "paras": ["At lunch, Ben and his friend Amara compared notes. \"He's wrong about nearly everything,\" Ben said, dropping his sandwich. \"Spiders have eight legs! I've counted them.\"", "\"So tell him,\" said Amara.", "\"I did! He told me that I must have counted a very unusual spider.\"", "In the afternoon, things got worse. During science, Mr. Pomfrey announced that the moon made its own light, and he drew a confusing diagram on the board that had a great many arrows. During math, he got a different answer each time he added the same three numbers, and he declared that numbers were \"sometimes moody on Tuesdays.\"", "Most of the class found this hilarious. But Ben noticed that little Oliver in the front row looked upset. Oliver had a spelling and science quiz on Friday, and he was copying everything carefully into his notebook, every wrong fact of it.", "Ben felt uneasy. It was funny, up to a point. Then it stopped being funny, because people could actually believe those things. Yet what could a nine-year-old do about a grown-up with such a magnificent mustache?"]}, {"scene": "town", "art": ["📖", "🦇", "🕵️"], "paras": ["After school, Ben and Amara went to the public library and made a list of everything that Mr. Pomfrey had said. Ms. Vance, the librarian, helped them to look up each fact in reliable books. It was slow work, but very satisfying, and by closing time they had a page full of corrections, along with the name of the book that proved each one.", "\"Should we show this to the principal?\" Amara asked. \"He'd be in big trouble.\"", "Ben thought about that. Mr. Pomfrey wasn't being mean. He seemed to think that a teacher must never say \"I don't know,\" and Ben wondered why anyone would believe something so strange.", "\"Let's just show him first,\" Ben said. \"Privately. It's only fair.\"", "The next morning, they arrived early. Mr. Pomfrey was alone in the classroom, looking at his reflection in the window and combing his mustache. Ben held out the page, and his hand trembled a little. \"We looked some things up,\" he said. \"We think that you might want to see this.\"", "Mr. Pomfrey took the page with a snort and started to rea
