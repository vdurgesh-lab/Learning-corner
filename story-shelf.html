ar her knee, to show how small. \"Then, the war. No more shop.\" She tapped the rusty old frame of her bike. \"He make this one. From old parts. Very good bike.\"", "Cal didn't know what to say. All of a sudden, the rusty bike looked quite different to him. It was the only thing she had from her father's shop, and he had been making jokes about it for weeks."]}, {"scene": "school", "art": ["🚲", "🌈", "🧑‍🤝‍🧑"], "paras": ["She spun the pedal, and the chain ran smoothly. \"Now okay,\" she said, wiping her hands. \"But slow, on hill.\"", "\"Thank you,\" said Cal. It seemed like much too small a thing to say. He tried again. \"I'm sorry. About what I called your bike. That was really mean.\" He wasn't sure how much she understood, so he pointed to her bike and put his hand on his heart. \"It's a good bike.\"", "A small smile appeared on her face, and it was the first that he'd seen there. \"I know,\" she said.", "They rode to the top of Dunmore Hill together. On Monday, Cal walked up to her in the bike rack with a problem that he had made up, about a squeaky brake. In return for her help, he showed her how to say \"brake,\" \"gear,\" and \"handlebar.\" Soon she was fixing bikes for half the class, and they were teaching her new words. It turned out that she was very funny, once she had enough words to be funny with. She'd never been stuck up at all. She had simply been waiting for someone to be patient.", "By spring, there was a sign on the school bike rack, made by Cal and decorated with tiny gears. \"Free Repairs Fridays. Ask Yusra.\" And nobody ever called her bicycle \"the Antique\" again, unless she said it first."]}], "words": [{"w": "expression", "syl": "ex·pres·sion", "say": "ik-SPRESH-un", "part": "naming word", "mean": "the look on someone's face that shows how they feel", "ex": "She had a puzzled expression on her face."}, {"w": "battered", "syl": "bat·tered", "say": "BAT-erd", "part": "describing word", "mean": "damaged from being used or hit many times", "ex": "He wore a battered old hat with holes in it."}, {"w": "antique", "syl": "an·tique", "say": "an-TEEK", "part": "naming word", "mean": "something very old that is often valuable", "ex": "My grandmother's rocking chair is an antique."}, {"w": "determined", "syl": "de·ter·mined", "say": "dih-TUR-mind", "part": "describing word", "mean": "having made up your mind and not letting anything stop you", "ex": "The determined runner finished the race in spite of the rain."}, {"w": "astonished", "syl": "as·ton·ished", "say": "uh-STON-isht", "part": "describing word", "mean": "very surprised", "ex": "We were astonished to see a deer in the school yard."}, {"w": "decorated", "syl": "dec·o·rat·ed", "say": "DEK-uh-ray-tid", "part": "action word", "mean": "added things to make something look nicer", "ex": "We decorated the room with paper stars."}], "qs": [{"p": 0, "q": "Why didn't Yusra talk much in class?", "opts": ["She did not like any of the other kids.", "Her teacher had told her not to speak."], "right": "She was still learning English."}, {"p": 0, "q": "What did Cal and the others wrongly believe about Yusra?", "opts": ["That she was afraid of bicycles", "That she was much older than they were"], "right": "That she thought she was too good for them"}, {"p": 2, "q": "How did Yusra know how to fix a chain?", "opts": ["She had learned it from a video at school.", "Cal explained each of the steps to her."], "right": "She had helped in her father's bicycle shop."}, {"p": 2, "q": "Why did the bike suddenly look different to Cal?", "opts": ["It had been cleaned and painted by the rain.", "He saw that it had twenty-one gears."], "right": "He learned it was all she had from her father's shop."}, {"p": 3, "q": "What does the story show about why Yusra had been quiet?", "opts": ["She never wanted any friends at all.", "She was quiet because she was stuck up."], "right": "She had just been waiting for people to be patient with her."}], "moral": "Do not judge people before you know them. Being new can be hard, and everyone has a story."}, {"id": "bees", "title": "The Beekeeper's Apprentice", "topic": "Courage", "teaser": "Jonah is terrified of bees. His summer job is taking care of forty thousand of them.", "pages": [{"scene": "garden", "art": ["🐝", "🍯", "🌻"], "paras": ["Jonah Adeyemi was afraid of exactly one thing, and it was the size of a paper clip. When he was five, a bee had stung him on the lip at a picnic. His whole face had puffed up like a loaf of bread. Ever since then, a single buzz was enough to send him running indoors, even if he had to abandon a perfectly good sandwich.", "So it was very unlucky that his mother had arranged for him to spend the summer with her aunt, Great-Aunt Folake, a retired nurse who lived on a small farm in the hills. Great-Aunt Folake kept bees. She kept a lot of them. A row of white wooden boxes stood along the edge of her meadow, and from sunrise to sunset, the air above them hummed.", "\"Forty thousand in each hive, more or less,\" she said cheerfully, as she handed him a glass of cold lemonade. Jonah counted the boxes from the safety of the porch. There were six. \"I need an apprentice this summer, since my knees aren't what they were.\"", "\"I can't,\" said Jonah. His voice came out as a squeak. \"I can do the dishes, though. I'd like to do the dishes all summer.\""]}, {"scene": "home", "art": ["📖", "🐝", "🔬"], "paras": ["Great-Aunt Folake didn't laugh, and she didn't tell him that he was being silly. She only nodded. \"Fear is sensible,\" she said. \"It wants to protect you. But it doesn't always have the correct information. So for now, let's just give it some better information.\"", "For the first week, Jonah never went near the hives. He sat on the porch with her old bee books, and each evening they talked about what he had read. He learned that a worker bee can sting only once, and that she dies when she does it, so she won't sting unless she is frightened. He learned that bees talk to each other by dancing, wiggling in a pattern that tells the others where the flowers are. He learned that a single bee makes only about a twelfth of a teaspoon of honey in her whole life.", "\"A twelfth of a teaspoon,\" he said, looking at the jar on the table. It seemed amazing. How many thousands of tiny lives were in that one jar?", "In the second week, she moved his chair off the porch and ten steps closer to the meadow. In the third week, she moved it ten steps closer again. Jonah noticed that, although his heart still thumped, it wasn't thumping quite so hard."]}, {"scene": "garden", "art": ["🧑‍🌾", "🐝", "🌫️"], "paras": ["By August, Jonah could stand next to the hives in a white suit and veil. His legs shook on the first day, but he stayed. Great-Aunt Folake showed him how to move slowly, and how to puff a little cool smoke at the entrance so that the bees would stay calm. When she lifted out a frame covered in bees, he made himself look. They crawled across the golden wax, busy and orderly, paying no attention to him at all.", "\"Would you like to hold it?\" she asked. She didn't push him, and she never did.", "He took a shaky breath, and he took hold of the wooden frame. It was heavier than he had expected, and it vibrated faintly in his hands, like a purring cat. A bee walked across his glove. He watched it, and the fear rose up in him, but he breathed slowly, and the bee walked off again.", "\"Good,\" she said quietly. \"Being scared and staying steady. That's the whole secret.\"", "Then, one hot afternoon, she stumbled on a root as she was walking toward the far hive. There was a sharp crack from her knee, and she went down hard. She tried to rise, but she could not. \"Oh, bother,\" she said, her face gray with pain. Then she looked at the hive that she'd knocked against, and Jonah saw it too."]}, {"scene": "garden", "art": ["🐝", "🚑", "🍯"], "paras": ["The hive had been jolted off its stand. A dark, angry cloud of bees was boiling out of it, right above where she lay. Great-Aunt Folake wasn't wearing her veil.", "There was no time to go for the suit. For one second, Jonah was five years old again, with a swollen face. His whole body told him to run for the house. Then he thought, \"Move slowly. Bees sting when they're frightened. Use the smoke.\"", "The smoker was still in his hand. He walked straight toward the cloud. He was not running, because he knew that running would make things worse. He puffed the cool smoke over the fallen hive, again and again, with his hands trembling. The bees began to settle. He reached under his great-aunt's arm, and she pushed with her good leg, and slowly, step by step, they made it across the meadow to the porch. He called for an ambulance from the kitchen phone.", "Jonah got stung twice on the wrist. It hurt, and it swelled up a little, and then it got better. It was not nearly as bad as he had feared for six years.", "At the end of the summer, she gave him a jar of honey with a label written in her neat handwriting. \"Harvested by Jonah Adeyemi, Beekeeper.\" And he kept that jar, long after the honey was gone."]}], "words": [{"w": "apprentice", "syl": "ap·pren·tice", "say": "uh-PREN-tiss", "part": "naming word", "mean": "someone who learns a skill by working with an expert", "ex": "The baker's apprentice learned to make bread."}, {"w": "information", "syl": "in·for·ma·tion", "say": "in-fer-MAY-shun", "part": "naming word", "mean": "facts or details about something", "ex": "The map gave us information about the trails."}, {"w": "frightened", "syl": "fright·ened", "say": "FRY-tund", "part": "describing word", "mean": "feeling afraid", "ex": "The frightened rabbit hid under the bush."}, {"w": "vibrated", "syl": "vi·brat·ed", "say": "VY-bray-tid", "part": "action word", "mean": "shook with quick, tiny movements", "ex": "The phone vibrated on the table."}, {"w": "jolted", "syl": "jolt·ed", "say": "JOHL-tid", "part": "action word", "mean": "moved suddenly and roughly", "ex": "The car jolted when it hit the bump."}, {"w": "harvested", "syl": "har·vest·ed", "say": "HAR-vuh-stid", "part": "action word", "mean": "gathered crops or food when ready", "ex": "The farmers harvested the corn in the fall."}], "qs": [{"p": 0, "q": "Why was Jonah so afraid of bees?", "opts": ["He had read a scary book about bees.", "His great-aunt had warned him about them."], "right": "A bee stung him on the lip when he was five."}, {"p": 1, "q": "How did Great-Aunt Folake help Jonah with his fear?", "opts": ["She told him that he was being silly.", "She made him stand by the hives on the first day."], "right": "She gave him information and let him move closer slowly."}, {"p": 1, "q": "Why will a worker bee sting only if she is frightened?", "opts": ["Her stinger has no strength.", "She is too busy making honey."], "right": "She dies after she stings."}, {"p": 3, "q": "What did Jonah use to calm the bees?", "opts": ["A loud shout", "A jar of honey"], "right": "Smoke from the smoker"}, {"p": 3, "q": "What did Jonah discover about getting stung?", "opts": ["It was much worse than he had remembered.", "It made him sick for the rest of the summer."], "right": "It was not nearly as bad as he had feared."}], "moral": "Learning about what scares you can make it smaller. Courage is being scared and staying steady."}, {"id": "comet", "title": "The Comet Over Copper Hill", "topic": "Science", "teaser": "Ines spots something in the sky that isn't on any chart. Should she keep the discovery for herself?", "pages": [{"scene": "night", "art": ["🔭", "☄️", "⛰️"], "paras": ["Every clear night, Ines Barros carried her grandfather's old telescope to the top of Copper Hill, where the lights of the town could not reach. She had a star chart, a red flashlight that wouldn't spoil her night vision, and a notebook full of sketches. Most people in town didn't understand why a ten-year-old would want to sit in the cold staring at dots. To Ines, it was the best place on Earth, largely because it wasn't really about Earth.", "Her only rival was Pavel Novak, who lived on the far side of town. He was an eleven-year-old who had a much better telescope and a much bigger mouth. At the Astronomy Club, he corrected everyone and made sure that people knew when he had seen something first. Ines tried to avoid him whenever possible.", "On a freezing night in November, she was sweeping her telescope slowly through the constellation Cassiopeia when something made her stop. There was a smudge. It was tiny, faint, and fuzzy, like a thumbprint on a window. She checked her chart. There was no galaxy marked there, nor a cluster of stars. She drew it carefully in her notebook, with the time and the date, and her hands weren't quite steady."]}, {"scene": "night", "art": ["☄️", "📓", "🌌"], "paras": ["The next night, she returned as early as she could. The smudge was still there, but it had moved. It had shifted slightly against the background of stars. Ines's breath made clouds in the air. Stars don't move like that. Things that move like that are close, and they are traveling. It could be a comet.", "She knew the rules. If you discover a new comet and you report it first, it can be named after you. Comet Barros. She said the words out loud, and they floated away in the dark. But she also knew that thousands of faint objects were well known, and that she could easily be wrong. She had only two observations. To be certain, she needed to measure its path over several nights, and the forecast showed clouds rolling in over Copper Hill for the rest of the week.", "Then she remembered that Pavel lived on the far side of town, where there was a clear view of the sky to the north. He had a larger telescope that could show much more detail. He also had a computer program that could compare the position of the smudge with every known object.", "Ines closed her notebook. \"No,\" she said aloud. \"Absolutely not.\" If she told Pavel, he would act as if he had found it himself."]}, {"scene": "home", "art": ["☁️", "💭", "🔭"], "paras": ["For two days, the clouds sat over the hill like a lid on a pot, and Ines's mood was no better. She couldn't stop thinking. What if it faded before she could get another look? Comets were often at their faintest when they were first spotted. What if someone in another country reported it tomorrow, and all she had were two sketches in a notebook?", "\"You're scowling at your soup,\" her grandfather said at dinner. He had been a ship's engineer, and he had taught her how to find the North Star. She told him the whole thing. He listened, stirring his soup, and took a long time to answer.", "\"Do you want to be the person who found it?\" he asked. \"Or do you want to know what it is?\"", "\"Both!\" said Ines.", "\"Of course,\" he said. \"But if you had to pick one?\"", "Ines looked into her bowl. She thought about why she climbed the hill in the freezing cold. It wasn't so that people would know her name. It was because of what was up there, and because not knowing something felt like an itch she had to scratch. She sighed, and she got up and went to the phone. Pavel answered on the first ring."]}, {"scene": "night", "art": ["🔭", "🤝", "☄️"], "paras": ["\"I've got something,\" she said. \"I can't get a good look at it, and you can. But I want it clear that we're doing this as a team.\" There was a long silence on the line, and she braced herself for a smart remark.", "\"Send me the position,\" Pavel said. His voice sounded odd. \"Please.\"", "That night, they sat on his freezing back steps with his big telescope and a laptop. For four hours, they took measurements. It turned out that Pavel, for all of his bragging, was very careful, and he checked everything twice. By the third night, the program showed that the object's path matched no known comet in its records. They wrote a report and sent it to the Astronomy Club's president, who was a professor, and she forwarded it to the people who kept track of such things.", "The answer came a week later. Two other observers, in Japan and in Chile, had also reported the object within a day of Ines's first sketch. It was a real comet, and it was officially named after the three first reports, which was a bit of a mouthful. Ines and Pavel were listed as contributing observers on the official notice.", "On the night that the comet was at its brightest, half of the town climbed Copper Hill to see it. Ines handed the eyepiece to a little boy. \"See that fuzzy spot?\" she said, and her heart was full. \"It won't come back for four thousand years. But you can say that you saw it.\""]}], "words": [{"w": "telescope", "syl": "tel·e·scope", "say": "TEL-uh-skohp", "part": "naming word", "mean": "a tool that makes faraway things look closer", "ex": "We looked at the moon through a telescope."}, {"w": "rival", "syl": "ri·val", "say": "RY-vul", "part": "naming word", "mean": "someone you compete against", "ex": "My tennis rival beat me in the last game."}, {"w": "constellation", "syl": "con·stel·la·tion", "say": "kon-stuh-LAY-shun", "part": "naming word", "mean": "a group of stars that forms a shape or picture", "ex": "The Big Dipper is part of a constellation."}, {"w": "observations", "syl": "ob·ser·va·tions", "say": "ob-zer-VAY-shunz", "part": "naming word", "mean": "things that you notice by watching carefully", "ex": "She wrote her observations about the ants in a notebook."}, {"w": "forecast", "syl": "fore·cast", "say": "FOR-kast", "part": "naming word", "mean": "a report that says what is likely to happen, such as the weather", "ex": "The forecast says it will rain on Monday."}, {"w": "braced", "syl": "braced", "say": "BRAYST", "part": "action word", "mean": "got ready for something hard or unpleasant", "ex": "He braced himself for the cold water."}], "qs": [{"p": 0, "q": "Why did Ines want to avoid Pavel?", "opts": ["He had once broken her telescope.", "He lived too far away from her."], "right": "He bragged and acted as if everything was his."}, {"p": 1, "q": "How did Ines know that the smudge might be a comet?", "opts": ["It was the brightest object in the sky.", "It was named on her star chart."], "right": "It moved against the background of stars."}, {"p": 2, "q": "What question helped Ines decide what to do?", "opts": ["Her grandfather asked if she had finished her soup.", "Pavel asked if she could lend him her telescope."], "right": "Her grandfather asked if she wanted to be known or to know."}, {"p": 3, "q": "What did Ines learn about Pavel while working with him?", "opts": ["He had already found the comet by himself.", "He did not know how to use a computer."], "right": "He was very careful, in spite of his bragging."}, {"p": 3, "q": "What did Ines get from the comet in the end, even without her name on it?", "opts": ["She got a large prize and a new telescope.", "She got to name it Comet Barros."], "right": "She got to learn what it was and share it with others."}], "moral": "Sharing a discovery is better than keeping it to yourself. Work matters more than getting credit."}, {"id": "dragon", "title": "The Dragon with a Cold", "topic": "Fantasy", "teaser": "The whole town is hiding from the terrible dragon of Crag Peak. Only Nell has noticed that the roaring sounds an awful lot like sneezing.", "pages": [{"scene": "mountain", "art": ["🐉", "🤧", "🏰"], "paras": ["For as long as anyone could remember, the people of Little Fenwick had been afraid of the dragon on Crag Peak. Nobody had actually seen it up close, but everyone knew the stories. It ate cows whole. It breathed fire as hot as the sun. It could flatten a house with its tail. So when a terrible new noise started coming from the mountain that winter, the entire town panicked.", "It began at night. First there was a long, rising \"AHHH,\" which rattled the windows, followed by a tremendous \"CHOOOO!\" that shook the snow from the roofs. Then a burst of fire would light up the peak, and the sheep in the fields would faint. The mayor ordered everyone to stay indoors. The baker began sleeping in his oven, on the theory that it was fireproof.", "Nell Ashby, who was ten, helped her father at the village apothecary, where he mixed medicines. She had heard that sound, or something rather like it, about a thousand times that winter, from every person who came into the shop.", "\"Papa,\" she said one evening, as the windows rattled again, \"that dragon has a cold.\"", "Her father laughed so hard that he dropped a jar."]}, {"scene": "town", "art": ["🧪", "🍯", "🧣"], "paras": ["Nell didn't drop the idea, however. She started to keep track. The noises came more often at night, as coughs do. They had gotten worse during the coldest week. Also, on the morning after each burst of fire, a huge number of pine trees on the mountain turned out to be scorched only on one side, as if something had aimed by accident.", "At a town meeting, the mayor announced that they would hire a famous knight, Sir Brandon the Bold, to slay the beast. It would cost all of the gold in the treasury. Nell stood on a bench to be heard.", "\"Has anybody asked what's wrong with it?\" she said.", "People stared at her. \"It's a monster, child,\" said the mayor. \"What's wrong with it is that it's a monster.\"", "\"But what has it actually done?\" Nell persisted. \"Has it eaten a single cow? When did that happen?\" There was a pause. People looked at each other and frowned. Nobody could name a cow. Somebody's grandfather had known someone who had heard about a cow.", "Nobody listened, of course. But that night, Nell filled her father's biggest kettle with honey, lemon, and willow bark, tied a scarf around her neck, and set out for the mountain."]}, {"scene": "snow", "art": ["🐉", "🫖", "👧"], "paras": ["It took her most of the night to climb the trail, and when she reached the cave, she could hardly feel her feet. Inside, she saw an enormous shape piled up against the rock wall. It was the color of old bronze, and it was bigger than the town hall. As she watched, its great sides heaved. Nell stood her ground, even though her knees had begun to knock together.", "\"AHHH-CHOOOO!\"", "A jet of flame shot past her and scorched the cave wall. Then a voice like a landslide spoke, weak and miserable.", "\"Oh, I'm so sorry,\" it said. \"Did I get you? I can't seem to stop.\" A massive head rose up. Its nose was running, and its big golden eyes were red and watery. \"Please go away, little person. Everyone always screams. I've got a terrible headache, and the screaming makes it so much worse.\"", "Nell's mouth was dry, but she held up the kettle. \"I brought you something,\" she said. \"It's for your throat.\"", "The dragon stared at her. Slowly, a huge tear rolled down its snout and hissed on the stone. \"Nobody,\" it said in a wobbly voice, \"has ever brought me anything.\""]}, {"scene": "town", "art": ["🐉", "🎉", "🥘"], "paras": ["Her name was Ember. She was only three hundred years old, which was quite young for a dragon, and she had lived alone on the mountain her entire life. She ate fish from the deep lakes. She had never seen a cow up close, but she'd always thought they looked rather friendly. The stories had been made up long ago by people who had seen her from far away, and they had grown with each telling.", "Nell stayed for three days, warming kettle after kettle over Ember's own breath. By the fourth morning, the sneezes had stopped.", "That same day, Sir Brandon the Bold arrived in town with his shining armor and a very large bill. The townspeople were lining up to cheer him when a shadow passed over the square. People screamed and dived under carts. Then Ember landed gently at the edge of the green, with Nell sitting between her shoulders, holding on tight.", "\"Excuse me,\" said Ember in a shy rumble. \"I wanted to apologize about the noise.\"", "There was a very long silence. At last, the baker climbed out of his oven and walked forward, trembling. He held out a warm loaf of bread. And that was how Little Fenwick got the only dragon-heated bakery in the world."]}], "words": [{"w": "tremendous", "syl": "tre·men·dous", "say": "trih-MEN-dus", "part": "describing word", "mean": "very large or very great", "ex": "The train made a tremendous noise."}, {"w": "apothecary", "syl": "a·poth·e·car·y", "say": "uh-POTH-uh-kair-ee", "part": "naming word", "mean": "an old word for a person or shop that made and sold medicines", "ex": "The apothecary mixed a syrup for my cough."}, {"w": "scorched", "syl": "scorched", "say": "SKORCHT", "part": "action word", "mean": "burned on the surface", "ex": "The hot iron scorched my shirt."}, {"w": "treasury", "syl": "treas·ur·y", "say": "TREZH-uh-ree", "part": "naming word", "mean": "the place where a town or kingdom keeps its money", "ex": "The king kept his gold in the treasury."}, {"w": "persisted", "syl": "per·sist·ed", "say": "per-SIS-tid", "part": "action word", "mean": "kept on doing or asking in spite of problems", "ex": "She persisted until she had solved the puzzle."}, {"w": "miserable", "syl": "mis·er·a·ble", "say": "MIZ-er-uh-bul", "part": "describing word", "mean": "very unhappy or uncomfortable", "ex": "I felt miserable with my sore throat."}], "qs": [{"p": 0, "q": "What did Nell notice about the dragon's noise?", "opts": ["It came only during the hot days of summer.", "It sounded like a knight blowing a horn."], "right": "It sounded like someone sneezing and coughing."}, {"p": 1, "q": "What question did Nell ask that made people stop and think?", "opts": ["How much gold does the knight cost?", "How high is the top of Crag Peak?"], "right": "What has the dragon actually done?"}, {"p": 2, "q": "Why was Ember crying?", "opts": ["She was angry that Nell had come to her cave.", "The medicine in the kettle was too hot."], "right": "No one had ever brought her anything before."}, {"p": 3, "q": "How had the scary stories about Ember begun?", "opts": ["Ember had told the stories herself.", "She really had eaten many cows."], "right": "People made them up after seeing her from far away."}, {"p": 3, "q": "What is the funny surprise at the end?", "opts": ["The baker turns out to be a dragon.", "Sir Brandon is afraid of bread."], "right": "Ember ends up heating the town's bakery."}], "moral": "Do not fear or judge someone because of stories you have heard. Find out for yourself, and be kind."}, {"id": "spellingbee", "title": "The Spelling Bee Swap", "topic": "School", "teaser": "Maya finds the list of words for the finals. Nobody would ever know. So why can't she sleep?", "pages": [{"scene": "school", "art": ["🐝", "📝", "🏆"], "paras": ["For two years, Maya Ellis had finished in second place at the Rosewood School Spelling Bee. Both times, she had lost to Winston Park on the very last word. Both times, she had stood on the stage with a polite smile while her stomach slowly filled with cement. This year, she was going to win. She had been studying every night since September, and she knew the difference between \"desert\" and \"dessert\" better than she knew her own phone number.", "On the Wednesday before the finals, Mrs. Dale sent her to the office to deliver the attendance sheet. The secretary had stepped out. On the corner of the desk was a yellow folder, and on its tab, in clear black ink, was written: \"Finals Word List, Do Not Share.\"", "Maya's feet stopped moving. The folder wasn't closed all the way. A corner of the page stuck out, and she could see the first three words without even touching it. She couldn't help seeing them. Then, with a quick glance at the door, she reached out one finger and nudged the folder open. Her heart beat so hard that she could feel it in her ears. It took about twenty seconds to take a picture of the list with her eyes, and then she walked away."]}, {"scene": "home", "art": ["🌙", "😣", "📝"], "paras": ["At home, she wrote down the twelve words she could remember. \"Mischievous.\" \"Rhythm.\" \"Conscience.\" She looked up each one and learned them perfectly. It was so easy. By dinnertime, she could spell every one of them backward.", "She had expected to feel excited. Instead, she felt slightly sick, as if she had eaten something that was going bad. Her mom had made her favorite noodles, but she pushed them around on her plate.", "\"You've worked so hard this year,\" said her dad, patting her shoulder. \"Whatever happens on Friday, we're proud of how you earned it.\"", "The word \"earned\" stuck in her chest like a fish bone.", "That night, she lay awake and stared at the ceiling. She told herself that it was only twelve words. She told herself that everyone did things like this, even though she couldn't name anyone who had. She told herself that she deserved to win after two years. These all seemed like good arguments, but none of them made her feel any better. Around midnight, she got up and looked at the word that she had written down. It seemed to be looking back at her. \"Conscience,\" it said. \"The part of you that knows.\""]}, {"scene": "school", "art": ["🎤", "😰", "🐝"], "paras": ["On Friday, the gym was packed. Maya sat on the stage, third in a row of ten, wearing a big paper number. The first rounds were easy, and the crowd thinned out as speller after speller heard the soft ding of the bell. Soon there were only two left. Of course, it was Winston and Maya.", "Winston looked awful. His hands were shaking, and he kept wiping them on his pants. He leaned over during the break. \"I threw up twice this morning,\" he whispered. \"My grandma flew in from Seoul for this. Good luck, Maya. I mean it. You're the only one who ever makes me work hard.\"", "Maya felt as if the floor were tilting. She thought about all of the nights that he must have spent studying, just like her. He was doing it honestly, and she knew what she knew.", "\"Maya Ellis,\" said the announcer. \"Your word is 'rhythm.'\"", "It was on the list. She knew it, and everyone would cheer. The gym was silent. All she had to do was open her mouth, and the trophy would be hers. She looked at the judges, and she looked at her father, who was smiling at her with his whole face. She walked to the microphone."]}, {"scene": "home", "art": ["🏆", "💬", "🌤️"], "paras": ["\"I can't spell that word,\" she said.", "A rustle went through the crowd. Mrs. Dale frowned. \"You may ask for the definition, dear, or the language of origin,\" she said.", "\"No, I mean that I can't spell it fairly.\" Her voice was thin and wobbly. \"I saw the list, in the office on Wednesday. I looked on purpose. I'm sorry.\" She felt tears on her cheeks, but she kept going. \"I think that I should be out.\"", "Nobody spoke. She walked down from the stage and across the longest gym floor in the world. Winston won the bee on a different word, and he looked more confused than happy. Mrs. Dale and the principal had a long talk with her. There were consequences, and they were fair. She had to write a letter of apology to the school, and she wasn't allowed to enter any contest for the rest of the year.", "Her parents drove her home in silence, and she was sure they hated her. But in the driveway, her father turned off the engine and looked back at her. \"You did something wrong,\" he said. \"That was bad. Then you did something very hard, in front of everyone, when nobody would have known. I am prouder of that than of any trophy.\"", "The next year, Maya entered again. She came in second. And she slept beautifully."]}], "words": [{"w": "attendance", "syl": "at·ten·dance", "say": "uh-TEN-dunss", "part": "naming word", "mean": "a record of who is present", "ex": "The teacher takes attendance every morning."}, {"w": "mischievous", "syl": "mis·chie·vous", "say": "MIS-chuh-vus", "part": "describing word", "mean": "playful in a way that causes small trouble", "ex": "The mischievous puppy hid my sock."}, {"w": "conscience", "syl": "con·science", "say": "KON-shunss", "part": "naming word", "mean": "the feeling inside you that tells right from wrong", "ex": "My conscience told me to give the wallet back."}, {"w": "rhythm", "syl": "rhy·thm", "say": "RITH-um", "part": "naming word", "mean": "a regular, repeated pattern of beats or sounds", "ex": "We clapped to the rhythm of the song."}, {"w": "definition", "syl": "def·i·ni·tion", "say": "def-uh-NISH-un", "part": "naming word", "mean": "the meaning of a word", "ex": "Look in the dictionary for the definition of this word."}, {"w": "consequences", "syl": "con·se·quenc·es", "say": "KON-suh-kwen-siz", "part": "naming word", "mean": "things that happen because of what you did", "ex": "Skipping practice had consequences for the team."}], "qs": [{"p": 0, "q": "Why did Maya want so badly to win?", "opts": ["She needed the prize money for her family.", "Her parents had said that she must win."], "right": "She had come in second two years in a row."}, {"p": 0, "q": "How did Maya cheat?", "opts": ["She wrote words on her hand.", "She asked Winston to tell her the words."], "right": "She looked at the secret word list in the office."}, {"p": 1, "q": "How did Maya feel after learning the words?", "opts": ["She felt excited and proud of herself.", "She felt ready to tell Winston everything."], "right": "She felt sick and could not sleep."}, {"p": 2, "q": "What did Winston say that made Maya feel worse?", "opts": ["He told her that he knew she had cheated.", "He said that she would surely lose."], "right": "He was nervous, wished her luck, and said she made him work hard."}, {"p": 3, "q": "What was Maya's father proudest of?", "opts": ["That she had come in second place", "That she learned so many hard words"], "right": "That she told the truth when no one would have known"}], "moral": "Winning by cheating is not really winning. Being honest, even when it is hard, gives you peace."}, {"id": "well", "title": "The Well at Sand Wind Crossing", "topic": "Folktale", "teaser": "Long ago, a caravan reaches the last well in the desert. There is only enough water for those who stop to share.", "pages": [{"scene": "desert", "art": ["🐫", "🏜️", "☀️"], "paras": ["Many hundreds of years ago, when traders still crossed the Great Sand in long caravans of camels, a boy named Idris made his first journey with his uncle. They were carrying salt and cloth to the far cities, a trip of forty days across dunes as tall as hills. Water was the only treasure that really mattered there, and a caravan could go a week between wells.", "Idris was twelve, and he had been told to look after the two youngest camels. His uncle was a stern and thrifty man, who measured every drop. \"The desert has one rule,\" he told Idris on the first night, as the cold stars came out. \"Look after your own. Those who give away water do not live long enough to be thanked.\"", "Idris nodded. He was afraid of his uncle, but he was more afraid of the endless, silent sand.", "On the twenty-second day, a great wind arose and blew for three days. It scoured their faces and buried the trail. When it stopped at last, the guide stood on a dune for a long while, turning slowly in a circle. His face was very quiet. They had lost a whole day's travel, and two of the water skins had split open."]}, {"scene": "desert", "art": ["🏜️", "💧", "🐫"], "paras": ["They rationed what they had. Each man got one small cup at dawn and one at dusk. By the end of the week, Idris's lips had cracked, and his tongue felt like an old piece of leather. The camels walked with their heads hanging down. At last, the guide pointed to a dark smudge at the horizon. It was Sand Wind Crossing, the last well before the mountains.", "When they arrived, the men shouted with joy. Then they stopped. Another group was already there, a small and ragged family of herders with a few thin goats. An old woman sat at the edge of the well, holding a rope that was much too short. The wind had filled the well with sand, and the water now lay far below, deeper than any of them could reach.", "\"Pay them no mind,\" Idris's uncle muttered. \"We have long ropes. We'll fill our skins, and then we'll go.\"", "The men lowered their long rope, and they brought up a bucket of cloudy water. They drank and drank. Idris drank too, and it was the best thing he had ever tasted. Then, over the rim of the cup, he saw a small girl, who was watching him. She didn't ask for anything. She only watched, with cracked lips exactly like his."]}, {"scene": "night", "art": ["🌙", "🐐", "💧"], "paras": ["That night, as the men slept, Idris lay awake. He kept seeing the little girl's lips. He remembered his uncle's rule, and he remembered, too, what it had felt like just that morning to be so thirsty that he would have given anything. Why should it matter whose lips they were?", "He got up without a sound and crept to the well. He took down the long rope, hauled up a bucket, and carried it to the herders' camp, stumbling in the dark. The old woman was awake. She looked at him and said nothing for a moment, then took the bucket with her shaking hands. He went back and forth four times, until all of their skins were full and the goats had stopped crying.", "On his last trip, he turned around, and his uncle was standing there. Idris's heart froze.", "\"You used our rope,\" his uncle said in a low, cold voice. \"And you did it without asking.\" He held out his hand for the bucket, and Idris gave it to him. \"We leave at dawn, and you will walk at the back.\"", "Before they left, the old woman walked over to Idris. She pressed something into his hand, a small, smooth blue stone on a string. \"My people remember,\" she said. \"Keep that, boy.\""]}, {"scene": "desert", "art": ["💎", "🐫", "🌄"], "paras": ["Two weeks later, the caravan was halfway across the Black Flats when the sky turned strange. A band of raiders had been seen on the road ahead, and the frightened guide led them far off the trail in order to avoid them. Then the next well was dry. Even Idris's uncle could not find an answer in his careful measurements. For two days, the men walked with no water at all. On the third day, a camel lay down and would not get up.", "Then there were riders on the ridge. They were coming down fast, and the men drew together in fear. But when the riders came close, the man at their head reined in his camel and stared at something shining on Idris's chest. It was the blue stone.", "\"That stone belongs to my mother,\" the man said. \"She sent word across the desert about a boy with a long rope who came in the night. Whoever wears it is a guest of our people.\" He unslung a full water skin and held it out to Idris, not to the uncle. \"There is a hidden spring half a day from here. We will show you.\"", "That evening, beside the spring, Idris's uncle sat down next to him. He didn't speak for a long time. \"I told you the desert has one rule,\" he said. \"It seems I only knew half of it.\""]}], "words": [{"w": "caravans", "syl": "car·a·vans", "say": "KAIR-uh-vanz", "part": "naming word", "mean": "groups of people and animals traveling together, often across a desert", "ex": "Long caravans carried spices across the desert."}, {"w": "thrifty", "syl": "thrif·ty", "say": "THRIF-tee", "part": "describing word", "mean": "careful about spending money or using things", "ex": "My thrifty aunt saves every paper bag."}, {"w": "scoured", "syl": "scoured", "say": "SKOWRD", "part": "action word", "mean": "scrubbed or rubbed hard", "ex": "The sand scoured the paint off the old car."}, {"w": "rationed", "syl": "ra·tioned", "say": "RASH-und", "part": "action word", "mean": "shared out small, fixed amounts because there was not much", "ex": "The sailors rationed their food for the long trip."}, {"w": "horizon", "syl": "ho·ri·zon", "say": "huh-RY-zun", "part": "naming word", "mean": "the line where the sky seems to meet the land or the sea", "ex": "The sun sank slowly below the horizon."}, {"w": "raiders", "syl": "raid·ers", "say": "RAY-derz", "part": "naming word", "mean": "people who make sudden attacks to steal things", "ex": "The raiders stole gold from the town."}], "qs": [{"p": 0, "q": "What did Idris's uncle say was the desert's rule?", "opts": ["Never travel without a good guide.", "Always share everything with strangers."], "right": "Look after your own, and do not give away water."}, {"p": 1, "q": "Why couldn't the herders get water?", "opts": ["The well had been poisoned by a storm.", "The caravan would not let them near it."], "right": "Their rope was too short to reach the water."}, {"p": 2, "q": "What made Idris decide to help?", "opts": ["His uncle ordered him to help them.", "The old woman offered to pay him."], "right": "He remembered exactly how being thirsty felt."}, {"p": 3, "q": "Why did the riders help the caravan?", "opts": ["They wanted to buy all of the salt.", "They were afraid of Idris's uncle."], "right": "The blue stone showed Idris had helped their family."}, {"p": 3, "q": "What is the \"other half\" of the rule that the uncle learned?", "opts": ["You should always carry extra rope.", "You should never leave the main trail."], "right": "Helping others may be what saves you."}], "moral": "Kindness comes back to you. Share what you have with those in need, even when it is hard."}, {"id": "room12", "title": "The Treasure Under Room 12", "topic": "Mystery", "teaser": "The school is being torn down. Under a loose floorboard, the kids find a note from 1964 with a riddle attached.", "pages": [{"scene": "school", "art": ["🏫", "🔦", "📜"], "paras": ["Ridgeway Elementary was the oldest school in the county. It had squeaky stairs, a smell of chalk and floor wax, and a furnace that banged like a ghost in a pipe. In June, it was going to be torn down, since a shiny new school was being built on the far side of town. Everybody was excited about that, except Kofi Mensah, who had read every book in its library and knew all of its secret corners.", "One rainy afternoon, Kofi dropped a marble in Room 12. It rolled across the floor and vanished through a crack near the radiator. When he knelt down to find it, he noticed that one of the floorboards was slightly shorter than the others. He pressed on one end, and the other end tipped up.", "Underneath was a dusty tin box, of the kind that once held cough drops. He called over his friend Dani, and they pried off the lid. Inside was a folded piece of paper, gone soft and yellow with age. It was written in very careful handwriting.", "\"To the finder,\" it read. \"We, the Fourth Grade of 1964, have hidden our treasure in this school. Follow the clues, if you are clever. Clue One: Where do we all line up to drink, but the water never gets any older?\""]}, {"scene": "school", "art": ["🚰", "🗝️", "🔎"], "paras": ["\"It has to be a drinking fountain,\" said Dani. \"There's only one that old. It's in the basement hall.\"", "The next day at recess, they got permission to go down there. The fountain was a heavy thing of chipped white stone. They searched all around it, feeling foolish, until Dani ran her hand along the underside of the basin. Something crackled. A second note had been taped there, sixty years earlier, with tape that had turned brown and brittle.", "\"Clue Two,\" said Kofi, reading it. \"Count the steps where the big kids go. Stop at the one that's different, down below.\"", "It took them all week. Clue Two led them to the main staircase, where the seventh step from the bottom had a tiny carved star on its underside. There was another note wedged behind it. Clue Three sent them to the old stage, and Clue Four sent them to the coat hooks. Each clue was harder than the last, and they began to keep a log of every location. Other kids became curious and started to help. Soon a whole gang of them were crawling around the building at recess, and the janitor, Mr. Ruiz, was shaking his head at them with a secret smile."]}, {"scene": "school", "art": ["🧑‍🔧", "🗺️", "🕵️"], "paras": ["The last clue was the hardest. \"Clue Five,\" it read. \"We planted it to last through all kinds of weather. Look where roots and bricks are tied together.\"", "\"Roots,\" said Dani. \"That has to be a plant.\" They ran outside and circled the building. There was only one tree on the whole school grounds, an enormous oak that stood against the south wall, where its roots had buckled the pavement. A faded metal plate at its base said, \"Planted by the Class of 1964.\"", "They dug around the bricks at its base with spoons until Mr. Ruiz came out. They thought that they were in trouble, but he only watched them for a moment and then went back to fetch a shovel. \"I've worked here for thirty years,\" he said. \"I always wondered about the loose brick at the bottom of that wall.\"", "The brick came out with a scrape. Behind it was a hollow space, and in that space was a metal box as big as a loaf of bread. Everyone crowded around. Kofi could hardly breathe as he pulled it out. It was heavy. It might be gold, or old coins. Mr. Ruiz used a screwdriver to pop the rusted lid, and twenty kids leaned in."]}, {"scene": "town", "art": ["📦", "👵", "💌"], "paras": ["There was no gold. Instead, the box was packed with paper. There were spelling tests, drawings of rockets, and a list of the class's favorite songs. There was a photo of thirty-one children in front of the school, squinting in the sun. There were letters addressed \"To the kids of the future,\" in thirty-one different kinds of handwriting. \"Do you have flying cars?\" asked one. \"Is there still a Mrs. Baxter? She is strict but nice,\" said another.", "A few kids groaned with disappointment. But Kofi unfolded a letter, and then another. \"Listen to this one,\" he said. \"'I am scared about moving away next year. I hope that you have a friend like Tom.'\" He looked at the name at the bottom. \"Ruth Abernathy.\"", "\"Abernathy,\" said Mr. Ruiz slowly. \"There's a Ruth Abernathy who still lives on Mill Street. She taught piano to my kids.\"", "So they brought it to her. Nine days before the school closed, the whole class invited everyone they could find from the 1964 photo. Eleven of them came, with gray hair and canes. They walked through Room 12 and laughed until they cried. Mrs. Abernathy held her old letter in her hands. \"And did you have a friend like Tom?\" Kofi asked her.", "She pointed across the room at an old man, who was trying to fit into a tiny desk. \"I married him,\" she said.", "That year's fourth graders packed a new box for the new school. Now, Kofi knew exactly what kind of treasure to put in it."]}], "words": [{"w": "furnace", "syl": "fur·nace", "say": "FUR-niss", "part": "naming word", "mean": "a large machine that heats a building", "ex": "The furnace in the basement kept the house warm."}, {"w": "radiator", "syl": "ra·di·a·tor", "say": "RAY-dee-ay-ter", "part": "naming word", "mean": "a metal heater that warms a room", "ex": "We dried our wet mittens on the radiator."}, {"w": "brittle", "syl": "brit·tle", "say": "BRIT-ul", "part": "describing word", "mean": "hard but easy to snap or break", "ex": "Old leaves are dry and brittle."}, {"w": "location", "syl": "lo·ca·tion", "say": "loh-KAY-shun", "part": "naming word", "mean": "a place where something is", "ex": "This location would be perfect for a picnic."}, {"w": "buckled", "syl": "buck·led", "say": "BUK-uld", "part": "action word", "mean": "bent or pushed up out of shape", "ex": "The heat buckled the metal roof."}, {"w": "disappointment", "syl": "dis·ap·point·ment", "say": "dis-uh-POINT-ment", "part": "naming word", "mean": "a sad feeling when something is not as good as you hoped", "ex": "The canceled trip was a big disappointment."}], "qs": [{"p": 0, "q": "Why was the school being torn down?", "opts": ["It had been destroyed by a huge storm.", "There were no more students in the town."], "right": "A new school was being built on the far side of town."}, {"p": 0, "q": "How did Kofi find the first box?", "opts": ["Mr. Ruiz gave him a map to find it.", "He was told about it by a teacher."], "right": "He dropped a marble and noticed a loose floorboard."}, {"p": 2, "q": "What did Clue Five point to?", "opts": ["The drinking fountain in the basement", "The old school stage"], "right": "The oak tree and the wall beside it"}, {"p": 3, "q": "Why were some kids disappointed in the treasure?", "opts": ["The box was completely empty.", "Mr. Ruiz would not let them see it."], "right": "It was only old papers instead of gold."}, {"p": 3, "q": "What did Kofi learn about what treasure can be?", "opts": ["It must always be worth a lot of money.", "It is not worth looking for at all."], "right": "It can be memories and connections between people."}], "moral": "The real treasures are people, memories, and stories. They can be worth more than gold."}, {"id": "goat", "title": "The Goat Who Took the Shortcut", "topic": "Animals", "teaser": "The old path takes all day. Bram knows a faster way, and he's in a big hurry to prove that he's right.", "pages": [{"scene": "mountain", "art": ["🐐", "⛰️", "🌿"], "paras": ["On the steep green sides of Mount Ostra lived a herd of mountain goats, and the youngest and quickest was named Bram. He could jump a gap as wide as a river, and he could balance on a ledge no wider than your hand. His hooves were perfect for it, with soft pads inside and hard edges outside. He had no fear at all, and he thought that this was the same as being wise.", "Each summer, when the grass on the lower slopes turned brown, the herd moved up to the High Meadow. The trail was called the Long Stair, and it wound back and forth across the mountain for a whole day. Old Hedda led it, as her mother and grandmother had before her. She went slowly and stopped often, and she tested each patch of ground before she stepped on it.", "\"This is ridiculous,\" said Bram, stamping his foot. They had stopped again, while the mothers let the kids rest. \"I can see the meadow from here! It's right above us. If we went straight up Cracked Face, we'd be there by noon!\"", "Hedda's jaw kept chewing. \"Cracked Face has a name for a reason,\" she said. \"My grandmother told me to stay off of it. We use the Stair.\""]}, {"scene": "mountain", "art": ["🪨", "🐐", "🤔"], "paras": ["\"But why?\" Bram demanded. \"Did you ever try it? Has anyone? Or do you just do what somebody's grandmother told you?\"", "A few young goats snickered, and Hedda only looked at him with her calm yellow eyes. \"You may have a point,\" she said. \"Old rules are sometimes foolish. But some of them are written in the bones of those who broke them. You'd be wise to find out which is which before you bet your life.\"", "Bram rolled his eyes. That night, he talked with his friends, Tuck and Sorrel. They were both tired of walking slowly, and it didn't take much to convince them. In the gray light before dawn, while the herd slept, the three young goats slipped away from the trail. Cracked Face rose above them like the side of a building.", "At first, the climb was wonderful. The rock was warm, and their hooves gripped well. They leaped from ledge to ledge, laughing at how fast they were going. Below them, the herd had begun to move, tiny and slow on its zigzag path. \"Look at them,\" Bram called. \"We'll be eating sweet grass for hours before they get there!\" It felt great to be right."]}, {"scene": "mountain", "art": ["⚠️", "🪨", "🌫️"], "paras": ["About halfway up, the rock began to change. It was darker there, and thin cracks ran through it, like the lines on a very old plate. Bram jumped to a wide shelf, and a piece the size of a pumpkin came loose under his back hoof. It fell, and they heard it bounce, again and again, for a long time.", "\"Maybe we should go back,\" said Sorrel in a small voice.", "\"We can't,\" said Tuck. He was looking down, and he had gone very still. Going up had been simple, but the way back now looked impossible. They had jumped up onto ledges that they could not see from above.", "Clouds rolled across the mountain, and the rock became slick and wet. Bram went first, testing each hold, and his confidence was gone. For the first time in his life, he understood why anyone would test the ground before stepping on it. He made his way across a narrow ledge with his heart hammering. Then there was a crack and a roar. The ledge behind him simply fell away, and Sorrel was left stranded on the far side, with a gap too wide to jump and a long drop beneath her.", "\"Bram!\" she cried. \"I can't get across!\"", "He stared at the gap. This was his fault, all of it. There was nothing clever to say about that."]}, {"scene": "mountain", "art": ["🐐", "🤝", "🌄"], "paras": ["There was only one thing left to do, and it was the hardest thing he had ever done. He lifted his head and called out with all of his strength, the long, high bleat that goats use for danger. It rang off of the rock and echoed over the valley. Far below on the Long Stair, a tiny shape stopped moving.", "Hedda could have said many things. She said none of them. She left the herd with the other mothers and came up the mountain by a route that Bram had never seen, testing every step. It took hours. When she finally appeared above them on the ridge, the sun had started to sink.", "\"There's a sheep trail above you that is only as wide as your hoof,\" she called. \"It's the way my grandmother's cousin got down, the last time some young fools tried this. Sorrel, look at me, not at the drop. Put your feet where I tell you.\" One step at a time, her calm voice guided them across the face of the rock, until all three of them stood shaking on solid ground.", "They reached the High Meadow in the moonlight, hours after everyone else. Bram didn't say anything for a long time, and neither did Hedda. Finally, he walked over to her.", "\"Teach me the Stair,\" he said quietly. \"I want to know why every turn is where it is.\"", "Hedda looked at him and nodded. \"Start with the first one tomorrow,\" she said. \"We'll go slowly.\""]}], "words": [{"w": "balance", "syl": "bal·ance", "say": "BAL-unss", "part": "action word", "mean": "stay steady without falling over", "ex": "She tried to balance a book on her head."}, {"w": "ridiculous", "syl": "ri·dic·u·lous", "say": "rih-DIK-yuh-lus", "part": "describing word", "mean": "very silly or unreasonable", "ex": "That huge purple hat looks ridiculous."}, {"w": "convince", "syl": "con·vince", "say": "kun-VINSS", "part": "action word", "mean": "make someone believe or agree with something", "ex": "I tried to convince my mom that I needed a dog."}, {"w": "zigzag", "syl": "zig·zag", "say": "ZIG-zag", "part": "describing word", "mean": "going in short, sharp turns from side to side", "ex": "The lightning made a zigzag line in the sky."}, {"w": "impossible", "syl": "im·pos·si·ble", "say": "im-POS-uh-bul", "part": "describing word", "mean": "not able to be done", "ex": "It is impossible to be in two places at once."}, {"w": "stranded", "syl": "strand·ed", "say": "STRAN-did", "part": "describing word", "mean": "stuck in a place with no way to leave", "ex": "The flood left the family stranded on the roof."}], "qs": [{"p": 0, "q": "Why did Bram want to leave the Long Stair?", "opts": ["He had seen a wolf on the trail.", "Hedda told him to go ahead of the herd."], "right": "He thought it was too slow and could see a quicker way."}, {"p": 1, "q": "What did Hedda mean about old rules?", "opts": ["All old rules are foolish and should be broken.", "Only grandmothers are allowed to make rules."], "right": "Some rules exist because people were hurt when they broke them."}, {"p": 2, "q": "What happened to Sorrel?", "opts": ["She fell asleep and was left behind by the others.", "She ran back to the herd without telling anyone."], "right": "A ledge fell away and she was stuck with no way across."}, {"p": 3, "q": "Why was calling for help \"the hardest thing\" for Bram?", "opts": ["He had a sore throat from climbing.", "Goats are not able to bleat very loudly."], "right": "He had to admit that he was wrong and needed help."}, {"p": 3, "q": "How did Bram change by the end?", "opts": ["He became afraid to climb anything at all.", "He decided to find an even faster shortcut."], "right": "He wanted to learn from Hedda's experience."}], "moral": "Shortcuts can be dangerous. Listen to those with more experience, and ask for help when you need it."}, {"id": "mayor", "title": "The Mayor of Maple Street", "topic": "Community", "teaser": "The biggest tree on the block has a red X on it. The kids of Maple Street have nine days and no money.", "pages": [{"scene": "town", "art": ["🌳", "❌", "🚧"], "paras": ["The oldest maple tree on Maple Street stood right in front of number 44. It was wider than a car, and in October it turned the color of a campfire. Every kid on the block had climbed it, and every kid knew exactly which branch would hold you and which would not. So when Abby Rosen walked to the bus stop one Monday and found a big red X sprayed on its trunk, she stopped and stared with her mouth open.", "A notice was stapled below it. She read it to the others, who had gathered around. \"The tree will be removed on the twenty-second, due to a sidewalk repair project.\"", "\"They can't do that,\" said her brother, Elan.", "\"They can,\" said Mr. Tan, who lived at number 44. He looked sad. \"It's the city's tree. The roots have cracked the sidewalk, and somebody tripped. They've got a right to fix it, and it's cheaper to cut the tree down than to fix it any other way.\"", "\"Who decides that?\" Abby demanded.", "Mr. Tan shrugged. \"The Public Works Department, I guess. Good luck talking to them.\"", "They had nine days. Abby was ten, she had six dollars, and she had no idea what a Public Works Department was. By lunchtime, she was determined to find out."]}, {"scene": "school", "art": ["📞", "📋", "✉️"], "paras": ["Abby's first idea was to chain herself to the tree. Her mother pointed out that this would be illegal and also very uncomfortable. So instead she called the number on the notice. A tired voice told her that she'd have to speak with a supervisor. The supervisor told her to file a form. The form was on a website that didn't work. She tried again the next day, and she was transferred four times before someone hung up.", "\"Grown-ups have got a whole maze set up for this,\" she complained to Elan. \"It's as if they hope that you'll give up.\"", "Then she thought about it from a different direction. The city didn't hate the tree. It had two real problems, which were a broken sidewalk and a limited budget. If she was going to save the tree, she'd have to solve those problems. Yelling would not do it.", "She went to see Ms. Greene, an engineer who lived down the block. \"Is there any other way to fix a sidewalk without killing a tree?\" Abby asked. Ms. Greene looked surprised, and then she looked delighted. She pulled out a pencil, and she spent an hour showing Abby how sidewalks could be built with a gentle curve around the roots."]}, {"scene": "home", "art": ["📐", "🧮", "🍪"], "paras": ["The curve would cost more than cutting the tree down, about three thousand dollars more. That was a lot more than six dollars. But Abby had also been doing some research, and she had discovered that a large tree gives shade, which cools houses and lowers electric bills. It also soaks up rainwater that would otherwise flood the street. Ms. Greene helped her to find the figures. She wrote them all on a big poster.", "Then the kids went door to door with a petition, which is a letter asking for change that many people sign. Elan was eight and very cute, so he did the talking. They collected two hundred and six signatures in four days. Mr. Tan offered to pay some of the cost. The bakery on the corner promised another piece of it. The kids sold lemonade and cookies under the tree itself, with a sign that said, \"Save Me!\" People laughed and paid much more than a dollar. By Sunday, they had raised twelve hundred dollars.", "It wasn't three thousand. But it was enough to get them noticed. Abby found out that the City Council held public meetings on Tuesdays. She wrote down what she wanted to say and practiced it in the mirror until her brother begged her to stop."]}, {"scene": "town", "art": ["🏛️", "🌳", "🍁"], "paras": ["At the meeting, Abby didn't complain. She stood up and held out her poster. \"You have a problem, and I think that you're right about it,\" she said. \"Somebody got hurt on that sidewalk, and it has to be fixed. It's just that there is a better way.\" She went through the numbers, one by one. She showed them Ms. Greene's drawing. Then she put a big glass jar on the table, full of crumpled dollar bills and quarters. \"This is twelve hundred and fourteen dollars. It's from your neighbors. We're asking you to pay the rest.\"", "The room went quiet, and then the head of Public Works cleared his throat. He was the man at the end of the maze, and he looked rather embarrassed. \"Nobody ever brought us a solution before,\" he said. \"They mostly just yell.\"", "The vote was unanimous. Two weeks later, a crew came out and built a new sidewalk with a smooth, graceful curve. It looked better than the old one. The city even started a program for other old trees.", "That October, the maple turned the color of a campfire once again. Someone had painted over the red X, and in its place was a small brass plate. Mr. Tan and the other neighbors had paid for it themselves. It read: \"Saved by the Mayor of Maple Street, age ten.\" Abby told them that she wasn't really the mayor. They told her to look around, and to tell that to the tree."]}], "words": [{"w": "removed", "syl": "re·moved", "say": "rih-MOOVD", "part": "action word", "mean": "took something away", "ex": "The worker removed the old fence from the yard."}, {"w": "illegal", "syl": "il·le·gal", "say": "ih-LEE-gul", "part": "describing word", "mean": "against the law", "ex": "It is illegal to park in front of a fire hydrant."}, {"w": "supervisor", "syl": "su·per·vi·sor", "say": "SOO-per-vy-zer", "part": "naming word", "mean": "a person who is in charge of workers", "ex": "The supervisor showed the new worker what to do."}, {"w": "petition", "syl": "pe·ti·tion", "say": "puh-TISH-un", "part": "naming word", "mean": "a letter asking for a change that many people sign", "ex": "Our class signed a petition for a longer recess."}, {"w": "signatures", "syl": "sig·na·tures", "say": "SIG-nuh-cherz", "part": "naming word", "mean": "people's names written in their own handwriting", "ex": "The card had the signatures of all my friends."}, {"w": "unanimous", "syl": "u·nan·i·mous", "say": "yoo-NAN-uh-mus", "part": "describing word", "mean": "agreed to by every person", "ex": "The vote to have pizza was unanimous."}], "qs": [{"p": 0, "q": "Why was the tree going to be cut down?", "opts": ["It had become sick and was about to fall.", "Mr. Tan wanted to build a new garage."], "right": "Its roots had cracked the sidewalk, and cutting it was cheaper."}, {"p": 1, "q": "What did Abby realize about the city?", "opts": ["It hated trees and wanted them all gone.", "Yelling loudly was the only thing that would work."], "right": "It had real problems to solve, so she should help solve them."}, {"p": 2, "q": "How did the kids show the city that people cared?", "opts": ["They chained themselves to the tree.", "They wrote on the sidewalk with paint."], "right": "They collected signatures and raised money from neighbors."}, {"p": 3, "q": "Why was the head of Public Works embarrassed?", "opts": ["He had tripped on the sidewalk himself.", "He had lost all of the city's money."], "right": "He realized that nobody had ever brought a real solution before."}, {"p": 3, "q": "What does the brass plate suggest?", "opts": ["Abby was elected to run the whole city.", "The tree belonged to Mr. Tan from then on."], "right": "You don't need a title to lead and help your community."}], "moral": "To change things, do not only complain. Learn about the problem and bring a real solution."}, {"id": "moonbase", "title": "The Moon Base Lunch Problem", "topic": "Science", "teaser": "Luna Station is 240,000 miles from the nearest grocery store, and someone just ruined the lettuce.", "pages": [{"scene": "space", "art": ["🌙", "🚀", "🥗"], "paras": ["The year was 2091, and Kai Tanaka lived on the moon. There were two hundred people at Luna Station, inside a cluster of white domes on the edge of Shackleton Crater. Kai was ten, one of only nineteen kids. He had grown up bouncing down the corridors in the low gravity, where he weighed about a sixth of what he would on Earth. He'd never seen rain or felt a breeze, although he'd read about them.", "His favorite place was the Green Dome, where the lettuce, tomatoes, and beans grew in long racks under purple lights. There wasn't any soil. The plant roots hung in troughs of water filled with nutrients, and the air pumps hummed all day. All of the fresh food for the station came from there. Everything else arrived by rocket, three times a year, and it tasted like cardboard.", "That summer, Kai was allowed to help the head gardener, Dr. Osei. He was given one simple job. Each morning, he had to check the numbers on Rack Six and add a small measured dose of nutrients to the water tank.", "\"It's a small job, but it's an important one,\" said Dr. Osei. \"In this place, every job matters.\""]}, {"scene": "lab", "art": ["🥀", "🧪", "😟"], "paras": ["One Tuesday, Kai was in a hurry, as his friend Mina had invited him to a low-gravity basketball game. He ran into the Green Dome, read the screen, and poured in the dose. He didn't look closely. He saw only later, as he was putting back the bottle, that the label read \"Concentrate, use one-tenth.\" He had grabbed the wrong one.", "He stared at the bottle, and a cold feeling crept across his skin. It would probably be fine, he told himself. It was just one tank. Nobody had seen him. He put the bottle back on the shelf and went to his game. He missed every shot.", "By Thursday, the lettuce on Rack Six had started to turn brown at the edges. By Friday, the whole rack was drooping, and the sick water had started to spread into the tank for Rack Seven. Dr. Osei stood looking at the plants with a deep line between her eyebrows. \"I don't understand it,\" she said. \"It could be a disease. If it's a disease, we might have to destroy every plant in the dome, and that would be a catastrophe. The next rocket is four months away.\"", "Kai's mouth went dry. He could fix this with one sentence. It was the most difficult sentence in the universe."]}, {"scene": "space", "art": ["🌌", "🌍", "💭"], "paras": ["That evening, he went up to the observation deck, where the window looked out over the gray, silent crater. The Earth hung in the black sky, small and blue. He had always wondered what it would be like to live there, where there would be other places to go. Here, there was nowhere to hide from anything. If the crops failed, everyone would suffer, and that included the babies in the nursery.", "He thought of the two hundred people eating cardboard for four months, and of Dr. Osei tearing out years of careful work, all because he hadn't wanted to get in trouble. Every minute that he waited, she was searching for the wrong problem.", "He ran the whole way back. In the low gravity, that was more like flying. Dr. Osei was still there, bent over a microscope, and she looked exhausted.", "\"It's not a disease,\" he blurted out. \"It was me. I used the wrong bottle on Tuesday, the concentrate. I saw it right after I did it, and I didn't tell anyone.\" His voice broke. \"I'm so sorry.\"", "Dr. Osei sat perfectly still. Then she took a very long breath and put down the sample she was holding. Kai waited for the shouting."]}, {"scene": "lab", "art": ["🌱", "🛠️", "🥗"], "paras": ["\"Too many nutrients,\" she said, already reaching for her tablet. \"That means the roots are burned, but it isn't catching. That means we can save them.\" She looked up at him. Her eyes were serious, but they were not angry. \"That was a bad mistake. And waiting three days made it much worse. But you've just saved me from pulling out the whole dome. Now, we have a problem to solve. Get your gloves.\"", "They worked all night. There was no fresh water to spare, because on the moon each drop is recycled. So Kai suggested that they run the tanks through the air-cleaning filters from the old dome, an idea he had gotten from a video that he watched in school. Dr. Osei raised her eyebrows, then got out a wrench. It took six hours and two broken clamps, but it worked. They saved Rack Seven completely, and about half of Rack Six.", "For the next month, there was less salad at Luna Station, and everyone knew why. Kai told them himself, standing up in the dining hall, with his ears burning. He expected people to be furious. A few were annoyed. But an old engineer stood up and clapped him on the shoulder. \"Everyone up here has made a mistake that could've hurt us,\" he said. \"Only the good ones say so fast.\"", "The following week, Kai went back to work on Rack Six. Dr. Osei had added one thing to the shelf: a second label, written in his handwriting. \"Read it twice.\""]}], "words": [{"w": "corridors", "syl": "cor·ri·dors", "say": "KOR-uh-derz", "part": "naming word", "mean": "long hallways in a building", "ex": "We walked down the long corridors of the hospital."}, {"w": "gravity", "syl": "grav·i·ty", "say": "GRAV-ih-tee", "part": "naming word", "mean": "the force that pulls things toward a planet or moon", "ex": "Gravity makes a ball fall back to the ground."}, {"w": "nutrients", "syl": "nu·tri·ents", "say": "NOO-tree-unts", "part": "naming word", "mean": "things in food and soil that living things need to grow", "ex": "Plants take in nutrients through their roots."}, {"w": "catastrophe", "syl": "ca·tas·tro·phe", "say": "kuh-TAS-truh-fee", "part": "naming word", "mean": "a terrible and sudden disaster", "ex": "The big flood was a catastrophe for the town."}, {"w": "microscope", "syl": "mi·cro·scope", "say": "MY-kruh-skohp", "part": "naming word", "mean": "a tool that makes very tiny things look much bigger", "ex": "We looked at a leaf under the microscope."}, {"w": "recycled", "syl": "re·cy·cled", "say": "ree-SY-kuld", "part": "action word", "mean": "used again after being cleaned or changed", "ex": "The old cans were recycled to make new ones."}], "qs": [{"p": 0, "q": "Where did the fresh food on Luna Station come from?", "opts": ["Rockets from Earth that came every week", "A farm on the outside of the crater"], "right": "The Green Dome, where it grew under purple lights"}, {"p": 1, "q": "What mistake did Kai make?", "opts": ["He forgot to feed the plants for a week.", "He broke one of the air pumps."], "right": "He poured in the wrong bottle because he was in a hurry."}, {"p": 1, "q": "Why did Kai's silence make things worse?", "opts": ["Nobody would ever have to eat cardboard again.", "It gave him more time to play basketball."], "right": "Dr. Osei was looking for a disease instead of the real problem."}, {"p": 2, "q": "What made Kai finally tell the truth?", "opts": ["Mina saw him and told Dr. Osei.", "Dr. Osei found the bottle on the shelf."], "right": "He thought about how everyone would suffer if the crops failed."}, {"p": 3, "q": "Why did the engineer say \"Only the good ones say so fast\"?", "opts": ["Good workers talk very quickly at meetings.", "Only the best workers never make any mistakes."], "right": "Good workers admit mistakes quickly so that problems can be fixed."}], "moral": "When you make a mistake, tell someone right away. Hiding it makes things worse, and honesty helps fix it."}];

  const addedList=h('div',{class:'stack',style:'gap:8px'});
  function drawAdded(){addedList.innerHTML='';if(!added.length){addedList.append(h('p',{class:'muted',style:'margin:0'},'No added stories yet. New stories appear on the shelf after the 30 that came with it.'));return}
    for(const s of added){let arm=false;const del=h('button',{class:'quiet',on:{async click(){if(!arm){arm=true;del.textContent='Tap again to remove';return}await removeStory(s.id);buildDict();drawAdded()}}},'Remove');
      addedList.append(h('div',{class:'row panel',style:'padding:10px 14px'},h('span',{class:'grow'},s.title),del))}}
  drawAdded();
  app.append(h('div',{class:'row',style:'margin-bottom:12px'},h('a',{class:'quiet lc',href:'index.html','aria-label':'Learning Corner'},'🏠',h('span',{class:'lw'},' Learning Corner')),h('button',{class:'quiet',on:{click(){location.hash=''}}},'📚 All stories')),h('h1',{style:'margin-bottom:12px'},'Add a story'),form,h('h2',{style:'margin:20px 0 10px'},'Stories you added'),addedList);
}
function parseStory(i){
  const errors=[];const req=(v,m)=>{if(!v.trim())errors.push(m)};
  req(i.title,'Add a title.');req(i.story,'Add the story text.');req(i.moral,'Add the lesson.');
  const words=i.words.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.split('|').map(x=>x.trim()));
  if(!words.length)errors.push('Add at least one word to learn.');
  const out=[];const text=i.story;
  words.forEach((a,n)=>{if(a.length<3||!a[0]||!a[1]||!a[2]){errors.push(`Word line ${n+1} needs: word | meaning | sentence.`);return}
    if(!new RegExp('\\b'+a[0].replace(/[^\w'-]/g,'')+'\\b','i').test(a[2]))errors.push(`The sentence for "${a[0]}" must use that exact word, because the spelling test blanks it out.`);
    out.push({w:a[0],syl:'',say:'',part:'',mean:a[1],ex:a[2]})});
  const blocks=i.qs.split(/\n\s*\n/).map(b=>b.split('\n').map(x=>x.trim()).filter(Boolean)).filter(b=>b.length);
  if(!blocks.length)errors.push('Add at least one question.');
  const qs=[];blocks.forEach((b,n)=>{if(b.length!==4){errors.push(`Question ${n+1} needs 4 lines: question, right answer, wrong answer, wrong answer.`);return}qs.push({p:0,q:b[0],right:b[1],opts:[b[2],b[3]]})});
  const paras=text.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  const pics=i.pics.trim().split(/\s+/).filter(Boolean).slice(0,4);
  const pages=paras.map(p=>({scene:i.scene,art:pics,paras:p.split('\n').map(x=>x.trim()).filter(Boolean)}));
  const base=(i.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'story');
  const id='added-'+base;
  return{errors,story:{id,title:i.title.trim(),topic:i.topic.trim()||'Added',teaser:i.teaser.trim(),pages,words:out,qs,moral:i.moral.trim()}};
}

/* ---------- routing ---------- */
function route(){
  const hs=location.hash.slice(1);
  if(hs==='words')wordsPage();else if(hs==='add')addPage();
  else if(hs.startsWith('story-')){if(!run||run.s.id!==hs.slice(6))start(hs.slice(6))}
  else{run=null;shelf()}
}
window.addEventListener('hashchange',()=>{run=null;$('#sheet').hidden=true;route()});
document.documentElement.style.setProperty('--size',local.get('size',22)+'px');
buildDict();route();connect();
</script>
