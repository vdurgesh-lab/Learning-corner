d it. As he read, the snort faded away, and his long face turned slowly pink. He sat down in the small chair at Oliver's desk."]}, {"scene": "school", "art": ["👨‍🏫", "❤️", "✏️"], "paras": ["For a long while, Mr. Pomfrey said nothing. When he finally spoke, his trumpet voice had shrunk to the size of a kazoo.", "\"When I was your age,\" he said, \"I gave a wrong answer in class, and my teacher made everyone laugh at me. I decided that it would never happen again. So I stopped saying that I didn't know. For forty years, I have simply said something, loudly.\" He rubbed his eyes. \"It's been rather exhausting.\"", "Ben had not expected that. He had thought that grown-ups were never embarrassed, and he suddenly felt sorry for this tall, thin man in the tiny chair.", "\"Ms. Lee says 'I don't know' all the time,\" Amara said. \"Then she says, 'Let's find out.' It's her favorite thing.\"", "When the bell rang, Mr. Pomfrey stood up in front of Room 9 and cleared his throat. \"Class,\" he said, \"please take out your notebooks. Spiders have eight legs, and bats are mammals. Canberra is the capital of Australia. I made a number of mistakes yesterday, and I apologize.\"", "Then Ben raised his hand. \"Mr. Pomfrey, why do cats purr?\"", "Mr. Pomfrey opened his mouth. He closed it. A brave and unfamiliar smile spread beneath his mustache. \"I don't know,\" he said, and he reached for a book. \"Let's find out.\""]}], "words": [{"w": "substitute", "syl": "sub·sti·tute", "say": "SUB-stih-toot", "part": "naming word", "mean": "a person or thing that takes the place of another", "ex": "We had a substitute while our teacher was away."}, {"w": "confidence", "syl": "con·fi·dence", "say": "KON-fih-dunss", "part": "naming word", "mean": "a strong feeling of being sure about something", "ex": "She walked onto the stage with confidence."}, {"w": "diagram", "syl": "di·a·gram", "say": "DY-uh-gram", "part": "naming word", "mean": "a simple drawing that shows how something works", "ex": "The diagram shows the parts of a flower."}, {"w": "reliable", "syl": "re·li·a·ble", "say": "rih-LY-uh-bul", "part": "describing word", "mean": "something you can trust to be right or work well", "ex": "Our old truck is slow but reliable."}, {"w": "corrections", "syl": "cor·rec·tions", "say": "kuh-REK-shunz", "part": "naming word", "mean": "changes that fix mistakes", "ex": "The teacher made corrections on my story."}, {"w": "exhausting", "syl": "ex·haust·ing", "say": "ig-ZAW-sting", "part": "describing word", "mean": "making you feel extremely tired", "ex": "Moving all of the boxes was exhausting work."}], "qs": [{"p": 0, "q": "What did Mr. Pomfrey claim on the first day?", "opts": ["He had never taught school before.", "He was afraid of the students."], "right": "He knew everything."}, {"p": 1, "q": "Why did the jokes stop being funny for Ben?", "opts": ["The class was not allowed to laugh at school.", "He found out that he was failing math."], "right": "He saw that people like Oliver might believe the wrong facts."}, {"p": 2, "q": "How did Ben and Amara check the facts?", "opts": ["They asked an older student on the bus.", "They called Ms. Lee at her home."], "right": "They looked them up in reliable books at the library."}, {"p": 2, "q": "Why did Ben choose to show Mr. Pomfrey the list first?", "opts": ["He was afraid of talking to the principal.", "He wanted to get a good grade from him."], "right": "He thought it was only fair to tell him privately."}, {"p": 3, "q": "Why had Mr. Pomfrey stopped saying \"I don't know\"?", "opts": ["He truly knew all of the right answers.", "The school had a rule against saying it."], "right": "A teacher had made the class laugh at him when he was young."}], "moral": "It is okay to say \"I don't know.\" Admitting what you don't know is how you learn."}, {"id": "nighttrain", "title": "The Night Train to Nowhere Station", "topic": "Fantasy", "teaser": "A ticket appears under Ezra's pillow. It promises any place he wants, as long as it isn't here.", "pages": [{"scene": "night", "art": ["🚂", "🌙", "🎫"], "paras": ["Ezra Stone had a list of the things that were wrong with his life. His bedroom was too small, because he shared it with his baby brother, who howled at night. His town was too boring, with only one traffic light. His family had moved here in June, and school started in three days, and he didn't know a single person. On the night that he added item number nineteen to his list, he found a golden ticket under his pillow.", "\"ADMIT ONE,\" it read, in curling letters. \"ANYWHERE BUT HERE. DEPARTS AT MIDNIGHT.\"", "At exactly twelve o'clock, a soft whistle blew outside his window. Ezra looked out and blinked. An old-fashioned train, as long and dark as a river, stood gleaming in the street, right where the Hendersons usually parked their van. Its windows glowed like lanterns. A conductor with a silver beard leaned out from the steps.", "\"All aboard,\" he called, not too loudly. \"Where to, young sir?\"", "Ezra pulled on his sneakers without even thinking about it. \"Somewhere better,\" he said, and he climbed on."]}, {"scene": "space", "art": ["🚂", "✨", "🏰"], "paras": ["The train did not exactly move. It was more as if the world moved past it. The first stop was a city made entirely of candy, where the sidewalks were licorice and the fountains ran with lemonade. Ezra ate until his stomach hurt. By the third hour, he discovered that everything tasted the same, and there wasn't anyone to tell about it. The candy people smiled at him politely, but they only ever talked about candy.", "He went back to the train. The next stop was a castle where he was declared king. Servants bowed whenever he sneezed, and no one ever disagreed with him. He ordered a feast, a parade, and a war against bedtime. It was marvelous for a while, until he told a joke and the whole court laughed before he had reached the end. He realized that they would laugh at anything, and that their laughter was as empty as a paper bag.", "\"Where to now?\" asked the conductor, punching his ticket. There were a great many holes in it by now.", "\"Somewhere better,\" Ezra said, but he said it with much less enthusiasm."]}, {"scene": "space", "art": ["🌌", "🚉", "👤"], "paras": ["They visited a planet of endless video games, where he played until his thumbs were numb. They visited a beach that was always sunny and an island where everyone was a champion at everything. Each place was perfect, and each one, after a short time, began to feel like a beautiful room with no door.", "Eventually, the train slowed down and sighed to a stop at a platform that stood in a pale gray fog. There were no buildings, and there was no sound at all. A faded sign swung on two rusty chains. It said: \"NOWHERE STATION.\"", "\"This is the end of the line,\" said the conductor. \"It's where people arrive if they keep on looking for anywhere but here. There's no one to bother you. There's nothing that's wrong, and nothing that's right.\"", "Ezra stepped down onto the platform. The silence pressed against his ears like cotton. He looked around for something to complain about, but there was nothing at all. Then, to his great surprise, he found himself thinking of his baby brother's howl. He thought of the way his mom sang off-key while she made eggs. A lump rose in his throat.", "\"How do I get home?\" he whispered."]}, {"scene": "home", "art": ["🏠", "👶", "🌅"], "paras": ["The conductor studied him for a moment. \"That's the one trip this ticket won't buy,\" he said, and his eyes twinkled. \"You can't get there by wishing. You'd have to pay with something of your own.\"", "\"I don't have anything!\" Ezra searched his pockets, and his fingers found a crumpled piece of paper. It was his list of things that were wrong. He unfolded it and read over all nineteen items. Then he took the pen from the conductor's pocket, turned the paper over, and began to write something different.", "\"My brother thinks that I'm funny,\" he wrote. \"We have a tree that I could climb. Mom sings. Dad made me pancakes shaped like states. There are kids at that school who don't know anyone either, probably.\"", "When he reached number nineteen, the paper began to shine, and the conductor punched it with a satisfied click.", "Ezra opened his eyes in his own small bed. Pale morning light came through the window, and there wasn't any train in the street. Across the room, his baby brother stood up in his crib, looked over at him, and howled with delight.", "Ezra laughed. He got up, lifted his brother out, and carried him to the kitchen, where someone was singing, slightly off-key. It was, he decided, an excellent place to begin."]}], "words": [{"w": "departs", "syl": "de·parts", "say": "dih-PARTS", "part": "action word", "mean": "leaves, especially to begin a trip", "ex": "The bus departs at eight o'clock sharp."}, {"w": "conductor", "syl": "con·duc·tor", "say": "kun-DUK-ter", "part": "naming word", "mean": "the person in charge of the passengers on a train", "ex": "The conductor checked each ticket on the train."}, {"w": "marvelous", "syl": "mar·vel·ous", "say": "MAR-vuh-lus", "part": "describing word", "mean": "wonderful and amazing", "ex": "We had a marvelous view from the top of the hill."}, {"w": "enthusiasm", "syl": "en·thu·si·asm", "say": "in-THOO-zee-az-um", "part": "naming word", "mean": "a feeling of being very excited and interested", "ex": "The team cheered with great enthusiasm."}, {"w": "eventually", "syl": "e·ven·tu·al·ly", "say": "ih-VEN-choo-uh-lee", "part": "how-something-is-done word", "mean": "after a long time; in the end", "ex": "We eventually found our way back to the car."}, {"w": "crumpled", "syl": "crum·pled", "say": "KRUM-puld", "part": "describing word", "mean": "crushed into wrinkles and folds", "ex": "He pulled a crumpled note from his pocket."}], "qs": [{"p": 0, "q": "What was printed on the golden ticket?", "opts": ["A trip to the candy city", "Only one ride home"], "right": "Anywhere but here"}, {"p": 1, "q": "Why did the castle stop being fun for Ezra?", "opts": ["The servants made him clean the castle.", "The king ordered him to go to bed."], "right": "The people would laugh at anything, so it felt empty."}, {"p": 2, "q": "What was Nowhere Station like?", "opts": ["It was crowded with many happy travelers.", "It was the best place he had visited."], "right": "It was gray and silent, with nothing right or wrong."}, {"p": 3, "q": "How did Ezra \"pay\" for the trip home?", "opts": ["He gave the conductor all of his money.", "He promised to work on the train."], "right": "He wrote a list of good things in his life."}, {"p": 3, "q": "What had changed about Ezra at the end?", "opts": ["He had moved to a much bigger house.", "He no longer lived with his baby brother."], "right": "He could now see the good things around him."}], "moral": "Be thankful for what you have. Happiness often comes from the people and places already around you."}, {"id": "sleddog", "title": "Tika Knows the Way", "topic": "Animals", "teaser": "In a whiteout, the trail is gone, and the only one who can find it is the youngest dog on the team.", "pages": [{"scene": "snow", "art": ["🐕", "🛷", "❄️"], "paras": ["Up in the far north of Alaska, where winter nights can last for twenty hours, Anaya Sims was learning to drive her uncle's sled dogs. She was eleven years old, and she had spent every winter of her life among the barking, tail-wagging teams at his kennel. Her favorite dog was also the smallest. Tika was a skinny, gray two-year-old with one blue eye and one brown eye, and she had a habit of stopping for no apparent reason, which drove everyone crazy.", "\"That dog is useless in a team,\" said Uncle Rob, shaking his head, after Tika had stopped the sled for the fourth time. \"She won't listen. A lead dog has to obey.\"", "\"She's not being disobedient,\" said Anaya. \"She's thinking about something.\"", "Her uncle laughed. \"You'd better hope that she thinks faster,\" he said.", "Anaya kept taking Tika out on practice runs anyway. She noticed that the dog would sniff at the air and cock her head, and that she usually stopped near thin ice or soft drifts. Was it only a coincidence? Anaya could not be sure, but she kept track of it."]}, {"scene": "snow", "art": ["🛷", "🌨️", "🏔️"], "paras": ["One February afternoon, Anaya and her uncle set out with a team of eight dogs to bring supplies to a cabin fifteen miles away. The sky was clear when they left, and the snow squeaked beneath the runners of the sled. At the halfway point, Uncle Rob slipped while he was untangling a line, and he landed hard on the ice. When he tried to get up, his face went white. His ankle would not hold his weight.", "\"It's only a sprain,\" he said through his teeth, although Anaya could see that it hurt badly. He climbed into the sled basket, and she took her place behind him on the runners. \"You'll have to drive us home. Keep to the trail, and go steady.\"", "Then the wind changed. Anaya felt it on her cheek before she saw anything, a sudden sharp breath from the north. Within ten minutes, the sky had turned white. Within twenty, the ground had turned white as well, and she could not tell where one ended and the other began. It was a whiteout, the thing that every musher fears. She could hardly see her own lead dogs, and the trail had completely vanished under the blowing snow."]}, {"scene": "snow", "art": ["🌬️", "🐕", "❓"], "paras": ["Anaya's lead dog, a big, reliable husky named Boss, stopped and looked back at her, as confused as she was. The team milled around in the wind. Anaya's fingers were growing stiff inside her mittens.", "\"Uncle Rob, I can't see the trail!\" she shouted.", "He raised his head. \"Don't wander,\" he called weakly. \"If you go the wrong way, there's the river...\" The rest of his words were carried off by the wind.", "Anaya's heart was hammering. She had to do something, and her mind ran through everything that she knew. Then she thought of Tika, way back in the team, sniffing the air on all of those practice runs. Everyone said that Tika didn't listen. But what if she had been listening all along, to something that the people could not hear?", "It was a risky decision. Her uncle would never have done it. Anaya walked along the line with her head down against the wind, unclipped Tika, and led her to the front. She clipped her in next to Boss. \"Okay, Tika,\" she said, her voice shaking. \"You've been telling us something for months. Tell me now.\"", "Tika looked at her with one blue eye and one brown one. Then she lowered her nose to the snow."]}, {"scene": "home", "art": ["🏠", "🔥", "🐾"], "paras": ["\"Hike!\" Anaya called. For a moment nothing happened. Then Tika began to walk, turning sharply to the left, away from where Anaya would have sworn the trail was. It felt completely wrong. Every part of her wanted to pull the team to the right, and she gripped the handlebar and made herself wait. She had chosen to trust this dog, and now she had to mean it.", "They went on like that for more than two hours. Twice Tika stopped dead and refused to move, and twice she swung wide, around something that Anaya could not see. Later, she would learn that those were places where the river ice had cracked. The wind screamed, and the snow stung her face, but the team kept following the small gray dog.", "At last, a yellow square of light appeared in the whiteness. It was the kitchen window of the kennel. Anaya's aunt ran out with a blanket, shouting with relief.", "A week later, when the swelling had gone down, Uncle Rob limped out to the kennel on crutches. He stopped in front of Tika and held out a piece of dried salmon.", "\"I said that you wouldn't listen,\" he told her. Tika took the fish politely. \"It turns out that I was the one who wasn't listening.\" He looked up at his niece. \"You, too, kept paying attention when nobody else did. That's the mark of a real musher.\""]}], "words": [{"w": "disobedient", "syl": "dis·o·be·di·ent", "say": "dis-uh-BEE-dee-unt", "part": "describing word", "mean": "refusing to do what you are told", "ex": "The disobedient puppy chewed the shoes again."}, {"w": "coincidence", "syl": "co·in·ci·dence", "say": "koh-IN-sih-dunss", "part": "naming word", "mean": "when two things happen at the same time by chance", "ex": "It was a coincidence that we wore the same shirt."}, {"w": "supplies", "syl": "sup·plies", "say": "suh-PLYZ", "part": "naming word", "mean": "things that people need, like food and tools", "ex": "The hikers packed their supplies for the long trip."}, {"w": "musher", "syl": "mush·er", "say": "MUSH-er", "part": "naming word", "mean": "a person who drives a dog sled", "ex": "The musher called to her dogs to run faster."}, {"w": "decision", "syl": "de·ci·sion", "say": "dih-SIZH-un", "part": "naming word", "mean": "a choice that you make after thinking", "ex": "Choosing which puppy to take was a hard decision."}, {"w": "relief", "syl": "re·lief", "say": "rih-LEEF", "part": "naming word", "mean": "the good feeling you get when a worry goes away", "ex": "She felt great relief when she found her lost keys."}], "qs": [{"p": 0, "q": "What did Anaya notice about Tika on practice runs?", "opts": ["Tika ran faster than all of the other dogs.", "Tika was afraid of the other dogs."], "right": "Tika usually stopped near thin ice or soft drifts."}, {"p": 1, "q": "Why did Anaya have to drive the sled home?", "opts": ["Her uncle had to stay at the cabin.", "She won a contest to do it."], "right": "Her uncle hurt his ankle."}, {"p": 2, "q": "What is a whiteout?", "opts": ["A race in which all the dogs are white.", "A kind of snow that is safe to drive on."], "right": "A storm in which blowing snow hides everything."}, {"p": 3, "q": "Why was it hard for Anaya to follow Tika?", "opts": ["Tika walked far too quickly to follow.", "Her uncle kept shouting at her to stop."], "right": "Tika's direction felt completely wrong to her."}, {"p": 3, "q": "What did Uncle Rob learn?", "opts": ["Tika should never lead a team again.", "Dried salmon is the best food for dogs."], "right": "He was the one who had not been listening."}], "moral": "Pay attention to those whom others overlook. Everyone has gifts that may not be easy to see."}, {"id": "library", "title": "The Last Library Card", "topic": "Courage", "teaser": "The town wants to close the library. Only one quiet girl has noticed, and she hates talking in public.", "pages": [{"scene": "town", "art": ["📚", "🏛️", "🚪"], "paras": ["Hana Mori had never raised her hand in class if she could possibly avoid it. Talking in front of people made her face burn and her words disappear. She was happiest in the little brick library on Fig Street, where nobody expected her to say anything, and where Mrs. Tully, the librarian, always saved the newest mystery books for her.", "One Monday, Hana noticed a paper taped to the library door. It was written in the dull language of grown-ups, and she had to read it twice. \"The City Council will vote on Thursday evening about closing the Fig Street Branch, in order to reduce the budget.\"", "She found Mrs. Tully at the desk, packing books into a box. \"Is it true?\" she whispered.", "Mrs. Tully sighed. \"Hardly anyone comes in anymore, dear, and the council thinks that the building costs too much. Anyone may speak at the meeting, but I doubt that it would change their minds.\"", "Hana looked around at the worn green chairs and the sunny corner where she had read her first chapter book. Something twisted in her chest. Who would speak for this place?"]}, {"scene": "home", "art": ["📝", "📊", "😟"], "paras": ["That night, Hana made a list of everyone who could speak at the meeting. Mrs. Tully had said that it wouldn't do any good. Hana's parents had to work on Thursday. Her friend Jo was going to her cousin's birthday party. Everyone cared, more or less, but they all assumed that someone else would handle it. By the time she reached the bottom of the page, there was only one name left, and she didn't like it at all. It was hers.", "\"I can't,\" she told her older brother, Ken. \"I'll throw up on the mayor.\"", "Ken looked up from his homework. \"So don't give a speech,\" he said. \"Just say what's true. You like facts. Bring facts.\"", "That idea helped. Facts were something that Hana understood. The next day, she stood beside the library door with a clipboard and a pencil. For three afternoons, she counted who came in, and then, using up all of her courage, she asked each person one question: \"What do you use the library for?\"", "A boy did his homework there because his apartment had no internet. An old man read the newspaper, since he couldn't afford to buy one. A woman was studying to become a nurse. The numbers began to tell a story that the council had not seen."]}, {"scene": "town", "art": ["🏛️", "🎤", "😰"], "paras": ["On Thursday evening, the council room was bigger and brighter than Hana had imagined, and there were seven grown-ups sitting behind a long table. Her parents had not been able to come, but Ken sat in the second row and gave her a thumbs up. When the mayor asked if anyone wished to speak about the library, the room went silent.", "Hana's legs felt like cold noodles. It would be easy to stay in her seat. Nobody would ever know. She thought about the woman who was studying to be a nurse. Then, before she could change her mind, she stood up and walked to the microphone, which was much too tall for her.", "\"My name is Hana Mori, and I am nine,\" she said, in a voice like a mouse in a snowstorm. Someone lowered the microphone for her. Her paper rattled in her hand. For a terrible moment, she could not remember how to read.", "She took a breath and looked at her first number, instead of looking at all of the faces. \"The report says that only forty people visit each day,\" she read. \"But the report counts only people who check out books. I counted everyone who walked in. It was one hundred and twenty-three.\""]}, {"scene": "town", "art": ["📚", "🗳️", "🌟"], "paras": ["The mayor put down her pen. Hana's voice was still shaking, but it kept going. She told them about the boy who had no internet, the man with the newspaper, and the woman who wanted to be a nurse. She read the numbers from her clipboard. She didn't try to be fancy. When she had finished, she said, \"Thank you,\" and sat down fast, her heart pounding as if she had just run a mile.", "For a moment, nobody moved. Then a man at the back stood up. \"I use that library too,\" he said. \"I didn't know that anyone could talk at these things.\" A woman stood up after him, and another after that. People who had come for other reasons began to tell their own stories.", "The council did not vote that night. Instead, they asked for a new study, using Hana's method of counting. Six weeks later, they voted five to two to keep the Fig Street Branch open.", "Mrs. Tully taped a new paper to the door. It was short, and Hana read it only once. Beneath the announcement, Mrs. Tully had written in her own hand: \"Saved by one quiet person with a clipboard.\"", "Hana still didn't like raising her hand in class. But the next time that she knew an answer, she looked at her desk for a moment, took a slow breath, and raised it anyway."]}], "words": [{"w": "council", "syl": "coun·cil", "say": "KOWN-sul", "part": "naming word", "mean": "a group of people chosen to make decisions for a town", "ex": "The city council voted to build a new park."}, {"w": "budget", "syl": "budg·et", "say": "BUJ-it", "part": "naming word", "mean": "a plan for how money will be spent", "ex": "Our family made a budget for the camping trip."}, {"w": "assumed", "syl": "as·sumed", "say": "uh-SOOMD", "part": "action word", "mean": "believed something was true without checking", "ex": "I assumed that the store was open, but it was closed."}, {"w": "courage", "syl": "cour·age", "say": "KUR-ij", "part": "naming word", "mean": "the strength to do something even though it is scary", "ex": "It took courage to tell the truth about the broken vase."}, {"w": "microphone", "syl": "mi·cro·phone", "say": "MY-kruh-fohn", "part": "naming word", "mean": "a tool that makes your voice louder", "ex": "The singer held the microphone close to her mouth."}, {"w": "method", "syl": "meth·od", "say": "METH-ud", "part": "naming word", "mean": "a way of doing something", "ex": "Her method for learning spelling words is to write each one three times."}], "qs": [{"p": 0, "q": "Why did the council plan to close the library?", "opts": ["The building was going to fall down soon.", "Mrs. Tully wanted to retire and move away."], "right": "They wanted to spend less money and thought few people came."}, {"p": 1, "q": "Why did Hana end up being the one to speak?", "opts": ["Her teacher gave her that homework.", "The mayor asked her to come to speak."], "right": "Everyone else assumed that someone else would do it."}, {"p": 1, "q": "What advice did Ken give that helped Hana?", "opts": ["Practice being loud in front of a mirror.", "Pretend that everyone is wearing silly hats."], "right": "Bring facts and say what is true."}, {"p": 2, "q": "What had the council's report gotten wrong?", "opts": ["It listed the wrong address for the library.", "It said that the library had no books left."], "right": "It counted only people who checked out books."}, {"p": 3, "q": "What happened after Hana spoke?", "opts": ["The mayor told everyone to leave.", "The council closed the library that same night."], "right": "Other people found the courage to speak up too."}], "moral": "One voice can make a difference, even a quiet one. When something matters, speak up."}, {"id": "sciencefair", "title": "The Volcano That Would Not Erupt", "topic": "Science", "teaser": "Every volcano at the science fair works perfectly. Malik's fails in front of the judges, and that's when things get interesting.", "pages": [{"scene": "school", "art": ["🌋", "🧪", "🏆"], "paras": ["Malik Ferguson had built the best volcano in the history of Lincoln Elementary. It stood three feet tall, with realistic ridges made from painted plaster and tiny trees that he had glued to its slopes. For two months, it had taken up half of the garage. In its hollow center sat a plastic bottle, ready to be filled with vinegar and baking soda.", "\"This one is going to win,\" he told his dad as they loaded it into the van. \"There will be foam everywhere.\"", "He tested it at home on the night before the fair, and the eruption was glorious, with pink foam gushing down the sides. On the morning of the fair, he stood proudly beside his masterpiece, wearing a white lab coat that was two sizes too large.", "There were four other volcanoes at the fair, but none was as big as his. The judges moved slowly from table to table with their clipboards. By the time that they reached him, a small crowd had gathered, and Malik poured the vinegar into the bottle with a flourish.", "Nothing happened.", "A few bubbles rose and popped. Someone in the crowd giggled. Malik's face grew hot."]}, {"scene": "school", "art": ["😳", "🫧", "📋"], "paras": ["He added more vinegar. A thin, sad line of foam dribbled over the rim and stopped halfway down the mountain. One of the judges, a tall woman with silver glasses, wrote something on her clipboard. \"Thank you, young man,\" she said kindly, and she moved on.", "Malik wanted to disappear into the plaster. His friend Luis gave him a sympathetic pat on the shoulder. \"It was still a good-looking volcano,\" he said, which somehow made things worse.", "When the judges were out of sight, Malik poured the failed mixture into a bucket. He could just go home. He could tell everyone that the vinegar had gone bad, and nobody would care. But as he stood there, something began to itch at his brain. It had worked perfectly last night. He had used the same bottle, the same vinegar, and the same amount of baking soda. So what was different?", "It was a real question, and that made it feel different from everything else that he had done for the fair. For two months, he had been building a model. He had known exactly what would happen. For the first time, he actually didn't know the answer, and he badly wanted to find out."]}, {"scene": "lab", "art": ["🌡️", "🔬", "📓"], "paras": ["Malik borrowed a notebook from Luis and began to think. He wrote down what had changed since last night. It was the same recipe, but it had been in a different place at a different time. Then he noticed that his hands were cold. He looked over at the open door of the gym, through which a freezing wind was blowing. The van had been cold too, and the bottle of vinegar had spent the whole night in the garage.", "He wrote a question at the top of the page: \"Does temperature change how fast the reaction goes?\"", "That was a variable, a thing that could be changed in order to see what happens. He ran to the cafeteria, where the lunch ladies listened to his breathless explanation and gave him six paper cups, a thermometer, and some hot water. He put the vinegar in three groups, ice cold, room temperature, and warm, and he added the same spoon of baking soda to each one, timing how long it fizzed and measuring how high the foam rose.", "The difference was clear. The warm vinegar foamed up fast and high. The ice-cold vinegar barely fizzed at first, and then it worked slowly. He repeated each test twice, as his teacher had taught him, and his hands were no longer cold at all."]}, {"scene": "school", "art": ["📊", "🏅", "💡"], "paras": ["When the judges made their final round, they found Malik sitting on the floor behind his enormous volcano, surrounded by paper cups. A chart in shaky pencil was taped over his neat poster. He jumped up, and his lab coat slid down one shoulder.", "\"Excuse me,\" he said. \"My volcano failed, and I think that I know why.\" He showed them the chart and explained each of his three groups. He told them what he had changed and what he had kept the same. \"Chemical reactions go faster when the ingredients are warmer,\" he finished. \"At least, that's what my tests show. I would need to run a lot more of them to be sure.\"", "The woman with the silver glasses looked at the chart for a very long time. Then she looked at the beautiful, useless mountain. \"Do you know,\" she said, \"that everyone here has shown me what they already knew? You are the only student today who has done any science.\"", "Malik did not win first place, because the rules required a finished project. But he got a special award, and the certificate is still on his wall. It says, \"For the Most Valuable Failure.\" He kept the volcano too, although he now uses it to hold his collection of paper cups."]}], "words": [{"w": "realistic", "syl": "re·al·is·tic", "say": "ree-uh-LIS-tik", "part": "describing word", "mean": "looking or seeming like the real thing", "ex": "The realistic toy dinosaur looked ready to bite."}, {"w": "eruption", "syl": "e·rup·tion", "say": "ih-RUP-shun", "part": "naming word", "mean": "a sudden burst of something, like lava from a volcano", "ex": "The eruption sent ash high into the sky."}, {"w": "sympathetic", "syl": "sym·pa·thet·ic", "say": "sim-puh-THET-ik", "part": "describing word", "mean": "showing that you care about someone's feelings", "ex": "My sister gave me a sympathetic hug after I lost."}, {"w": "variable", "syl": "var·i·a·ble", "say": "VAIR-ee-uh-bul", "part": "naming word", "mean": "something that can change in an experiment", "ex": "The amount of water was the only variable we changed."}, {"w": "thermometer", "syl": "ther·mom·e·ter", "say": "ther-MOM-uh-ter", "part": "naming word", "mean": "a tool that measures how hot or cold something is", "ex": "The thermometer showed that it was freezing outside."}, {"w": "reaction", "syl": "re·ac·tion", "say": "ree-AK-shun", "part": "naming word", "mean": "a change that happens when things are mixed together", "ex": "Mixing vinegar and baking soda causes a fizzy reaction."}], "qs": [{"p": 0, "q": "What went wrong in front of the judges?", "opts": ["The volcano fell off of the table.", "Malik forgot to bring the vinegar."], "right": "The volcano barely foamed at all."}, {"p": 1, "q": "What made Malik stay and think, instead of going home?", "opts": ["His dad told him that he had to stay.", "The judges asked him to try it again."], "right": "He wanted to know why it worked last night but not today."}, {"p": 2, "q": "What variable did Malik test?", "opts": ["The height of the volcano", "The color of the foam"], "right": "The temperature of the vinegar"}, {"p": 2, "q": "What did the tests show?", "opts": ["Cold vinegar made the most foam of all.", "Temperature made no difference at all."], "right": "Warm vinegar foamed faster and higher than cold vinegar."}, {"p": 3, "q": "Why did the judge say Malik was the only one doing science?", "opts": ["He had built the largest volcano at the fair.", "He wore a lab coat like a real scientist."], "right": "He asked a real question and tested it to find the answer."}], "moral": "Mistakes can be your best teachers. Instead of hiding a failure, ask why it happened."}, {"id": "crow", "title": "The Crow Who Sold the Moon", "topic": "Folktale", "teaser": "A clever crow can trick anyone in the market, until she tries to sell something that isn't hers.", "pages": [{"scene": "town", "art": ["🐦‍⬛", "🌕", "🏺"], "paras": ["In the old days, when animals still kept shops and paid their debts in berries, there lived a crow named Inka who was the cleverest trader in the Market of Tall Grass. She could sell a hole to a mole and a puddle to a duck. She had once persuaded a badger to pay three acorns for his own shadow.", "Inka was very proud of her tricks, and she counted her riches each night in her nest. She had shiny buttons and silver spoons, and she had more acorns than she could eat in ten winters. Yet she could not stop wanting more. \"Clever creatures deserve everything they can get,\" she liked to say. \"If somebody is foolish enough to buy it, that's their problem.\"", "One summer evening, she was admiring the full moon as it rose above the pond. It was enormous and golden, and it floated on the still water like a coin on a dark plate. A wicked idea landed in her mind, as softly as a feather.", "The next morning, she hung out a brand-new sign. It said: \"THE MOON FOR SALE. CHEAP. ONE OWNER.\""]}, {"scene": "river", "art": ["🌕", "🐸", "🐢"], "paras": ["The animals gathered around in disbelief. \"No one can own the moon,\" said Oda, an old turtle, who had seen a good many years and a good many tricks.", "\"I'll prove that it is mine,\" Inka said. That night, she led the crowd down to the pond. There lay the moon, shining in the water. \"You see? It lives in my pond. For a small price, I will sell you each a piece of it. You will have moonlight all your own, and you will never be in the dark again!\"", "The frogs were the first to pay, and the mice came next, with their small savings. The rabbits emptied their winter stores, and the hedgehogs followed. Inka gave each buyer a little clay jar, and she told them to dip it into the pond while the moon was on the water and then to seal it tight. It wasn't until she was back in her nest, counting her enormous pile of food, that she laughed aloud.", "\"Foolish, all of them,\" she cackled. But when the first frost came, the jars were opened and found to contain only dark pond water. The animals had no food left, and their winter had only just begun."]}, {"scene": "snow", "art": ["❄️", "🐇", "🥶"], "paras": ["The little creatures came to Inka's tree, thin and shivering, and they begged her to return what they had paid. She looked down from her heavy nest and shook her head.", "\"A deal is a deal,\" she said. \"You should have been more clever.\"", "Old Oda the turtle said nothing. He was preparing for his long winter sleep, but he stayed awake a little longer in order to think. He knew that you could not out-shout a crow, and that there was no use in scolding her. Instead, he slowly climbed the bank and looked up at her.", "\"You are a very great trader,\" he said, in his slow voice. \"Would you like to make the biggest bargain of your life? There is something that is worth far more than the moon. I have seen it. At the top of Snow Mountain, there is a treasure of pure white jewels, enough to fill a hundred nests. Nobody has ever taken them. But you would have to carry your entire treasure there, in order to trade with the mountain spirit.\"", "Inka's eyes glittered with greed. She did not stop to ask questions. Clever creatures, after all, deserved everything they could get."]}, {"scene": "mountain", "art": ["🏔️", "🐦‍⬛", "🌰"], "paras": ["It took her eleven trips to carry all of her treasure to the top of the mountain. When she arrived for the last time, panting and half frozen, she looked around. The whole peak was covered in beautiful white jewels. They glittered in the moonlight, heaps and heaps of them. She snatched one up with a cry of joy, and it melted in her beak.", "It was snow. It was only snow.", "Inka whirled around. Far below, the animals of the valley had found her empty nest and the trail of fallen acorns, and they were joyfully carrying the food back to their homes. She flew down at once, screaming with rage. But she was tired, her feathers were iced, and there was no one left who would ever buy anything from her again.", "\"You cheated me!\" she cried at the turtle.", "Oda looked up at her, already half asleep. \"I told you that it was white, and that it shone, and that no one had ever taken it,\" he said. \"A deal is a deal.\" He pulled in his head. \"You should have been more clever.\"", "Inka survived the winter on the kindness of the very mice she had robbed, who shared what they had. It was the most humiliating experience of her life, and it was also the first time she ever said thank you."]}], "words": [{"w": "persuaded", "syl": "per·suad·ed", "say": "per-SWAY-did", "part": "action word", "mean": "got someone to do something by giving reasons", "ex": "She persuaded her dad to let her stay up late."}, {"w": "disbelief", "syl": "dis·be·lief", "say": "dis-buh-LEEF", "part": "naming word", "mean": "the feeling of not being able to believe something", "ex": "He stared at the huge fish in disbelief."}, {"w": "bargain", "syl": "bar·gain", "say": "BAR-gun", "part": "naming word", "mean": "a deal, or something bought for a good price", "ex": "Two books for a dollar is a real bargain."}, {"w": "glittered", "syl": "glit·tered", "say": "GLIT-erd", "part": "action word", "mean": "shone with many small flashes of light", "ex": "The snow glittered in the morning sun."}, {"w": "greed", "syl": "greed", "say": "GREED", "part": "naming word", "mean": "wanting much more than you need", "ex": "His greed made him take all of the candy."}, {"w": "humiliating", "syl": "hu·mil·i·at·ing", "say": "hyoo-MIL-ee-ay-ting", "part": "describing word", "mean": "making someone feel very ashamed and foolish", "ex": "It was humiliating to trip in front of the whole school."}], "qs": [{"p": 0, "q": "What was Inka's belief about tricking others?", "opts": ["Tricks should only be played on the biggest animals.", "It is wrong, but she needs the food for her family."], "right": "If someone is foolish enough to buy it, that is their problem."}, {"p": 1, "q": "How did Inka \"prove\" that she owned the moon?", "opts": ["She flew up and touched it with her wing.", "She showed them an old paper with her name."], "right": "She showed the animals its reflection in the pond."}, {"p": 2, "q": "Why did Oda not scold Inka?", "opts": ["He was too frightened of the crow.", "He had bought too many jars from her."], "right": "He knew that scolding would not work, so he made a plan."}, {"p": 3, "q": "What were the \"white jewels\" on the mountain?", "opts": ["Silver spoons", "Pieces of the moon"], "right": "Snow"}, {"p": 3, "q": "Why did Oda repeat Inka's own words at the end?", "opts": ["Because he had forgotten what else to say.", "To tell her that she was still the most clever."], "right": "To show that her own trick had been used on her."}], "moral": "Tricking others to get rich will catch up with you. Greed can make even a clever person foolish."}, {"id": "cardboard", "title": "Captain Wobble's Cardboard Ship", "topic": "Friends", "teaser": "Sam builds a giant ship in the yard, and he has one rule: no one else is allowed on board.", "pages": [{"scene": "garden", "art": ["📦", "🚢", "🏴‍☠️"], "paras": ["When the Nguyens got a new refrigerator, Sam got the box. It was the greatest thing that had ever happened to him. By Saturday afternoon, with the help of three more boxes, a roll of silver tape, and a broom for a mast, the backyard held a mighty vessel that he named the Wobble. It had a steering wheel made from a pizza pan, a telescope made from a paper towel tube, and a flag with a skull that looked a little like a potato.", "Sam, of course, was the captain. Captain Wobble, terror of the Seven Backyards, had sailed through typhoons and fought off giant squid before lunch.", "When he looked up from his telescope, he saw a girl hanging over the fence. She wore a big purple brace on one leg, and she had moved in next door just a week ago.", "\"That's so cool,\" she said. \"I'm Rosa. Can I be on your crew?\"", "Sam looked at the leg brace, and he looked at his ship. It was narrow, and it was tricky to climb into. And it was his. \"Sorry,\" he said. \"It's a one-person ship. There's no room.\"", "Rosa's face fell. \"Oh,\" she said. \"Okay.\" She went away."]}, {"scene": "garden", "art": ["🌊", "🐙", "📦"], "paras": ["For a while, Sam sailed on. He fought a pirate fleet, which was hard to do alone, because he had to be both the good guys and the bad guys. He discovered a treasure island, but there was no one to dig with him. He shouted, \"Land ho!\" and nobody replied.", "By Sunday, he noticed something strange. The Wobble looked rather like a pile of boxes. The giant squid was starting to look like a garden hose. He kept glancing at the fence, and he was annoyed with himself for doing it.", "Later that day, he peeked over. Rosa was sitting on her back steps with a stack of paper, drawing something with total concentration. When she held it up to the light, Sam stopped breathing. It was a map, an amazing one, with sea monsters and a compass rose and a coastline that wiggled for pages. In one corner, in tiny letters, it said: \"The Unknown Waters, for the use of any ship that needs it.\"", "Sam felt a hot, uncomfortable feeling in his stomach, and it wasn't from lunch. He had told her that there was no room. There was plenty of room. He had simply been too selfish to make any."]}, {"scene": "garden", "art": ["🗺️", "🛠️", "👫"], "paras": ["It took him an hour to get up the nerve to knock on her gate. When she opened it, he stared at his shoes.", "\"There's room on my ship,\" he said. \"There was always room. I lied about it, and that was a rotten thing to do. I'm sorry.\" He swallowed. \"Also, I need a navigator. A ship can't go anywhere without somebody who knows the way.\"", "Rosa crossed her arms. She looked at him for a long, long moment. \"Why did you say there wasn't room?\" she asked.", "Sam's ears burned. \"Partly because it was mine,\" he admitted. \"And partly because of your brace. I thought that you couldn't climb in. I didn't even ask.\"", "\"You're right. I can't climb in,\" said Rosa. \"Not over the side like that.\" Sam's heart sank. Then she grinned. \"So build a door.\"", "Sam blinked. It had never occurred to him. He ran for the scissors. Together they cut a wide, swinging door in the hull and made a ramp from a flat piece of cardboard. Rosa pointed out that the ship would be more stable with a wider base, and it was. By dinnertime, the Wobble was twice as big and much more impressive."]}, {"scene": "ocean", "art": ["⛵", "🗺️", "🌅"], "paras": ["The Wobble's next voyage was the best in the history of the Seven Backyards. Rosa unrolled her map on the deck, weighted it down with two rocks, and studied it with her chin in her hand.", "\"Danger ahead, Captain!\" she cried. \"According to my calculations, we're about to enter the Sea of Boiling Pudding.\"", "\"Hard to the left!\" Sam yelled, spinning the pizza pan.", "Soon other kids began to appear at the fence. Theo from down the street became the ship's cook, serving rocks and crackers. Little Mina became the lookout, and she spotted a shark in the birdbath. There were arguments about who got to be the giant squid, and the solution was that everyone took turns. The ship kept growing, too, as neighbors brought over more boxes. They needed a second ramp, a lower deck, and eventually a flag that looked less like a potato, which Rosa drew.", "At sunset, Sam stood at the wheel, with his whole loud, laughing crew around him. He remembered how quiet the ship had been when he was the only one aboard, and how quickly the sea had turned back into grass.", "\"Captain,\" said Rosa, tapping the map, \"what's our next heading?\"", "Sam looked around. \"You're the navigator,\" he said. \"You tell me.\""]}], "words": [{"w": "vessel", "syl": "ves·sel", "say": "VES-ul", "part": "naming word", "mean": "a ship or a large boat", "ex": "The vessel sailed slowly out of the harbor."}, {"w": "typhoons", "syl": "ty·phoons", "say": "ty-FOONZ", "part": "naming word", "mean": "very powerful storms that form over the ocean", "ex": "Typhoons bring strong winds and heavy rain to the islands."}, {"w": "concentration", "syl": "con·cen·tra·tion", "say": "kon-sun-TRAY-shun", "part": "naming word", "mean": "thinking very hard about just one thing", "ex": "The puzzle took all of my concentration."}, {"w": "navigator", "syl": "nav·i·ga·tor", "say": "NAV-ih-gay-ter", "part": "naming word", "mean": "the person who figures out which way a ship should go", "ex": "The navigator studied the stars to find the way."}, {"w": "stable", "syl": "sta·ble", "say": "STAY-bul", "part": "describing word", "mean": "steady and not likely to fall or tip over", "ex": "Make sure the ladder is stable before you climb it."}, {"w": "voyage", "syl": "voy·age", "say": "VOY-ij", "part": "naming word", "mean": "a long trip, usually by sea or through space", "ex": "The voyage across the ocean took two weeks."}], "qs": [{"p": 0, "q": "Why did Sam really tell Rosa that there was no room?", "opts": ["The ship was too full of cardboard treasure.", "His mother told him not to play with new kids."], "right": "He wanted the ship for himself and assumed she could not climb in."}, {"p": 1, "q": "Why did playing alone stop being fun?", "opts": ["It started to rain on all of the boxes.", "The broom mast had fallen over."], "right": "There was no one to share the adventure with."}, {"p": 1, "q": "What made Sam feel bad when he saw Rosa's map?", "opts": ["He thought she had copied his map.", "He was angry that her map was better."], "right": "He saw how wonderful she was and knew he had been selfish."}, {"p": 2, "q": "How did Sam show he was truly sorry?", "opts": ["He gave her the entire ship to keep.", "He sent his mother over to explain."], "right": "He admitted what he did and asked Rosa what would work."}, {"p": 2, "q": "What did Rosa suggest for the ship?", "opts": ["Painting the whole ship purple", "Taking the broom down"], "right": "Building a door and a ramp"}], "moral": "Include others, and you will all have more fun. Do not decide what someone can do without asking them."}, {"id": "whale", "title": "The Song Under the Sea", "topic": "Science", "teaser": "Lena's microphone picks up a whale that sounds different from all the others. It may be calling for help.", "pages": [{"scene": "ocean", "art": ["🐋", "🎧", "🚢"], "paras": ["Lena Whitefeather spent the summer on her aunt's research boat, the Blue Heron, off the coast of Washington. Aunt Dee was a marine biologist who studied orcas, the black-and-white whales that live in family groups called pods. Every day, she lowered a hydrophone over the side of the boat. It was a special microphone that worked underwater, and it let them listen to the ocean through a pair of headphones.", "Lena had expected the sea to be silent, but it was the noisiest place that she had ever heard. She heard the snap and crackle of shrimp, the groan of ships, and then, drifting up from the deep, a sound that made her skin tingle. It was a long, rising whistle, followed by a series of clicks.", "\"That's J Pod,\" said Aunt Dee, smiling at the screen. \"Each family has its own calls, almost like its own language. Baby whales learn them from their mothers.\"", "Over the next weeks, Lena learned to recognize a dozen different calls. She kept a logbook, and she drew little pictures of the sound patterns. She liked one whale's call best, a young orca that the scientists called Comet, whose whistle always ended in a funny upward squeak."]}, {"scene": "ocean", "art": ["🚢", "🔊", "😟"], "paras": ["One morning, as they listened, Lena's forehead wrinkled. \"Comet sounds different,\" she said. \"The squeak is gone, and the calls are farther apart. Also, he's repeating the same call over and over.\"", "Aunt Dee put on a second pair of headphones. A huge cargo ship was passing several miles away, and its engine filled the water with a deep, grinding roar. \"That's part of it,\" she said, frowning. \"Orcas find food and keep track of each other by using sound. When it gets too loud, it's like trying to have a conversation at a rock concert while wearing a blindfold.\"", "She explained that whales send out clicks, which bounce off fish and return to them. It is called echolocation, and it works something like seeing with sound. A loud ship can drown out the echoes, so the whales have trouble hunting. Salmon were already scarce this year, and that made things worse.", "\"Can't someone make the ships quieter?\" Lena asked.", "\"Well,\" said Aunt Dee, with a tired sigh. \"That's a very good question. Lots of people would say that one kid's logbook won't make any difference.\"", "Lena looked down at her logbook, and she thought about that."]}, {"scene": "lab", "art": ["📊", "🐋", "📈"], "paras": ["Back at the research station, Lena spread her notes across the big table. For eight weeks, she had written down the time of every call, and she had also noted each passing ship. She had never thought of it as real data, but as she started to fill in a chart, a pattern began to appear. On the days when many ships passed through the strait, the pod's calls became shorter and fewer, and the whales seemed to spend less time feeding.", "Aunt Dee looked over her shoulder, and she became very still. \"Lena,\" she said, \"this is really useful. Do you know how much time this could save us?\" She checked it against the station's records, and the numbers matched.", "Aunt Dee added Lena's chart to a report for a group of people who managed the shipping lanes. In that report, she also included recordings. Scientists had already been asking the shipping companies to slow down when they passed through the whales' feeding areas, because a slower ship is a far quieter ship. Some captains had agreed, but many others had not.", "Lena had one more idea. \"They've all seen numbers,\" she said. \"Have they ever actually heard it?\""]}, {"scene": "ocean", "art": ["🎧", "🐋", "🌅"], "paras": ["A month later, Lena sat at the back of a large meeting room in Seattle, swinging her feet nervously, while a row of shipping company managers looked at their watches. When it was time for Aunt Dee to speak, she didn't show a chart. Instead, she turned up the speakers.", "The room filled with whistles and clicks, the sweet voice of a mother and her calf. Comet's funny squeak rang out, and several people smiled. Then, slowly, the sound of a ship grew beneath it, a grinding roar that got louder and louder until the whales could not be heard at all. It went on for a very long time. Nobody looked at their watches.", "That autumn, more companies agreed to take part in the slow-down program. It would not solve everything, Aunt Dee warned her. The whales still faced many dangers, and helping them would take years of hard work.", "On Lena's last day aboard the Blue Heron, she put on the headphones for one more listen. The water was calm, and the ships seemed farther away. At first, she heard nothing but shrimp. Then, from out of the deep blue, came a long, rising whistle. It ended with a small, funny, upward squeak.", "Lena grinned so hard that her cheeks hurt. She wrote the time in her logbook, then she added one word: \"Listening.\""]}], "words": [{"w": "hydrophone", "syl": "hy·dro·phone", "say": "HY-druh-fohn", "part": "naming word", "mean": "a microphone that hears sounds under water", "ex": "The hydrophone picked up the song of a distant whale."}, {"w": "recognize", "syl": "rec·og·nize", "say": "REK-ug-nyz", "part": "action word", "mean": "know someone or something because you have seen or heard it before", "ex": "I can recognize my dog's bark anywhere."}, {"w": "echolocation", "syl": "ech·o·lo·ca·tion", "say": "ek-oh-loh-KAY-shun", "part": "naming word", "mean": "finding things by making sounds and listening for the echoes", "ex": "Bats use echolocation to catch insects at night."}, {"w": "scarce", "syl": "scarce", "say": "SKAIRSS", "part": "describing word", "mean": "hard to find because there is not much of it", "ex": "Water is scarce in the desert."}, {"w": "data", "syl": "da·ta", "say": "DAY-tuh", "part": "naming word", "mean": "facts and numbers gathered in order to learn something", "ex": "We collected data about how many birds visited the feeder."}, {"w": "pattern", "syl": "pat·tern", "say": "PAT-ern", "part": "naming word", "mean": "something that happens or repeats in a regular way", "ex": "The numbers 2, 4, 6, 8 make a simple pattern."}], "qs": [{"p": 0, "q": "What is a hydrophone used for?", "opts": ["Finding the way across the ocean", "Measuring how deep the water is"], "right": "Listening to sounds under water"}, {"p": 1, "q": "Why is ship noise a problem for orcas?", "opts": ["It makes the water too warm for them.", "It scares away all of the shrimp."], "right": "It drowns out the sounds they use to hunt and stay together."}, {"p": 2, "q": "What pattern did Lena find?", "opts": ["The whales always followed the biggest ships.", "The whales called most loudly on sunny days."], "right": "When many ships passed, the whales called less and fed less."}, {"p": 3, "q": "Why did playing the sounds work better than showing charts?", "opts": ["The managers could not read the numbers.", "The sound was funnier than the charts."], "right": "It let the managers actually hear the problem for themselves."}, {"p": 3, "q": "What does the ending suggest about the problem?", "opts": ["The whales are now completely safe forever.", "Lena's work did not help the whales at all."], "right": "There is hope, but the work is not finished."}], "moral": "We share the Earth with other creatures. Careful work and caring can help protect them."}, {"id": "clock", "title": "Grandfather's Silent Clock", "topic": "History", "teaser": "The old clock stopped the day Grandpa Lucas came to live with them. Inside it is a story nobody has heard.", "pages": [{"scene": "home", "art": ["🕰️", "👴", "📦"], "paras": ["When Grandpa Lucas came to live with the Marshes, he brought one large suitcase, a bad hip, and a clock taller than Noor's father. It was made of dark, scratched wood, and it stood in the hall like a stern old man who disapproved of everything. It also didn't work. Its hands were frozen at 3:17, and it had not ticked in anybody's memory.", "\"Why do we have to keep that ugly thing?\" Noor complained to her mother. Noor was nine, and she'd had to give up her bedroom so that Grandpa could have the downstairs room. He moved slowly and told the same stories twice. He couldn't hear the television, so he turned it up until the walls shook. He called her Nora half of the time.", "\"He's had a hard year,\" said Mom. \"Be patient. And he's your grandfather, so be kind.\"", "Noor tried, sort of. But when Grandpa started telling her about the old days, she nodded without looking up from her tablet. After a while, he stopped trying. He began to spend most of each day in the hall, with a small rag, polishing that broken clock."]}, {"scene": "home", "art": ["🔧", "🕰️", "📜"], "paras": ["One rainy Saturday, the power went out, which left Noor with nothing to do. She wandered into the hall, where Grandpa was sitting on a stool with the clock's side panel open and a tiny screwdriver in his shaking fingers.", "\"What's it matter if it runs?\" she asked, leaning on the wall. \"We have phones.\"", "He didn't answer that. Instead, he held out the screwdriver. \"My eyes aren't what they were,\" he said. \"Can you see that small brass wheel? The screw is loose.\"", "Noor sighed, but she knelt beside him and looked inside. To her surprise, it was beautiful in there, with dozens of brass gears set one behind another, like a tiny city. She found the screw and turned it, and a wheel the size of a dime began to move with a soft click.", "Then her fingers brushed against something stuck to the inside of the case. It was a yellowed envelope, as fragile as a dead leaf. \"Grandpa,\" she said, \"there's something here.\"", "He took it from her, and his hands went still. \"I had forgotten,\" he said in a strange voice. He looked older than she had ever seen him. \"My mother put that in there before we left.\""]}, {"scene": "ocean", "art": ["🚢", "🕰️", "🌫️"], "paras": ["They sat on the floor by the light of the window as the rain fell, and Grandpa told her a story that he had never told anyone in that house. When he was eight, his family had been forced to leave their village across the ocean because of a war. They'd been able to take only what they could carry. His father left behind his books and tools, and his mother left her wedding china, but she refused to leave the clock.", "\"It was absurd,\" Grandpa said, shaking his head. \"We had no money and no food, and we dragged that clock onto a ship, wrapped up in blankets. People laughed at us. My brother and I carried it down the gangway when we got here, and I thought my arms would fall off.\"", "He opened the envelope. Inside was a small, faded photograph of a boy with big ears standing in front of the clock, along with a note in a language that Noor couldn't read.", "\"What does it say?\" she asked.", "His voice caught. \"It says, 'Wherever this clock is ticking, that is home.'\" He wiped his eyes with the back of his hand. \"It stopped at 3:17, on the afternoon your grandmother died. I never had the heart to fix it.\""]}, {"scene": "home", "art": ["🕰️", "⏰", "❤️"], "paras": ["Noor looked at him. She looked at the bad hip, the shaking fingers, and the big ears, which he still had. She'd thought that he was only an old man who told boring stories. It hadn't occurred to her that he'd once been a boy on a ship, who was scared and carrying something heavy. How many of his stories had she missed by looking at her tablet? Shame crept up her neck.", "\"Grandpa,\" she said slowly, \"do you think we could fix it? I could be your eyes. And you could tell me the stories while we work.\"", "It took them most of the winter. They ordered tiny parts in the mail and read old manuals, and Noor learned the names of the escapement and the pendulum. As they worked, she learned other things as well, including the names of her great-grandparents and the taste of the plum cakes from a village that no longer existed. She began writing it all down, so that the stories would not be lost.", "On the first warm evening in March, Noor gave the pendulum a gentle push. The whole family stood there holding their breath. Then, slow and deep, the clock began to tick.", "Grandpa closed his eyes and listened. \"There,\" he said softly. Noor slipped her hand into his. He squeezed it, and he called her by her right name."]}], "words": [{"w": "stern", "syl": "stern", "say": "STURN", "part": "describing word", "mean": "serious and strict", "ex": "The teacher gave a stern look to the noisy class."}, {"w": "fragile", "syl": "frag·ile", "say": "FRAJ-ul", "part": "describing word", "mean": "easy to break", "ex": "Be careful with that fragile glass bird."}, {"w": "absurd", "syl": "ab·surd", "say": "ub-SURD", "part": "describing word", "mean": "very silly or making no sense", "ex": "The idea of a fish riding a bike is absurd."}, {"w": "gangway", "syl": "gang·way", "say": "GANG-way", "part": "naming word", "mean": "a walkway used for getting on and off a ship", "ex": "The passengers walked down the gangway to the dock."}, {"w": "pendulum", "syl": "pen·du·lum", "say": "PEN-juh-lum", "part": "naming word", "mean": "a weight that swings back and forth, as in a clock", "ex": "The pendulum in the old clock swung slowly."}, {"w": "manuals", "syl": "man·u·als", "say": "MAN-yoo-ulz", "part": "naming word", "mean": "books that explain how to use or fix something", "ex": "We read the manuals before we set up the new computer."}], "qs": [{"p": 0, "q": "At the start, how does Noor feel about Grandpa and his clock?", "opts": ["She loves listening to all of his stories.", "She wants to learn to fix old clocks."], "right": "She is annoyed and does not pay attention to him."}, {"p": 1, "q": "What did Noor find inside the clock?", "opts": ["A bag of gold coins from the war", "A missing brass key"], "right": "An old envelope with a photo and a note"}, {"p": 2, "q": "Why did Grandpa's family carry the clock across the ocean?", "opts": ["They planned to sell it for food.", "Someone paid them to deliver it."], "right": "To his mother, it meant home."}, {"p": 2, "q": "Why had the clock stopped at 3:17?", "opts": ["The war had broken the brass wheels.", "A storm on the ship had damaged it."], "right": "Grandpa stopped fixing it when his wife died at that time."}, {"p": 3, "q": "What does it show when Grandpa calls Noor by her right name?", "opts": ["His eyes have gotten better.", "He had been joking with her all along."], "right": "The two of them have become truly close."}], "moral": "Respect older people and listen to their stories. There is often more to someone than you can see."}, {"id": "kite", "title": "The Kite That Went to Court", "topic": "Funny", "teaser": "Who owns a kite that lands in a neighbor's tree? The whole street takes sides, and then a judge in pigtails arrives.", "pages": [{"scene": "town", "art": ["🪁", "🌳", "⚖️"], "paras": ["On the first windy Saturday in April, Felix Grant's red dragon kite broke its string, sailed across Plum Street, and tangled itself in the apple tree in Mrs. Pell's front yard. Felix ran over to get it, but Oscar Pell, who was ten and enjoyed rules, had already climbed the tree and pulled it down.", "\"Thanks,\" said Felix, holding out his hand.", "Oscar held the kite behind his back. \"It landed on our property,\" he said. \"So it belongs to us now. That's the law.\"", "\"That is not the law!\"", "\"It might be the law.\"", "The argument got louder, and it attracted witnesses. Felix's sister said that a kite always belonged to the person who flew it. Oscar's cousin said that the apple tree had been damaged, and that somebody ought to pay for that. Mr. Bloom from number twelve pointed out that the string had probably come from his hedge. Within an hour, half of Plum Street's children had picked a side. They glared at each other across the road, and nobody was flying anything."]}, {"scene": "school", "art": ["👧", "⚖️", "📜"], "paras": ["It was Tess Lindqvist who suggested a trial. Tess was eleven, she wore her hair in two tight pigtails, and she'd once read a whole book about the Supreme Court because it was raining. \"We'll do it properly,\" she announced. \"I'll be the judge. Each side gets a lawyer, and each side can call witnesses. Then a jury of six kids will decide. Everyone has to agree to accept the verdict.\"", "It sounded so official that everyone agreed at once. By Sunday afternoon, the Grants' garage had been transformed into a courtroom. Tess sat behind a card table, wearing her mother's black bathrobe, and she held a wooden spoon for a gavel.", "\"Order in the court,\" she said, rapping the spoon on the table. Everyone fell silent, which surprised them all, including Tess.", "Oscar's lawyer was his cousin Beth, who spoke first. \"My client found the kite on his own land,\" she said. \"If a ball rolls into your yard and the owner doesn't come, you keep it. Finders keepers is one of the oldest rules there is.\"", "There was a murmur of agreement from the Pell side. Felix slumped in his chair. It sounded convincing, and that was the worst part."]}, {"scene": "home", "art": ["🧒", "🗣️", "🪁"], "paras": ["Felix's lawyer was his best friend, Ama, who had taken very careful notes. She stood up and called her first witness, who was Felix's grandmother.", "\"Who made that kite?\" Ama asked.", "\"Felix did,\" said his grandmother. \"It took him three weeks. He cut the paper dragon himself, and he painted every single scale.\"", "Then Ama turned to the jury. \"A ball that rolls into your yard and stays there for a year is one thing,\" she said. \"But Felix came to get his kite within two minutes. He didn't abandon it, and he didn't lose it on purpose. It's like if your hat blew off and I grabbed it. Could I say that it was mine? I don't think so.\"", "The jurors nodded thoughtfully. Beth jumped up. \"Objection!\" she cried. \"He still broke a branch of our apple tree!\"", "Tess pointed the spoon at her. \"That's a separate issue, though it's a fair point,\" she said. \"Did the tree get damaged?\"", "Everyone looked at Felix, and Felix looked at his shoes. He had to tell the truth, and it was not going to help him. \"A little,\" he said. \"One small branch broke when the kite hit. I saw it.\""]}, {"scene": "town", "art": ["🍎", "🤝", "🪁"], "paras": ["The jury went behind the lawn mower to talk it over, and it took them eleven minutes. Their foreman, a very serious seven-year-old named Pearl, returned with a piece of paper, and she read it in a loud voice.", "\"The kite belongs to Felix, because he made it and he came right back for it. But the branch belongs to Mrs. Pell, and Felix's kite broke it. So Felix has to make it up to her.\"", "Tess banged her spoon. \"It's a fair verdict,\" she said. \"Does each side accept it?\"", "Oscar was quiet for a moment. He looked at the red dragon, with all of its tiny painted scales, and for the first time he noticed how much work had gone into it. \"Okay,\" he said, and he handed it over. \"It really is a good kite.\"", "\"And I'll fix up your tree,\" said Felix. \"I'm sorry about the branch.\"", "So the following Saturday, Felix helped Mrs. Pell to trim the broken branch, and he raked her whole yard as well. She paid him in apple pie. Then she asked him a question that nobody had thought of asking in the whole week of arguing. \"Do you think that you could teach Oscar how to make one of those?\"", "By May, there were nine kites flying over Plum Street, and all of them had very strong string."]}], "words": [{"w": "property", "syl": "prop·er·ty", "say": "PROP-er-tee", "part": "naming word", "mean": "land or things that belong to someone", "ex": "The sign said to stay off of the farmer's property."}, {"w": "witnesses", "syl": "wit·ness·es", "say": "WIT-ness-iz", "part": "naming word", "mean": "people who saw something happen", "ex": "Two witnesses saw the bike roll down the hill."}, {"w": "verdict", "syl": "ver·dict", "say": "VUR-dikt", "part": "naming word", "mean": "the decision made at the end of a trial", "ex": "The jury gave its verdict after one hour."}, {"w": "convincing", "syl": "con·vinc·ing", "say": "kun-VIN-sing", "part": "describing word", "mean": "making people believe that something is true", "ex": "She gave a convincing reason for being late."}, {"w": "abandon", "syl": "a·ban·don", "say": "uh-BAN-dun", "part": "action word", "mean": "leave something behind and not come back", "ex": "Do not abandon your puppy at the park."}, {"w": "separate", "syl": "sep·a·rate", "say": "SEP-er-it", "part": "describing word", "mean": "apart from something else; not the same", "ex": "Please keep the wet towels in a separate bag."}], "qs": [{"p": 0, "q": "What started the argument?", "opts": ["Felix climbed Mrs. Pell's tree and took her apples.", "Tess had taken the kite and refused to return it."], "right": "Oscar claimed the kite was his because it landed on his property."}, {"p": 1, "q": "Why did the children hold a trial?", "opts": ["A police officer told them that they had to.", "Their teacher assigned it as homework."], "right": "They wanted a fair way to settle the argument."}, {"p": 2, "q": "What was Ama's main argument?", "opts": ["All kites should belong to the neighborhood.", "Oscar was a mean person and should lose."], "right": "Felix had made the kite and came back for it right away."}, {"p": 2, "q": "Why was it hard for Felix to answer about the branch?", "opts": ["He had not seen what happened at all.", "He did not know what a branch was."], "right": "The truth would not help his side."}, {"p": 3, "q": "How did both sides end up getting something fair?", "opts": ["Oscar got the kite, and Felix got a pie.", "Nobody got anything, and the kite was thrown away."], "right": "Felix got the kite, and he also fixed the harm to the tree."}], "moral": "Settle arguments fairly by listening to both sides, and take responsibility for what you did."}, {"id": "tern", "title": "Stranded on Tern Island", "topic": "Adventure", "teaser": "The sandbar they crossed an hour ago has vanished under the tide. Their phone has no signal. The rule is to stay calm.", "pages": [{"scene": "ocean", "art": ["🏝️", "🐦", "🌊"], "paras": ["The Reyes family spent every August at Cape Harlow, where a low, sandy island called Tern Island lay about half a mile from the beach. At low tide, a strip of wet sand rose from the sea and connected the island to the shore. You could stroll across it in fifteen minutes. The sign at the start of the path gave a clear warning in big red letters: \"CHECK THE TIDE TABLE. THE SANDBAR FLOODS QUICKLY.\"", "On the last morning of vacation, Gabi Reyes, who was ten, and her brother Mateo, who was eight, got permission to walk over and look for shells. \"You have until noon,\" said their dad. \"Set an alarm, and turn around when it rings.\"", "Gabi set the alarm. They reached the island in no time at all, and they soon discovered that it was covered with treasures. There were spiral shells, sand dollars, and a seabird nesting ground that was noisy with terns. Then Mateo found a tide pool with a tiny orange crab in it, and they got down on their stomachs to watch it. Gabi's phone was in her backpack, and she didn't hear it ring."]}, {"scene": "ocean", "art": ["⏰", "🌊", "😨"], "paras": ["When Gabi finally looked up, she noticed that the light had changed. She checked her phone. It was 12:48. Her stomach turned over. She grabbed Mateo's hand, and they ran across the dunes to the far side, where the sandbar had been.", "There was no sandbar. There was only moving gray water, with small waves hurrying across the place where they had walked. The beach looked very far away.", "\"We could swim,\" Mateo said in a small voice. \"We could run really fast.\"", "Gabi looked at the water. She could see it pulling sideways, carrying a piece of driftwood along at the speed of a person jogging. That was a strong current. She remembered a lifeguard at her swim class saying something important: \"Most people get in trouble because they panic and make a bad choice in a hurry.\" Her heart was hammering, and everything in her body wanted to run. She made herself stand still and count to ten.", "\"No,\" she said at the end of the count. \"We're not swimming. We're on land, and land is safe. So first, let's figure out what we know.\""]}, {"scene": "forest", "art": ["📱", "🚩", "🏝️"], "paras": ["She tried calling her dad, but the phone showed no signal, and the battery was at nineteen percent. She turned it off to save power. Then she opened the backpack and carefully laid everything on the sand: two water bottles, half of a sandwich, a hat, and the bright yellow towel that Mom had made her bring.", "\"Okay,\" said Gabi. \"The tide comes up, but the middle of the island stays dry. That's why the birds nest here. So we go to the highest place, we stay there, and we make ourselves easy to see.\"", "Mateo wiped his nose. He was trying very hard not to cry. \"What should I do?\"", "It occurred to Gabi that he needed a job, and that it would help her as well. \"You're in charge of the signal,\" she said. \"Find the longest stick you can.\"", "They climbed the tallest dune, keeping well away from the nesting birds so as not to disturb them. They tied the yellow towel to a long piece of driftwood and pushed it deep into the sand, where it snapped in the wind like a flag. Gabi divided the sandwich equally, and they took small sips of water. Then they sat down to wait, which turned out to be the hardest part of all."]}, {"scene": "ocean", "art": ["🚤", "🦺", "🌅"], "paras": ["An hour went by. Mateo counted terns, and Gabi taught him a card game with shells. Every so often, she climbed up and turned on the phone for one minute, then turned it off again, without any luck. Fear kept creeping back in, and each time she pushed it away by doing some small, sensible thing.", "At twenty minutes to three, Mateo jumped up. \"Gabi! Look!\"", "A small orange boat was bouncing across the channel, and it was heading straight toward them. In the front stood a woman in a red jacket, waving both of her arms. Gabi and Mateo waved the towel and shouted until they were hoarse.", "\"You two did everything right,\" said the rescue officer, as she helped them into life jackets. \"We see that yellow flag from a mile away. Do you know how many people try to swim that channel? That's when we really get scared.\"", "Their parents were waiting on the beach. There was a great deal of hugging, and then a long, serious talk about alarms and about checking on them. Gabi knew that she deserved it. She had made one big mistake by forgetting the time. But as she sat wrapped in a blanket, she also knew that she hadn't made a second one, and that had made all the difference."]}], "words": [{"w": "strip", "syl": "strip", "say": "STRIP", "part": "naming word", "mean": "a long, narrow piece of something", "ex": "A strip of grass ran along the side of the road."}, {"w": "current", "syl": "cur·rent", "say": "KUR-unt", "part": "naming word", "mean": "water or air moving in one direction", "ex": "The strong current pulled the raft down the river."}, {"w": "panic", "syl": "pan·ic", "say": "PAN-ik", "part": "action word", "mean": "feel so afraid that you cannot think clearly", "ex": "Try not to panic if you miss the bus."}, {"w": "disturb", "syl": "dis·turb", "say": "dis-TURB", "part": "action word", "mean": "bother someone or interrupt something", "ex": "Do not disturb the baby when she is asleep."}, {"w": "sensible", "syl": "sen·si·ble", "say": "SEN-suh-bul", "part": "describing word", "mean": "showing good thinking", "ex": "Wearing a coat in the snow is a sensible idea."}, {"w": "hoarse", "syl": "hoarse", "say": "HORSS", "part": "describing word", "mean": "having a rough, weak voice", "ex": "She was hoarse after cheering all night at the game."}], "qs": [{"p": 0, "q": "Why did Gabi and Mateo miss the time to turn around?", "opts": ["Their father told them to stay longer.", "The alarm on the phone was broken."], "right": "They were busy with a tide pool, and the alarm was in the backpack."}, {"p": 1, "q": "Why did Gabi decide not to swim?", "opts": ["She had forgotten how to swim that summer.", "Mateo told her that sharks live there."], "right": "She saw how strong the current was and knew panic causes bad choices."}, {"p": 2, "q": "Why did Gabi give Mateo a job?", "opts": ["She wanted to rest while he worked.", "He was the only one who could reach the stick."], "right": "Having something to do would help them both stay calm."}, {"p": 2, "q": "Why did she turn the phone off?", "opts": ["To stop it from getting wet", "Because her parents told her to"], "right": "To save the battery"}, {"p": 3, "q": "What was Gabi's \"second\" mistake that she did not make?", "opts": ["Eating all of the sandwich at once", "Leaving the yellow towel at the beach"], "right": "Making a dangerous choice after the first mistake"}], "moral": "When something goes wrong, stay calm and think before you act. One mistake does not have to become two."}, {"id": "newbike", "title": "The New Girl and the Old Bike", "topic": "Friends", "teaser": "Yusra doesn't speak much English yet. Everyone thinks she's stuck up, until Cal's bike chain breaks on the worst possible hill.", "pages": [{"scene": "school", "art": ["👧", "🚲", "🏫"], "paras": ["A new student joined Ms. Kaplan's third-grade class in October. Her name was Yusra, and she'd arrived from Syria only two months before. She wore a blue headscarf and carried a very neat pencil case, and she didn't say anything at all.", "\"Yusra is still learning English,\" Ms. Kaplan told the class, \"so please be patient and friendly. I know that all of you can be very welcoming.\"", "At first, the kids tried. They said hello, and Yusra nodded politely. They asked if she wanted to play kickball, and she looked at them with a slightly worried expression and shook her head. After a week, most of them stopped asking.", "\"She thinks that she's too good for us,\" said Cal Foster at lunch. \"She never talks to anyone.\"", "Cal was the best bike rider at Hollis Street School, and he knew it. He had a shiny new bike with twenty-one gears, and he rode it to school every day. Yusra came to school on a battered old bicycle, with a rusty frame and a basket held on with wire. Some of the kids thought that it was hilarious. Cal called it \"the Antique,\" and it always got a laugh."]}, {"scene": "mountain", "art": ["🚲", "⛰️", "🌧️"], "paras": ["One gray Friday, Cal stayed after school for soccer practice, so he was riding home alone. To reach his house, he had to go over Dunmore Hill, a long and steep road with no houses on it. Halfway up the hill, there was a horrible crunch. His pedals spun loose under his feet. He looked down and saw that the chain had snapped and was dragging on the road.", "It started to rain. Cal got off and stared at the chain. He had no idea what to do with it. His phone was at home, because he'd been told not to bring it to school. It was at least two miles to his house, and the rain was getting heavier by the minute.", "He had started to push the bike up the hill, feeling sorry for himself, when he heard a squeaking sound. An old bicycle was coming slowly up the road behind him, and its rider had a blue scarf and a very determined face.", "Yusra stopped next to him. She looked at the chain, and she looked at him. Cal felt his face grow hot. He remembered every single time that he had said \"the Antique.\""]}, {"scene": "river", "art": ["🔧", "🚲", "🤝"], "paras": ["Yusra climbed off her bike and opened a dented metal tin that was tied beneath the seat. Inside were a small tool, some wire, and a greasy rag. She crouched next to his bike in the pouring rain and studied the chain.", "\"Broken,\" she said, and she pointed to a bent link. It was the first word that Cal had ever heard her say. She held up the tool and looked at him. \"I fix?\"", "\"You know how?\" he asked, astonished.", "She nodded. Working with quick, sure fingers, she pushed out a tiny metal pin, removed the bent link, and joined the chain back together, while Cal held the bike steady. Grease covered her hands. As she worked, she spoke slowly, searching for each word.", "\"My father, in Aleppo,\" she said. \"He has shop. Bicycle shop. I help him, from small.\" She held her hand down ne
