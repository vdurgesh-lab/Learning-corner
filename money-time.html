<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Time</title>
<style>
:root{
  --bg:#E8F2EF; --panel:#FFFFFF; --ink:#1B2B4B; --soft:#55637F; --line:#C5D5D2;
  --go:#2150B8; --go-dark:#183C8C; --yes:#1E7F56; --yes-bg:#DFF4E9;
  --try:#8F4E00; --try-bg:#FFF1D6; --focus:#E0A100;
  --penny:#A65A28; --nickel:#4F6D8F; --dime:#0F8B8D; --quarter:#7A4FB5; --dollar:#2E7D4F;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",Verdana,Tahoma,sans-serif;
  font-size:20px;line-height:1.4;display:flex;flex-direction:column;min-height:100dvh}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--focus);outline-offset:3px}

/* top bar */
#top{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:2px solid var(--line);z-index:30}
.tool{min-height:44px;padding:6px 12px;border-radius:12px;background:#F2F6F5;border:2px solid var(--line);font-size:16px}
.tool[aria-pressed="true"],.tool[aria-expanded="true"]{background:#DCE7FB;border-color:var(--go);font-weight:700}
#muteBtn.off{background:#FBE3DF;border-color:#C0392B;font-weight:700}
#tools{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
#dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--soft)}
.dot.past{background:var(--yes);border-color:var(--yes)}
.dot.now{background:var(--go);border-color:var(--go);box-shadow:0 0 0 3px #BFD0F5}
#steptext{font-size:16px;color:var(--soft);margin-left:6px}

/* audio panel */
#audio{position:absolute;right:12px;top:calc(100% + 6px);width:min(340px,calc(100vw - 24px));background:#fff;border:2px solid var(--go);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 24px rgba(27,43,75,.22);font-size:18px}
#audio[hidden]{display:none}
.arow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sw{min-width:82px;min-height:44px;border-radius:999px;border:2px solid var(--line);background:#F2F6F5;font-weight:700;font-size:16px}
.sw[aria-pressed="true"]{background:var(--yes);border-color:var(--yes);color:#fff}
#vol{width:100%;height:34px;accent-color:var(--go)}
.seg2{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg2 button{border:0;background:#F2F6F5;padding:8px 14px;min-height:44px;font-size:16px}
.seg2 button[aria-pressed="true"]{background:var(--go);color:#fff;font-weight:700}
#voicePick{width:100%;min-height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:16px;padding:4px}

/* page */
#stage{flex:1;display:flex;flex-direction:column;width:100%;max-width:960px;margin:0 auto;padding:16px}
.head{display:flex;gap:12px;align-items:flex-start;margin:6px 0 12px}
h1{font-size:clamp(26px,4.5vw,36px);line-height:1.2;margin:0;flex:1}
.vis h1{flex:none}
.speak{flex:none;width:56px;height:56px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font-size:24px}
.vis{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:300px;text-align:center;overflow:hidden}
#nav{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;padding:12px 0;background:var(--bg)}
.btn{min-height:60px;padding:10px 26px;border-radius:16px;border:2px solid var(--go);background:#fff;color:var(--go);font-weight:700}
.btn.main{background:var(--go);color:#fff;margin-left:auto;min-width:150px}
.btn.main:hover{background:var(--go-dark)}
.btn.main:disabled{background:#D5DCE6;border-color:#D5DCE6;color:#5E6B80;cursor:default}
.btn.ready{box-shadow:0 0 0 5px #BFD0F5}
.fb{scroll-margin-bottom:100px;min-height:62px;margin-top:12px;padding:12px 18px;border-radius:16px;font-size:21px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center}
.fb.yes{background:var(--yes-bg);color:#125C3D}
.fb.try{background:var(--try-bg);color:var(--try)}
.fb.info{background:#E3EBFB;color:#1B2B4B}

/* money */
.coin{position:relative;display:inline-block;line-height:0;flex:none;filter:drop-shadow(0 2px 2px rgba(27,43,75,.35))}
.coin img{display:block;width:100%;height:100%;-webkit-user-drag:none;user-select:none}
.vp{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:2px 8px;font-weight:800;line-height:1.1;white-space:nowrap}
.flip{perspective:800px;position:relative;display:inline-block}
.flip-in{position:relative;transform-style:preserve-3d;transition:transform .9s ease;width:100%;height:100%}
.flip-in.turned{transform:rotateY(180deg)}
.flip .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .side.b{transform:rotateY(180deg)}
.flip img{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 3px rgba(27,43,75,.35))}
.calm .flip-in{transition:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;min-height:50px}
.stack{display:flex;flex-direction:column;align-items:center;gap:8px}
.tag{padding:4px 14px;border-radius:999px;color:#fff;font-weight:700;font-size:20px}
.big-value{font-size:clamp(36px,8vw,56px);font-weight:800;line-height:1.1;min-height:1.1em}
.sum{font-size:clamp(28px,6vw,44px);font-weight:800;min-height:1.2em}
.chain{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:6px 8px;max-width:100%}
.cc{display:flex;flex-direction:column;align-items:center;gap:4px}
.cl,.cs{height:34px;line-height:34px;font-size:26px;font-weight:800;white-space:nowrap}
.chain .cs{font-size:36px}
.chain.sm .cl,.chain.sm .cs{height:28px;line-height:28px;font-size:18px}
.chain.sm .cs{font-size:28px}
.hid{visibility:hidden}
.op-plus{color:#1E7F56}.op-minus{color:#C0392B}.op-times{color:#7A4FB5}.op-div{color:#B35A00}.op-eq{color:var(--ink)}
.sum .op{font-size:1.15em}
.sum.small{font-size:clamp(20px,4vw,28px);min-height:36px}
.signrow{display:flex;flex-direction:column;align-items:center;gap:4px}
.signrow small{font-size:19px;font-weight:700}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.5,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.calm .pop{animation:none}
.dots{display:grid;gap:4px;justify-content:center}
.cent{width:18px;height:18px;border-radius:50%;background:#E2E8E7}
.cent.on{background:var(--c)}
.glow{outline:5px solid var(--focus);outline-offset:4px;border-radius:50%}
.gone{opacity:.15}
.moneynode{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;align-items:center}

/* ruler */
.bar{width:100%;max-width:720px}
.track{position:relative;height:42px;background:#EEF3F2;border:3px solid var(--ink);border-radius:10px;overflow:hidden;display:flex}
.seg{height:100%;width:0;transition:width .5s ease;background:var(--go);border-right:2px solid #fff}
.seg.leaving{background:repeating-linear-gradient(45deg,#F2B9A0 0 8px,#fff 8px 16px)}
.calm .seg{transition:none}
.ticks{position:absolute;inset:0;pointer-events:none;background-repeat:repeat-x;background-image:linear-gradient(to right,rgba(27,43,75,.35) 2px,transparent 2px)}
.mark{position:absolute;top:0;bottom:0;width:4px;background:var(--ink)}
.scale{position:relative;height:24px;font-size:16px;color:var(--soft);margin-top:2px}
.scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.marktag{position:relative;height:28px;font-size:16px;font-weight:700}
.marktag span{position:absolute;transform:translateX(-50%);white-space:nowrap;bottom:0}

/* answers */
.options{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}
.opt{min-width:120px;min-height:76px;padding:10px 18px;border-radius:18px;border:3px solid var(--go);background:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.opt:hover:not(:disabled){background:#EAF0FD}
.opt.ok{background:var(--yes-bg);border-color:var(--yes);color:#125C3D}
.opt.no{border-style:dashed;border-color:#A7B2C2;color:#7B8799;background:#F6F8F8;cursor:default}
.opt.no .coin{opacity:.4}
.opt.show{outline:5px solid var(--focus);outline-offset:3px}
.opt:disabled{cursor:default}
.help{min-height:48px;padding:6px 18px;border-radius:12px;border:2px solid var(--line);background:#F2F6F5;font-size:18px}
.coinbtn{background:none;border:0;padding:8px;border-radius:50%;display:flex;flex-direction:column;align-items:center;gap:4px}
.coinbtn:disabled{cursor:default}
.coinbtn.next{outline:5px solid var(--focus);outline-offset:1px}
.coinbtn.billbtn{border-radius:12px}
.coinbtn.tapped{opacity:.8}
.item{display:flex;flex-direction:column;align-items:center;padding:10px 18px;border:3px solid var(--line);border-radius:18px;background:#FBFDFC;min-width:120px}
.item .pic{font-size:52px;line-height:1.15}
.item .nm{font-size:18px}
.item .pr{font-size:26px;font-weight:800}
.pickcard{cursor:pointer}
.pickcard.on{border-color:var(--yes);background:var(--yes-bg);outline:4px solid var(--yes);outline-offset:2px}
.tray{width:100%;min-height:104px;border:3px dashed var(--line);border-radius:18px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px;color:var(--soft)}
.status{font-size:24px;font-weight:700}
.opsign{font-size:42px;font-weight:800}
.options[hidden]{display:none}
.bankc{position:relative}
.stockb{font-size:17px;font-weight:800;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:0 9px;margin-top:6px}
.coinbtn.out .coin{opacity:.25}
.coinbtn.out .stockb{color:#9AA5B5}
.stepbar{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 10px}
.thinkbox,.options{scroll-margin-bottom:100px}
.thinkbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;background:#E3EBFB;width:100%}
.thinkbox b{font-size:21px}
.savedrow{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);margin-bottom:8px;flex-wrap:wrap}
.savedrow .t{flex:1 1 200px;min-width:0}
.savedrow small{display:block;color:var(--soft);font-size:16px}
.weekbtn.on{background:#DCE7FB;border-color:var(--go)}
.flyer{position:fixed;z-index:50;pointer-events:none;margin:0}

/* story pieces */
.scene{width:100%;border-radius:18px;padding:14px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;gap:14px;min-height:150px;font-size:64px;line-height:1.1}
.scene.sky{background:linear-gradient(#CFE8FA 0 72%,#BFE3B4 72%)}
.scene.shop{background:linear-gradient(#FBE5EE 0 76%,#E6C9A8 76%)}
.scene.home{background:linear-gradient(#FFF3D9 0 76%,#D8C4A5 76%)}
.scene.play{background:linear-gradient(#E1DDF7 0 76%,#BFE3B4 76%)}
.drive{animation:drive 2.2s ease-out both}
@keyframes drive{from{transform:translateX(-70vw)}to{transform:none}}
.bob{animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
.calm .drive,.calm .bob{animation:none}
.people{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.person{flex:1 1 120px;max-width:230px;min-height:128px;border:3px solid var(--line);border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#FBFDFC}
.person.turn{border-color:var(--focus);box-shadow:0 0 0 3px #F6DFA4}
.person .face{font-size:40px;line-height:1.1}
.person .who{font-size:17px;font-weight:700}
.person .amt{font-size:22px;font-weight:800;min-height:30px}
.pocket{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:36px;align-items:center}
.bag{font-size:56px;line-height:1}
.pile{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}

/* home */
.hero{display:flex;align-items:center;gap:18px;margin:6px 0 12px;flex-wrap:wrap}
.hero h1{flex:1 1 300px;font-size:clamp(34px,7vw,52px)}
.hero p{margin:6px 0 0;font-size:20px;color:var(--soft)}
.levelbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.levelbox .seg2 button{font-size:18px;min-height:54px;padding:8px 18px}
h2{font-size:24px;margin:16px 0 8px}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.stop{display:flex;gap:14px;align-items:center;text-align:left;padding:14px;border-radius:18px;background:#fff;border:3px solid var(--line);min-height:96px}
.stop:hover{border-color:var(--go)}
.stop.up{border-color:var(--go);box-shadow:0 0 0 4px #BFD0F5}
.num{flex:none;width:58px;height:58px;border-radius:50%;background:#EEF3F2;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
.stop.fin .num{background:var(--yes-bg)}
.stop b{display:block;font-size:22px}
.stop small{font-size:17px;color:var(--soft)}
details{margin-top:16px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-size:18px}
summary{cursor:pointer;font-weight:700}
details li{margin:6px 0}

/* end + break */
.sticker{font-size:110px;line-height:1.1}
.star{position:fixed;top:-40px;font-size:30px;pointer-events:none;animation:fall 3.6s linear forwards;z-index:40}
@keyframes fall{to{transform:translateY(110vh) rotate(160deg)}}
#breakbox{position:fixed;inset:0;background:#DCEBE6;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px;text-align:center}
#breakbox.open{display:flex}
#breath{width:170px;height:170px;border-radius:50%;background:#A9CEC3;animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.65)}50%{transform:scale(1.25)}}
.calm #breath{animation:none}
#breathword{font-size:32px;font-weight:700}
@media (max-width:560px){
  body{font-size:18px}
  #stage{padding:10px}
  .vis{padding:12px;border-radius:18px;gap:10px;min-height:0}
  .tool{padding:4px 10px;font-size:20px;min-width:46px}
  .tool .w{display:none}
  #top{padding:6px 10px}
  #tools{margin-left:0}
  #dots{order:5;width:100%}
  .dot{width:12px;height:12px}
  #steptext{display:none}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opt{min-height:60px;min-width:0;font-size:22px;padding:8px 12px}
  .btn{padding:8px 16px}
  .btn.main{min-width:110px}
  .opsign{font-size:30px}
  .item{min-width:92px;padding:6px 10px}
  .item .pic{font-size:40px}
  .scene{font-size:48px;min-height:110px}
  .person{flex:1 1 44%;min-height:110px}
}
</style>
</head>
<body>
<header id="top">
  <button class="tool" id="homeBtn" aria-label="Home">🏠<span class="w"> Home</span></button>
  <div id="dots" aria-hidden="true"></div>
  <span id="steptext"></span>
  <div id="tools">
    <button class="tool" id="muteBtn" aria-pressed="false"><span id="muteIcon">🔊</span><span class="w" id="muteWord"> Sound on</span></button>
    <button class="tool" id="audioBtn" aria-expanded="false" aria-controls="audio" aria-label="Sound settings">🎚<span class="w"> Sound settings</span></button>
    <button class="tool" id="calmBtn" aria-pressed="false" aria-label="Calm motion">🌿<span class="w"> Calm motion</span></button>
    <button class="tool" id="breakBtn" aria-label="Take a break">🫧<span class="w"> Take a break</span></button>
  </div>
  <div id="audio" hidden>
    <div class="arow" id="voiceRow"><span>Talking voice</span><button class="sw" id="voiceSw"></button></div>
    <div class="arow"><span>Coin sounds</span><button class="sw" id="soundSw"></button></div>
    <label for="vol">Volume</label>
    <input id="vol" type="range" min="0" max="100" step="5">
    <div class="arow" id="speedRow"><span>Voice speed</span><div class="seg2"><button id="spSlow">Calm</button><button id="spNorm">A bit faster</button></div></div>
    <div id="voicePickRow"><label for="voicePick">Which voice</label><select id="voicePick"></select></div>
    <button class="help" id="testBtn">Hear a test</button>
    <div style="font-size:15px;color:var(--soft)">Voices come from this device. If it sounds robotic, try another one in the list.</div>
    <div id="noVoice" hidden style="font-size:16px;color:var(--soft)">This browser has no talking voice. Coin sounds still work.</div>
  </div>
</header>
<main id="stage"></main>
<div id="breakbox" role="dialog" aria-label="Break">
  <div id="breath"></div>
  <div id="breathword" aria-live="polite">Breathe in</div>
  <button class="btn main" style="margin:0" id="readyBtn">I'm ready</button>
</div>

function numChoices(ans){
  const dist=easy()?[1,2,5,-1,-2,-5]:[10,-10,5,-5,1,-1];
  const pool=[...new Set(dist.map(d=>ans+d))].filter(x=>x>0&&x!==ans);
  return shuffle([ans,...sample(pool,easy()?1:2)]);
}

async function playSub(api,p,sc){
  const{it,start,card,bar,eq,left,leave}=sc;

/* limited coins: enough to solve it, never enough to just pile up pennies */
const ORDER=['D','q','d','n','p'];
function stockFor(target,dollars){
  const s={},g=toCoins(target,dollars);g.forEach(k=>s[k]=(s[k]||0)+1);
  const topI=ORDER.indexOf(g[0]);
  const lower=easy()?ORDER.slice(topI+1,topI+2):ORDER.slice(topI+1);
  lower.forEach(k=>{if(k!=='p')s[k]=(s[k]||0)+1});
  if(target>=5){const greedyP=g.filter(k=>k==='p').length;s.p=Math.min(greedyP+(easy()?1:2),target-1,4)}
  if(!easy()&&topI>1)s[ORDER[topI-1]]=1;
  return s;
}
function solveCoins(rem,stock){let best=null;const ids=ORDER.filter(k=>stock[k]);
  const go=(i,left,used)=>{if(left===0){if(!best||used.length<best.length)best=[...used];return}if(i>=ids.length||(best&&used.length>=best.length))return;
    const k=ids[i],v=COIN[k].v,max=Math.min(stock[k],Math.floor(left/v));
    for(let n=max;n>=0;n--)go(i+1,left-n*v,[...used,...Array(n).fill(k)])};
  go(0,rem,[]);return best}
function payGame(api,{target,base=0,max,targetLabel,win}){
  const need=base+target;
  max=max||maxFor(need);
  const dollars=need>=100&&target>=100;
  const full=stockFor(target,dollars),left={...full};
  const bestN=solveCoins(target,full).length;
  const bar=ruler(max,{target:need,targetLabel:targetLabel||fmt(need)});
  if(base)bar.add(base,'#8A97AD');
  const tray=h('div',{class:'tray'},'Your money goes here');
  const status=h('div',{class:'status'}),line=eqLine('','small');
  const items=[];let finished=false,demo=false,hints=0;
  const total=()=>items.reduce((s,x)=>s+COIN[x.id].v,0);
  const badges={},btns={};
  const refresh=()=>{for(const id in btns){const n=left[id];badges[id].textContent='× '+n;btns[id].classList.toggle('out',n===0);btns[id].disabled=finished||demo||n===0;btns[id].setAttribute('aria-label',`Add ${COIN[id].name}, ${COIN[id].v} cents. ${n} left`)}};
  const update=(say_=true)=>{const t=total();
    const parts=[...(base?[fmt(base)]:[]),...items.map(x=>fmt(COIN[x.id].v))];
    setEq(line,parts.length>1?`${parts.join(' + ')} = ${fmt(base+t)}`:parts.join(''));
    status.textContent=`You have ${fmt(t)}. You need ${fmt(target)}.`;
    if(!items.length&&!tray.querySelector('.coinbtn'))tray.textContent='Your money goes here';
    Object.values(btns).forEach(b=>b.classList.remove('next'));
    if(!cur.single){cur.partial=t===target?null:items.map(x=>x.id);autoSave()}
    if(t===target){finished=true;refresh();chime();
      const extra=items.length>bestN&&!demo?` You used ${items.length} coins. It can be done with ${bestN}. Can you see how?`:'';
      api.fb('✓ '+win+extra,'yes');tray.querySelectorAll('button').forEach(b=>b.disabled=true);hintBtn.remove();help.remove();api.done();return}
    refresh();
    if(!say_)return;
    if(t>target){api.fb(`That is ${fmt(t-target)} too much. Tap money in the tray to take it out.`,'try');return}
    if(t&&!solveCoins(target-t,left)){api.fb(`These coins can't make ${fmt(target-t)}. Take one out and try a bigger coin.`,'try');return}
    if(t)api.fb(`${fmt(target-t)} more to go. What fits?`);else api.fb('You have only these coins. Choose carefully.');
  };
  const put=id=>{
    if(left[id]<=0)return;left[id]--;
    if(!items.length)tray.textContent='';
    const seg=bar.add(COIN[id].v,COIN[id].col);
    const b=h('button',{class:'coinbtn'+(id==='D'?' billbtn':''),'aria-label':`Take out ${COIN[id].name}`,on:{click(){if(finished)return;const i=items.findIndex(x=>x.b===b);items.splice(i,1);left[id]++;bar.drop(seg);b.remove();update()}}},coin(id,{scale:.7}));
    b.classList.add('pop');tray.append(b);items.push({id,b,seg});clink();update();
  };
  const bank=h('div',{class:'row'},ORDER.filter(id=>full[id]).map(id=>{badges[id]=h('span',{class:'stockb'});
    btns[id]=h('button',{class:'coinbtn bankc'+(id==='D'?' billbtn':''),'data-coin':id,on:{click(){if(!finished&&!demo)put(id)}}},coin(id,{scale:id==='D'?.8:.9}),badges[id]);return btns[id]}));
  const help=h('button',{class:'help showbtn',hidden:true,on:{click(){
    demo=true;help.disabled=true;hintBtn.disabled=true;
    items.splice(0).forEach(x=>{left[x.id]++;bar.drop(x.seg);x.b.remove()});update(false);
    guard((async()=>{for(const id of solveCoins(target,full)){await api.ctx.wait(600);put(id)}})());
  }}},'Show me how');
  const hintBtn=h('button',{class:'help hintbtn',on:{click(){
    const t=total();if(t>target){api.fb(`You are ${fmt(t-target)} over. Which coin could you take out?`,'try');return}
    const rem=target-t,sol=solveCoins(rem,left);
    if(!sol){api.fb(`These coins can't make ${fmt(rem)}. Take one out and try a bigger coin.`,'try');return}
    hints++;
    if(hints===1){api.fb(`You still need ${fmt(rem)}. What is the biggest coin that fits inside ${fmt(rem)}?`);return}
    Object.values(btns).forEach(b=>b.classList.remove('next'));btns[sol[0]].classList.add('next');
    api.fb(`The ${COIN[sol[0]].name} is ${fmt(COIN[sol[0]].v)}, and that fits inside ${fmt(rem)}. How much would be left?`);
    help.hidden=false;
  }}},'💡 Give me a hint');
  api.vis.append(bank,tray,line,status,bar.el,h('div',{class:'row'},hintBtn,help));
  const restore=cur.partial;
  if(restore&&restore.length){restore.forEach(id=>{if(left[id]>0)put(id)})}else update();
}

/* hand coins out one at a time, in turns, then ask how much each person got */
function dealGame(api,{people,coinId,count,trade=null,head=null,winWord='gets'}){
  const n=people.length,each=COIN[coinId].v*count/n,total=COIN[coinId].v*count;
  if(head)api.vis.append(head);
  const pockets=people.map(p=>{const pocket=h('div',{class:'pocket'}),amt=h('div',{class:'amt'},'0¢'),box=h('div',{class:'person'},h('div',{class:'face'},p.pic),h('div',{class:'who'},p.name),pocket,amt);return{box,pocket,amt,v:0}});
  const row=h('div',{class:'people'},pockets.map(p=>p.box));
  const pile=h('div',{class:'pile'});
  const eq=eqLine(`${fmt(total)} ÷ ${n} = ?`,'small');
  api.vis.append(pile,row,eq);
  let turn=0,dealt=0;
  const setTurn=()=>pockets.forEach((p,i)=>p.box.classList.toggle('turn',i===turn&&dealt<count));
  const startDeal=()=>{
    pile.innerHTML='';
    const btns=[];
    for(let i=0;i<count;i++){
      const b=h('button',{class:'coinbtn','aria-label':`Give this ${COIN[coinId].name}`,disabled:i>0,on:{click(){
        if(btns[nextI]!==b)return;
        const who=pockets[turn];turn=(turn+1)%n;nextI++;
        b.classList.remove('next');b.disabled=true;b.style.visibility='hidden';
        if(btns[nextI]){btns[nextI].disabled=false;btns[nextI].classList.add('next');btns[nextI].focus({preventScroll:true})}
        dealt++;setTurn();clink();
        guard((async()=>{
          await fly(b.querySelector('.coin'),who.pocket,api.ctx,420);
          who.pocket.append(coin(coinId,{scale:.42,label:false}));who.v+=COIN[coinId].v;who.amt.textContent=fmt(who.v);
          if(++landed===count)finishDeal();
        })());
      }}},coin(coinId,{scale:count>6?.6:.8,label:false}));
      btns.push(b);pile.append(b);
    }
    let nextI=0,landed=0;
    btns[0].classList.add('next');setTurn();
    api.fb('Tap the coin. Each person takes a turn.');
  };
  const finishDeal=()=>{
    pile.remove();
    api.fb('Everyone has the same. That is fair!');
    choice(api,{options:valOpts(each),correct:each,how:'Look at one person and count their coins.',hint:'Look at one person. Count their coins.',win:`${fmt(total)} ÷ ${n} = ${fmt(each)}. Each person ${winWord} ${fmt(each)}.`,
      after:()=>setEq(eq,`${fmt(total)} ÷ ${n} = ${fmt(each)}`)});
    say(`So, how much does each person ${winWord==='gets'?'get':'pay'}?`,{queue:true});
  };
  if(trade){
    const b=h('button',{class:'coinbtn next','aria-label':'Trade this coin',on:{click(){clink();startDeal()}}},coin(trade.from,{scale:1.1,label:false}));
    pile.append(b);
    api.fb(`One ${COIN[trade.from].name} can't be shared. Tap it to trade for ${countName(count,coinId)}.`);
  }else startDeal();
}

/* ---------- practice generators ---------- */
function genCount(n){
  if(easy())return freshSample('count',EASY_COUNT,n);
  const out=[],seen=new Set(),prev=recent('count');let tries=0;
  while(out.length<n){const l=Array.from({length:rint(2,5)},()=>pick(['q','d','d','n','n','p'])).sort((a,b)=>COIN[b].v-COIN[a].v);
    const k=l.join('');tries++;if(!seen.has(k)&&sum(l)<=100&&(tries>400||!prev.has(JSON.stringify(l)))){seen.add(k);out.push(l)}}
  remember('count',out);return out;
}
function genMake(n){
  if(easy())return freshSample('make',EASY_MAKE,n);
  const prev=recent('make'),s=new Set();while(s.size<n){const v=rint(12,90);if(!prev.has(JSON.stringify(v)))s.add(v)}const o=[...s];remember('make',o);return o;
}
function genAdd(n){
  if(easy())return freshSample('add',EASY_ADD,n);
  const out=[],seen=new Set(),prev=recent('add');
  while(out.length<n){const a=5*rint(1,15),b=5*rint(1,15);if(a+b<=125&&!seen.has(a+'+'+b)&&!prev.has(JSON.stringify([a,b]))){seen.add(a+'+'+b);out.push([a,b])}}
  remember('add',out);return out;
}
function genSub(n){
  const t=thingPicker();let raw;
  if(easy())raw=freshSample('sub',EASY_SUB,n);
  else{
    raw=[];
    const q4={from:'D',to:['q','q','q','q']},q3={from:'q',to:['d','d','n']};
    raw.push(freshPick('subtrade',[
      {have:['D'],trade:q4,rm:['q']},{have:['D'],trade:q4,rm:['q','q']},{have:['D'],trade:q4,rm:['q','q','q']},
      {have:['q'],trade:q3,rm:['d']},{have:['q'],trade:q3,rm:['n']},{have:['q'],trade:q3,rm:['d','n']},
      {have:['q','d'],trade:q3,rm:['d','d']},{have:['q','d'],trade:q3,rm:['n']}]));
    const seen=new Set(),prev=recent('sub');
    while(raw.length<n){
      const have=Array.from({length:rint(2,4)},()=>pick(['q','d','n'])).sort((a,b)=>COIN[b].v-COIN[a].v);
      const rm=have.filter(()=>Math.random()<.5);
      if(!rm.length||rm.length===have.length||sum(have)>100)continue;
      const k=have.join('')+rm.join('');if(seen.has(k)||prev.has(JSON.stringify(k)))continue;seen.add(k);raw.push({have,rm});
    }
    remember('sub',[...seen]);raw=shuffle(raw);
  }
  return raw.map(p=>({...p,item:t(sum(p.rm))}));
}

/* ---------- pause and save for later ---------- */
function snapshot(){return{seed:cur.seed,hist:cur.hist,st:cur.st,level:cur.level,i:cur.i,n:cur.steps.length,partial:cur.partial||null}}

function pauseScreen(){
  S.saved[cur.ch.id]={...snapshot(),paused:true,at:Date.now()};store.set('saved',S.saved);
  newCtx();stopTalking();document.querySelectorAll('.flyer').forEach(e=>e.remove());
  const ch=cur.ch,sv=S.saved[ch.id];stage.innerHTML='';setDots(0,0);

    h('div',{id:'nav'},h('button',{class:'btn',on:{click:home}},'Home'),h('button',{class:'btn main ready',on:{click(){start(ch,S.saved[ch.id])}}},'Keep going')));

function pinProblem(title){
  const ch=cur.ch;if(S.pins.some(p=>p.ch===ch.id&&p.seed===cur.seed&&p.i===cur.i))return;
  S.pins.unshift({key:Date.now()+'-'+cur.i,ch:ch.id,title,...snapshot(),partial:null});S.pins=S.pins.slice(0,30);store.set('pins',S.pins);

function rebuild(ch,sv){
  S.level=sv.level;store.set('level',sv.level);
  const keep=HIST;HIST=JSON.parse(JSON.stringify(sv.hist));replaying=true;
  try{return seeded(sv.seed,()=>ch.steps(sv.st))}finally{HIST=keep;replaying=false}
}
function seeded(seed,fn){const R=Math.random;let a=seed>>>0;
  Math.random=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
  try{return fn()}finally{Math.random=R}}
function askResume(c){
  newCtx();stage.innerHTML='';setDots(0,0);const sv=S.saved[c.id];
  stage.append(h('div',{class:'vis'},h('div',{class:'sticker'},c.sticker),h('h1',{},c.title),h('div',{},`You stopped at step ${sv.i+1} of ${sv.n}.`)),
    h('div',{id:'nav'},h('button',{class:'btn',on:{click(){delete S.saved[c.id];store.set('saved',S.saved);start(c)}}},'Start over'),h('button',{class:'btn main ready',on:{click(){start(c,sv)}}},'Continue')));
}
function openPin(p){const ch=CH.find(c=>c.id===p.ch);if(!ch)return;clearStars();const steps=rebuild(ch,p);
  cur={ch,seed:p.seed,hist:p.hist,st:p.st,level:p.level,i:0,steps:[steps[p.i]],single:true};renderStep()}

/* ---------- screens ---------- */
const clearStars=()=>document.querySelectorAll('.star').forEach(e=>e.remove());
function start(ch,sv){clearStars();
  if(sv){const steps=rebuild(ch,sv);cur={ch,seed:sv.seed,hist:sv.hist,st:sv.st||{},level:sv.level,i:Math.min(sv.i,steps.length-1),steps,partial:sv.partial};renderStep();return}

  newCtx();

    h('ul',{},
      h('li',{},'Numbers change every time a stop is played, so replaying is real practice, not memorizing.'),
