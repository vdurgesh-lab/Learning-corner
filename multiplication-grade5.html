<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="lc/catalog.js"></script><script src="lc/nav.js"></script>
<title>Multiplication Path Grade 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF3F6; --page:#FFFFFF; --ink:#1A2B3C; --soft:#55677A; --line:#CFDAE2;
  --go:#25558F; --go-ink:#FFFFFF; --yes:#1D7350; --yes-bg:#DDF3E8; --try:#8A4B00; --try-bg:#FFF0D4;
  --glow:#D69A00; --chip:#E3EBF1; --bubble:#E7EFFA; --hot:#D1495B; --c1:#4E9AE0; --c2:#F28E2B;
  --read:"Lexend",Verdana,Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111B24; --page:#1A2732; --ink:#E9F0F5; --soft:#A5B6C4; --line:#33444F; --go:#7FB2EA; --go-ink:#0E1B26;
  --yes:#7CDBB0; --yes-bg:#17392C; --try:#FFC67A; --try-bg:#3D2C12; --glow:#F2C14E; --chip:#24343F; --bubble:#203247; --hot:#FF7A8A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111B24; --page:#1A2732; --ink:#E9F0F5; --soft:#A5B6C4; --line:#33444F; --go:#7FB2EA; --go-ink:#0E1B26;
  --yes:#7CDBB0; --yes-bg:#17392C; --try:#FFC67A; --try-bg:#3D2C12; --glow:#F2C14E; --chip:#24343F; --bubble:#203247; --hot:#FF7A8A; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--read);font-size:18px;line-height:1.45}
#app{max-width:1180px;margin:0 auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
h1{font-size:clamp(26px,4.4vw,38px);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:21px;margin:0;line-height:1.3;text-wrap:balance}
.muted{color:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.btn{min-height:50px;padding:8px 20px;border-radius:12px;border:2px solid var(--go);background:var(--page);color:var(--go);font-weight:600}
.btn.main{background:var(--go);color:var(--go-ink)}
.btn:disabled{opacity:.45;cursor:default}
.quiet{min-height:42px;padding:5px 12px;border-radius:10px;border:1px solid var(--line);background:var(--page);font-size:16px}
.quiet[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.chip{display:inline-block;font-size:14px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--soft);white-space:nowrap}
.chip.ok{background:var(--yes-bg);color:var(--yes);font-weight:600}
.chip.due{background:var(--try-bg);color:var(--try);font-weight:600}

/* fraction text */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .1em}
.fr .nu{border-bottom:.09em solid currentColor;padding:0 .15em}
.fr .de{padding:0 .15em}
.mx{margin-right:.06em}

/* home */
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.hero p{margin:4px 0 0;color:var(--soft)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.unit{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:16px;background:var(--page);border:2px solid var(--line)}
.unit.up{border-color:var(--go);box-shadow:0 0 0 3px rgba(37,85,143,.15)}
.unit .t{display:flex;gap:10px;align-items:flex-start}
.unit .num{flex:none;width:42px;height:42px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700}
.unit.done .num{background:var(--yes-bg);color:var(--yes)}
.unit b{font-size:19px;line-height:1.25;display:block}
.unit small{font-size:15px;color:var(--soft);display:block}
.unit .chips{display:flex;gap:6px;flex-wrap:wrap}
.unit .btn{align-self:flex-start;min-height:44px}
.card{background:var(--page);border:2px solid var(--go);border-radius:16px;padding:12px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
details{margin-top:16px;background:var(--page);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:16px}
summary{cursor:pointer;font-weight:600}
details li{margin:6px 0}
.grades{display:flex;gap:6px;flex-wrap:wrap}
.grades a{color:var(--go);font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none;background:var(--page)}
.grades a[aria-current]{background:var(--go);color:var(--go-ink);border-color:var(--go)}

/* session */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.top .ttl{font-weight:600;font-size:17px;min-width:0;flex:1 1 200px}
.top .ttl small{display:block;font-weight:400;color:var(--soft);font-size:14px}
.trail{display:flex;gap:4px;flex-wrap:wrap}
.pt{font-size:14px;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--soft);white-space:nowrap}
.pt.on{background:var(--go);color:var(--go-ink);font-weight:600}
.pt.done{background:var(--yes-bg);color:var(--yes)}
.ses{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-areas:"work bubble" "work check";grid-template-rows:auto 1fr;gap:12px;align-items:start}
.work{grid-area:work;background:var(--page);border:1px solid var(--line);border-radius:18px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bubble{grid-area:bubble;display:flex;gap:10px;align-items:flex-start;background:var(--bubble);border-radius:16px;padding:12px 14px;font-size:18px;min-height:80px}
.bubble .who{font-size:30px;line-height:1;flex:none}
.bubble .txt{min-width:0}
.check{grid-area:check;background:var(--page);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.check h2{font-size:16px;color:var(--soft);font-weight:600}
.check ol{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.check li{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:10px;font-size:16px;line-height:1.35}
.check li .n{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:var(--page)}
.check li.now{background:var(--bubble);box-shadow:inset 0 0 0 2px var(--go)}
.check li.done .n{background:var(--yes);border-color:var(--yes);color:var(--page)}
.check button.n{cursor:pointer;padding:0}
.q{font-size:20px;line-height:1.5}
.eq{font-size:clamp(26px,4vw,34px);font-weight:600;text-align:center}
.ans{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;padding-top:10px;border-top:1px dashed var(--line);min-height:76px}
.ans .lead{width:100%;text-align:center;font-size:17px;color:var(--soft)}
.box{width:76px;height:56px;font-size:28px;text-align:center;border:2px solid var(--go);border-radius:10px;background:var(--page);color:var(--ink);padding:0}
.box.wide{width:110px}
.fin{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fin .fbar{width:86px;height:3px;background:var(--ink);border-radius:2px}
.rlab{font-size:24px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.opt{min-height:56px;min-width:84px;padding:8px 16px;border-radius:12px;border:2px solid var(--go);background:var(--page);font-size:20px;font-weight:500}
.opt.sym{font-size:30px;min-width:76px;font-weight:700}
.opt:hover:not(:disabled){background:var(--chip)}
.opt.no{border-style:dashed;border-color:var(--line);color:var(--soft)}
.opt.ok{background:var(--yes-bg);border-color:var(--yes);color:var(--yes)}
.filled{font-size:26px;font-weight:700;padding:6px 16px;border-radius:10px;background:var(--yes-bg);color:var(--yes)}
.foot{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px;background:var(--bg);margin-top:10px}
.foot .main{margin-left:auto;min-width:180px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#hand{position:fixed;left:-80px;top:-80px;font-size:42px;pointer-events:none;z-index:60;transition:left .45s ease,top .45s ease;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}

/* sheets */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,20,30,.45)}
#sheet[hidden]{display:none!important}
.sheet{background:var(--page);width:100%;max-width:600px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet:focus{outline:none}
.inp{width:100%;min-height:44px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--page);font-size:16px}
.big{font-size:56px;line-height:1}
.score{display:flex;gap:6px;flex-wrap:wrap;font-size:30px}
.panel{background:var(--page);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
@media (max-width:900px){
  .ses{grid-template-columns:1fr;grid-template-areas:"bubble" "work" "check";grid-template-rows:auto}
  .bubble{min-height:0}
}
@media (max-width:560px){
  body{font-size:17px}
  .work{padding:12px}
  .blab{width:56px;font-size:17px}
  .halflab{padding-left:66px}
  .box{width:64px;height:52px;font-size:24px}
  .foot .main{min-width:0;flex:1 1 auto}
  .top .trail{width:100%}
}
@media (prefers-reduced-motion:reduce){#hand{transition:none}.shake{animation:none}}
/* boards */
.board{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.btitle{font-size:15px;color:var(--soft);text-align:center;margin-bottom:4px}
.stk{display:flex;flex-direction:column;gap:14px;width:100%;align-items:center}
.stkit{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.ans,.board{scroll-margin-bottom:96px;scroll-margin-top:12px}
.count{font-size:19px;font-weight:600;text-align:center;color:var(--go);font-variant-numeric:tabular-nums}
.plates{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:720px}
.plate{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;border:2px solid var(--line);border-radius:18px;background:var(--chip);min-width:88px}
button.plate{cursor:pointer}
button.plate:hover{border-color:var(--glow)}
.plate.on{border-color:var(--go);background:var(--bubble)}
.pi{display:grid;gap:2px;font-size:22px;line-height:1.15;min-height:28px;justify-items:center}
.ptag{font-weight:700;font-size:16px;min-height:22px;color:var(--go)}
.arr{display:flex;flex-direction:column;gap:3px;width:max-content;max-width:100%}
.acap{font-size:15px;color:var(--soft);padding-left:34px}
.arow{display:flex;align-items:center;gap:6px}
.rn{width:26px;flex:none;text-align:right;font-size:13px;color:var(--soft)}
.adots{display:flex;gap:4px;padding:3px 5px;border-radius:999px;border:2px solid transparent;background:transparent;position:relative}
button.adots{cursor:pointer}
button.adots:hover{border-color:var(--glow)}
.adots i{width:var(--ds);height:var(--ds);border-radius:50%;background:var(--c);border:1.5px solid rgba(0,0,0,.35);display:block;flex:none}
.adots.fade i{background:transparent;border:1.5px dashed var(--soft)}
.adots.x::after{content:"";position:absolute;left:2px;right:2px;top:50%;border-top:3px solid var(--hot)}
.atag{font-weight:700;color:var(--go);font-size:16px;white-space:nowrap}
.acut{display:block;width:calc(100% - 34px);margin:1px 0 1px 34px;height:14px;border:0;background:transparent;border-top:3px dashed var(--line);padding:0}
button.acut{cursor:pointer}
button.acut:hover{border-top-color:var(--glow)}
.acut.on{border-top:4px solid var(--hot)}
.lineb{width:100%;max-width:700px}
.lineb text{fill:var(--ink);font-family:var(--read)}
.pairs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px}
.loose{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:26px}
.pair{display:flex;flex-direction:column;align-items:center;padding:4px 6px;border:2px solid var(--yes);border-radius:12px;font-size:24px;line-height:1.2}
.pair.lone{border:2px dashed var(--hot)}
.pair small{font-size:12px;color:var(--hot);font-weight:600}
.tgroups{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tg{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border:2px solid var(--line);border-radius:14px;background:var(--chip)}
.tgin{display:flex;gap:3px;align-items:flex-end;flex-wrap:wrap;justify-content:center;max-width:150px}
.flat{width:44px;height:44px;background:#F2A04B;background-image:linear-gradient(#0003 1px,transparent 1px),linear-gradient(90deg,#0003 1px,transparent 1px);background-size:4.4px 4.4px;border:1.5px solid #0006}
.rod{width:9px;height:44px;background:#5FA8E8;background-image:linear-gradient(#0004 1px,transparent 1px);background-size:9px 4.4px;border:1.5px solid #0006}
.unit1{width:9px;height:9px;background:#6DB563;border:1.5px solid #0006}
.tg small{font-size:14px;font-weight:600}
.agrid{display:grid;gap:3px;width:100%;max-width:660px}
.ahead{font-weight:700;text-align:center;font-size:17px;align-self:end;padding:2px}
.ahead.side{align-self:center;text-align:right;padding-right:6px}
.acell{min-height:68px;border:2.5px solid var(--ink);border-radius:6px;background:var(--page);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:14px;padding:4px 2px;font-variant-numeric:tabular-nums}
.acell b{font-size:18px}
.acell.on{background:color-mix(in srgb,var(--c) 45%,var(--page))}
.tape{width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px}
.trow{display:flex;align-items:center;gap:8px}
.tname{width:64px;flex:none;text-align:right;font-weight:600;font-size:16px;overflow-wrap:anywhere}
.tarea{flex:1;min-width:0}
.tbar{display:flex;height:44px}
.tbox{flex:1 1 0;min-width:0;border:2.5px solid var(--ink);margin-left:-2.5px;background:color-mix(in srgb,var(--c) 45%,var(--page));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.tbox:first-child{margin-left:0}
.ttot{font-size:15px;color:var(--soft);margin-top:2px}
.algo{font-size:30px;font-variant-numeric:tabular-nums;display:inline-flex;flex-direction:column;align-items:flex-end;font-weight:600;line-height:1.3}
.algo .ln{display:flex;align-items:center}
.algo .op{width:1.1em;text-align:left;color:var(--soft)}
.algo .dg{width:.72em;text-align:center}
.algo .dg.ph{color:var(--hot)}
.algo .hr{align-self:stretch;border-top:3px solid var(--ink);margin:2px 0}
.algo .note{font-size:14px;color:var(--soft);font-weight:400;margin-left:10px;min-width:96px;text-align:left}
.layers{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;--cs:16px}
.layer{display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.55}
.layer.on{opacity:1}
.lg{display:grid;gap:2px}
.lg i{width:var(--cs);height:var(--cs);background:var(--chip);border:1.5px solid var(--soft);display:block}
.layer.on .lg i{background:#A585E0;border-color:#0006}
.layer small{font-size:13px;color:var(--soft)}
.strips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.strip{display:flex;flex-direction:column;align-items:center;gap:3px}
.sbar{display:flex;border:2px solid var(--ink)}
.sbar i{width:18px;height:36px;border-right:1px solid var(--ink);background:var(--page);display:block}
.sbar i:last-child{border-right:0}
.sbar i.on{background:#5FA8E8}
.strip small{font-size:14px}
.hund{width:min(240px,64vw);height:auto}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:16px;height:16px;border-radius:4px;display:inline-block;border:1px solid var(--ink)}
.fpairs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-end}
.fp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px}
.fp svg circle{fill:#5FA8E8;stroke:#0006}
.pv{border-collapse:collapse;font-variant-numeric:tabular-nums;max-width:100%}
.pv th{font-size:12px;font-weight:600;color:var(--soft);padding:2px 4px;border-bottom:2px solid var(--line);white-space:nowrap}
.pv td{font-size:26px;font-weight:700;text-align:center;padding:2px 6px;min-width:34px;border-right:1px dashed var(--line)}
.pv td.pt{min-width:10px;border-right:0;padding:0}
.pv td.lab{font-size:14px;font-weight:400;color:var(--soft);text-align:right;border-right:0}
.pvwrap{max-width:100%;overflow-x:auto}

/* words */
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{background:var(--bubble);border-radius:12px;padding:6px 12px;font-size:16px}
.word b{display:block;font-size:17px}

/* home extras */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.tool{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--page);border:2px solid var(--line);text-align:left;min-height:74px}
.tool:hover{border-color:var(--go)}
.tool .ic{font-size:34px;line-height:1}
.tool b{font-size:19px;display:block}
.tool small{font-size:15px;color:var(--soft);display:block}
.units.small{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.units.small .unit{padding:10px 12px;gap:6px}
.units.small .unit b{font-size:17px}
h2.sec{font-size:22px;margin:18px 0 4px}
p.secp{margin:0 0 10px;color:var(--soft);font-size:16px}

/* times table */
.tt{display:grid;grid-template-columns:minmax(0,auto) minmax(260px,1fr);gap:16px;align-items:start}
.ttgrid{display:grid;grid-template-columns:repeat(11,var(--cell));gap:2px;--cell:min(46px,calc((100vw - 48px)/11))}
.ttgrid .h,.ttgrid button{height:var(--cell);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;font-size:clamp(12px,2.6vw,17px)}
.ttgrid .h{font-weight:700;background:var(--chip);border-radius:6px}
.ttgrid .h.on{background:var(--go);color:var(--go-ink)}
.ttgrid button{border:1px solid var(--line);border-radius:6px;background:var(--page);padding:0}
.ttgrid button.known{background:var(--yes-bg);color:var(--yes);font-weight:600}
.ttgrid button.learn{background:var(--try-bg);color:var(--try)}
.ttgrid button.path{box-shadow:inset 0 0 0 2px var(--glow)}
.ttgrid button.sel{background:var(--go);color:var(--go-ink);font-weight:700}
.ttgrid button.turn{outline:3px dashed var(--go);outline-offset:-3px}
.ttgrid button.dim{opacity:.4}
.ttpanel{background:var(--page);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ttpanel .big{font-size:38px;font-weight:700}
.ttpanel .mini{display:flex;flex-direction:column;gap:3px}
.ttpanel .mini div{display:flex;gap:3px}
.ttpanel .mini i{width:12px;height:12px;border-radius:50%;background:#5FA8E8;border:1px solid #0005;display:block}
.how{font-size:16px;color:var(--soft);margin:0 0 10px}

/* sprint */
.sp{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px}
.tbarw{width:100%;max-width:520px;height:14px;border-radius:999px;background:var(--chip);overflow:hidden}
.tbarw div{height:100%;background:var(--go);transition:width .25s linear}
.fact{font-size:clamp(40px,9vw,64px);font-weight:700;display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
.fact .box{width:120px;height:76px;font-size:44px}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:8px}
.pad button{height:58px;font-size:26px;border-radius:12px;border:2px solid var(--go);background:var(--page);color:var(--go);font-weight:600}

  .replace(/(^|[\s,])\?(?=[\s,]|$)/g,'$1blank').replace(/÷/g,' divided by ').replace(/×/g,' times ').replace(/−/g,' minus ').replace(/\+/g,' plus ').replace(/ = /g,' equals ')

/* ---------- never repeat: each problem family remembers what it has used ---------- */
let USED=store.get('used',{});
function pickProblems(u,ph,n){
  const kd=K[u.kind],key=u.kind+(kd.picPool?':'+ph:''),src=kd.pool(ph),J=x=>JSON.stringify(x);
  const used=new Set(USED[key]||[]),last=new Set(USED['last:'+u.id]||[]),out=[],keys=new Set();
  const take=p=>{const k=J(p);if(keys.has(k))return;keys.add(k);out.push(p)};
  let restart=false;
  if(Array.isArray(src)){
    const fresh=src.filter(p=>!used.has(J(p)));restart=fresh.length<n;
    for(const tier of [fresh.filter(p=>!last.has(J(p))),src.filter(p=>!last.has(J(p))),src])for(const p of shuffle(tier)){if(out.length>=n)break;take(p)}
  }else{let tries=0;while(out.length<n&&tries<40000){tries++;const p=src(out.length),k=J(p),lim=400*(out.length+1);
    if(!used.has(k)||(tries>lim&&!last.has(k))||tries>3*lim)take(p)}}
  const ks=out.map(J);USED[key]=[...(restart?[]:(USED[key]||[])),...ks].slice(-3000);USED['last:'+u.id]=ks;store.set('used',USED);
  return out.map(p=>{const q={...p,cx:rint(0,9999),nx:rint(0,9999)};if(kd.dress)kd.dress(q);return q});
}

function watchScreen(u){
  const c=newCtx();const p=ses.probs[probIndex()],v=buildView(u,p,ses.ph,'watch');
  let paused=false,resume=null,skip=null;
  const gate=()=>paused?new Promise(r=>resume=r):Promise.resolve();
  const pauseBtn=h('button',{class:'btn',on:{click(){paused=!paused;pauseBtn.textContent=paused?'▶ Play':'⏸ Pause';if(paused)hush();else if(resume){const r=resume;resume=null;r()}}}},'⏸ Pause');
  const nextStep=h('button',{class:'btn',on:{click(){hush();if(skip)skip()}}},'⏭ Next step');
  const again=h('button',{class:'btn',on:{click:()=>watchScreen(u)}},'↺ Watch again');
  const last=ses.i===partLen()-1;
  const go=h('button',{class:'btn main',disabled:true,on:{click:advance}},last?'Try one together':'Next example');
  layout(u,ses.ph,0,2,ses.i,v,[pauseBtn,nextStep,again,go]);
  if(v.B)v.B.setLive(false);
  const talk=async t=>{v.say(t,false);const min=(TTS&&A.voice)?300:Math.max(1800,t.length*48);await Promise.race([Promise.all([say(t),c.wait(min)]),new Promise(r=>skip=r)]);skip=null};
  guard((async()=>{
    await talk(ses.i===0?"Watch me first. I will show you each step and say what I am thinking.":"Here is one more. Watch each step.");
    const S=v.prob.steps;
    for(let si=0;si<S.length;si++){const st=S[si];await gate();if(!c.alive)return;
      v.mark(st.li,'now');await talk(st.think);await gate();if(!c.alive)return;
      if(st.act&&v.B){await pointAt(v.B.el,c);st.act(v.B.spec);v.B.refresh()}else await pointAt(v.ansSlot,c);
      hideHand();v.fill(st.input);if(!S[si+1]||S[si+1].li!==st.li)v.mark(st.li,'done');await c.wait(600)}

  })());
}

  layout(u,ses.ph,1,2,ses.i,v,[helper,go]);
  const S=v.prob.steps;let si=0;
  const step=()=>{const st=S[si];let tries=0;v.cur=st;v.mark(st.li,'now');
    if(v.B)v.B.setLive(st.input.t==='board'||st.input.t==='point',st.input.t==='point'?'point':st.input.mode);
    v.say((si===0&&ses.i===0?"Let's do this one together. ":'')+st.prompt);

      tries++;v.ansSlot.firstChild?.classList.add('shake');setTimeout(()=>v.ansSlot.firstChild?.classList.remove('shake'),400);
      if(tries===1){v.say("Hmm, not quite. That's okay. "+st.cue);if(st.input.t!=='choice')v.ansSlot.firstChild?.clear?.();return false}
