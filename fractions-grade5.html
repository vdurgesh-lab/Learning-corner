<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fraction Path Grade 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF3F6; --page:#FFFFFF; --ink:#1A2B3C; --soft:#55677A; --line:#CFDAE2;
  --go:#25558F; --go-ink:#FFFFFF; --yes:#1D7350; --yes-bg:#DDF3E8; --try:#8A4B00; --try-bg:#FFF0D4;
  --glow:#D69A00; --chip:#E3EBF1; --bubble:#E7EFFA; --hot:#D1495B; --c1:#4E9AE0; --c2:#F28E2B;
  --read:"Lexend",Verdana,Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111B24; --page:#1A2732; --ink:#E9F0F5; --soft:#A5B6C4; --line:#33444F; --go:#7FB2EA; --go-ink:#0E1B26;
  --yes:#7CDBB0; --yes-bg:#17392C; --try:#FFC67A; --try-bg:#3D2C12; --glow:#F2C14E; --chip:#24343F; --bubble:#203247; --hot:#FF7A8A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111B24; --page:#1A2732; --ink:#E9F0F5; --soft:#A5B6C4; --line:#33444F; --go:#7FB2EA; --go-ink:#0E1B26;
  --yes:#7CDBB0; --yes-bg:#17392C; --try:#FFC67A; --try-bg:#3D2C12; --glow:#F2C14E; --chip:#24343F; --bubble:#203247; --hot:#FF7A8A; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--read);font-size:18px;line-height:1.45}
#app{max-width:1180px;margin:0 auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
h1{font-size:clamp(26px,4.4vw,38px);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:21px;margin:0;line-height:1.3;text-wrap:balance}
.muted{color:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.btn{min-height:50px;padding:8px 20px;border-radius:12px;border:2px solid var(--go);background:var(--page);color:var(--go);font-weight:600}
.btn.main{background:var(--go);color:var(--go-ink)}
.btn:disabled{opacity:.45;cursor:default}
.quiet{min-height:42px;padding:5px 12px;border-radius:10px;border:1px solid var(--line);background:var(--page);font-size:16px}
.quiet[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.chip{display:inline-block;font-size:14px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--soft);white-space:nowrap}
.chip.ok{background:var(--yes-bg);color:var(--yes);font-weight:600}
.chip.due{background:var(--try-bg);color:var(--try);font-weight:600}

/* fraction text */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .1em}
.fr .nu{border-bottom:.09em solid currentColor;padding:0 .15em}
.fr .de{padding:0 .15em}
.mx{margin-right:.06em}

/* home */
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.hero p{margin:4px 0 0;color:var(--soft)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.unit{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:16px;background:var(--page);border:2px solid var(--line)}
.unit.up{border-color:var(--go);box-shadow:0 0 0 3px rgba(37,85,143,.15)}
.unit .t{display:flex;gap:10px;align-items:flex-start}
.unit .num{flex:none;width:42px;height:42px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700}
.unit.done .num{background:var(--yes-bg);color:var(--yes)}
.unit b{font-size:19px;line-height:1.25;display:block}
.unit small{font-size:15px;color:var(--soft);display:block}
.unit .chips{display:flex;gap:6px;flex-wrap:wrap}
.unit .btn{align-self:flex-start;min-height:44px}
.card{background:var(--page);border:2px solid var(--go);border-radius:16px;padding:12px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
details{margin-top:16px;background:var(--page);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:16px}
summary{cursor:pointer;font-weight:600}
details li{margin:6px 0}
.grades{display:flex;gap:6px;flex-wrap:wrap}
.grades a{color:var(--go);font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none;background:var(--page)}
.grades a[aria-current]{background:var(--go);color:var(--go-ink);border-color:var(--go)}

/* session */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.top .ttl{font-weight:600;font-size:17px;min-width:0;flex:1 1 200px}
.top .ttl small{display:block;font-weight:400;color:var(--soft);font-size:14px}
.trail{display:flex;gap:4px;flex-wrap:wrap}
.pt{font-size:14px;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--soft);white-space:nowrap}
.pt.on{background:var(--go);color:var(--go-ink);font-weight:600}
.pt.done{background:var(--yes-bg);color:var(--yes)}
.ses{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-areas:"work bubble" "work check";grid-template-rows:auto 1fr;gap:12px;align-items:start}
.work{grid-area:work;background:var(--page);border:1px solid var(--line);border-radius:18px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bubble{grid-area:bubble;display:flex;gap:10px;align-items:flex-start;background:var(--bubble);border-radius:16px;padding:12px 14px;font-size:18px;min-height:80px}
.bubble .who{font-size:30px;line-height:1;flex:none}
.bubble .txt{min-width:0}
.check{grid-area:check;background:var(--page);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.check h2{font-size:16px;color:var(--soft);font-weight:600}
.check ol{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.check li{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:10px;font-size:16px;line-height:1.35}
.check li .n{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:var(--page)}
.check li.now{background:var(--bubble);box-shadow:inset 0 0 0 2px var(--go)}
.check li.done .n{background:var(--yes);border-color:var(--yes);color:var(--page)}
.check button.n{cursor:pointer;padding:0}
.q{font-size:20px;line-height:1.5}
.eq{font-size:clamp(26px,4vw,34px);font-weight:600;text-align:center}
.ans{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;padding-top:10px;border-top:1px dashed var(--line);min-height:76px}
.ans .lead{width:100%;text-align:center;font-size:17px;color:var(--soft)}
.box{width:76px;height:56px;font-size:28px;text-align:center;border:2px solid var(--go);border-radius:10px;background:var(--page);color:var(--ink);padding:0}
.box.wide{width:110px}
.fin{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.fin .fbar{width:86px;height:3px;background:var(--ink);border-radius:2px}
.rlab{font-size:24px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.opt{min-height:56px;min-width:84px;padding:8px 16px;border-radius:12px;border:2px solid var(--go);background:var(--page);font-size:20px;font-weight:500}
.opt.sym{font-size:30px;min-width:76px;font-weight:700}
.opt:hover:not(:disabled){background:var(--chip)}
.opt.no{border-style:dashed;border-color:var(--line);color:var(--soft)}
.opt.ok{background:var(--yes-bg);border-color:var(--yes);color:var(--yes)}
.filled{font-size:26px;font-weight:700;padding:6px 16px;border-radius:10px;background:var(--yes-bg);color:var(--yes)}
.foot{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px;background:var(--bg);margin-top:10px}
.foot .main{margin-left:auto;min-width:180px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#hand{position:fixed;left:-80px;top:-80px;font-size:42px;pointer-events:none;z-index:60;transition:left .45s ease,top .45s ease;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}

/* boards */
.board{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.btitle{font-size:15px;color:var(--soft);text-align:center;margin-bottom:4px}
.stk{display:flex;flex-direction:column;gap:12px;width:100%;align-items:center}
.stkit{width:100%;display:flex;flex-direction:column;align-items:center}
.bars{width:100%;max-width:660px;display:flex;flex-direction:column;gap:10px;position:relative}
.barrow{display:flex;align-items:center;gap:10px}
.blab{width:78px;flex:none;text-align:right;font-size:20px;font-weight:600}
.bar{flex:1;display:flex;height:50px;border:2.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--page);position:relative}
.bars.compact .bar{height:34px}
.pc{flex:1 1 0;min-width:0;border:0;border-right:2px solid var(--ink);background:transparent;padding:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#1A2B3C;font-weight:600}
.pc:last-child{border-right:0}
.pc.v-a{background:var(--c)}
.pc.v-b{background:repeating-linear-gradient(45deg,var(--c) 0 7px,#ffffff 7px 11px)}
.pc.v-x{background:var(--page);color:var(--hot)}
.pc.v-x::after{content:"✕";font-size:24px;font-weight:700}
.pc:not(.v-a):not(.v-b){color:var(--soft)}
button.pc:hover{box-shadow:inset 0 0 0 3px var(--glow)}
.bars.half .bar::after{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;border-left:3px dashed var(--hot);pointer-events:none}
.halflab{font-size:14px;color:var(--hot);font-weight:600;text-align:center;padding-left:88px}
.circs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.circ{width:min(150px,28vw);height:auto}
.circ.sm{width:min(112px,24vw)}
.stk .circ{width:min(118px,26vw)}
.ans,.board{scroll-margin-bottom:96px;scroll-margin-top:12px}
.circ path,.circ circle{stroke:var(--ink);stroke-width:1.6}
.circ .tap{cursor:pointer}
.grp{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:540px}
.gi{width:54px;height:54px;border-radius:50%;border:2px solid var(--line);font-size:28px;display:flex;align-items:center;justify-content:center;background:var(--page);padding:0}
.gi.on{background:var(--c);border-color:var(--ink)}
.lineb{width:100%;max-width:700px}
.lineb text{fill:var(--ink);font-family:var(--read)}
.lineb .hit{cursor:pointer;fill:transparent}
.lineb .hit:hover{fill:rgba(214,154,0,.25)}
.area{width:min(250px,64vw);height:auto}
.arealab{font-size:16px;color:var(--soft);text-align:center}
.share{width:100%;display:flex;flex-direction:column;gap:10px;align-items:center}
.pile{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:44px;font-size:24px;padding:8px;border:2px dashed var(--line);border-radius:12px;width:100%;max-width:640px}
.plates{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.plate{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border:2px solid var(--line);border-radius:16px;background:var(--chip);min-width:86px}
.pi{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;max-width:120px;font-size:20px;min-height:28px}
.pcnt{font-weight:700;font-size:16px}
.left{font-weight:600;color:var(--try)}
.stepper{display:flex;gap:10px;align-items:center;justify-content:center}
.stepper button{width:52px;height:46px;font-size:26px;border-radius:10px;border:2px solid var(--go);background:var(--page);color:var(--go);padding:0}
.stepper span{min-width:100px;text-align:center;font-weight:600}
.toolsb{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.parts{width:100%;max-width:680px;display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:stretch;min-height:86px}
.pdl{flex:none;width:52px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.pseg{min-width:74px;border:2.5px solid var(--ink);margin-left:-2.5px;background:var(--bubble);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;font-size:15px;text-align:center}
.pseg:first-of-type{margin-left:0}
.pseg b{font-size:16px}
.pseg.left{background:var(--page);border-style:dashed;color:var(--soft)}
.helper{display:flex;flex-wrap:wrap;gap:6px;font-size:15px;align-items:center}
.helper span{background:var(--chip);padding:2px 8px;border-radius:8px;font-variant-numeric:tabular-nums}
.ledger{font-size:24px;font-variant-numeric:tabular-nums;border-collapse:collapse}
.ledger td{padding:1px 8px;text-align:right}
.ledger td.note{text-align:left;font-size:16px;color:var(--soft)}
.ledger tr.sub td.v{border-bottom:2px solid var(--ink)}
.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:16px;height:16px;border-radius:4px;display:inline-block;border:1px solid var(--ink)}

/* sheets */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,20,30,.45)}
#sheet[hidden]{display:none!important}
.sheet{background:var(--page);width:100%;max-width:600px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet:focus{outline:none}
.inp{width:100%;min-height:44px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--page);font-size:16px}
.big{font-size:56px;line-height:1}
.score{display:flex;gap:6px;flex-wrap:wrap;font-size:30px}
.panel{background:var(--page);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
@media (max-width:900px){
  .ses{grid-template-columns:1fr;grid-template-areas:"bubble" "work" "check";grid-template-rows:auto}
  .bubble{min-height:0}
}
@media (max-width:560px){
  body{font-size:17px}
  .work{padding:12px}
  .blab{width:56px;font-size:17px}
  .halflab{padding-left:66px}
  .box{width:64px;height:52px;font-size:24px}
  .foot .main{min-width:0;flex:1 1 auto}
  .top .trail{width:100%}
}
@media (prefers-reduced-motion:reduce){#hand{transition:none}.shake{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="hand" aria-hidden="true">👆</div>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Settings"></div>
<script>
'use strict';
const GRADE=5;
const KEY='fracpath'+GRADE+'.';
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s);
const h=(t,a={},...k)=>{const e=document.createElement(t);
  for(const[n,v]of Object.entries(a)){if(n==='class')e.className=v;else if(n==='on')for(const[x,f]of Object.entries(v))e.addEventListener(x,f);else if(n==='html')e.innerHTML=v;else if(v!==false&&v!=null)e.setAttribute(n,v)}
  for(const c of k.flat())if(c!=null)e.append(c);return e};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const app=$('#app');
const FAST=()=>window.__FAST?0.04:1;

/* ---------- math text: {{3/4}} and {{1 3/4}} become stacked fractions ---------- */
const TOK=/\{\{(?:(\d+) )?(\d+|\?)\/(\d+|\?)\}\}/g;
function md(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(TOK,(m,w,n,d)=>(w?`<span class="mx">${w}</span>`:'')+`<span class="fr"><span class="nu">${n}</span><span class="de">${d}</span></span>`)}
const ONES=['','first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth','eleventh','twelfth','thirteenth','fourteenth','fifteenth','sixteenth','seventeenth','eighteenth','nineteenth'];
const TENS=['','','twent','thirt','fort','fift','sixt','sevent','eight','ninet'];
function ordinal(d){if(d<20)return ONES[d];const t=Math.floor(d/10),o=d%10;return o?TENS[t]+'y-'+ONES[o]:TENS[t]+'ieth'}
function fracWords(n,d){if(d===1)return n+(n===1?' whole':' wholes');if(d===2)return n+(n===1?' half':' halves');const o=ordinal(d);return n+' '+(n===1?o:o+'s')}
function spoken(s){return String(s).replace(TOK,(m,w,n,d)=>{const f=n==='?'?`what over ${d}`:d==='?'?`${n} over what`:fracWords(+n,+d);return w?`${w} and ${f}`:f})
  .replace(/÷/g,' divided by ').replace(/×/g,' times ').replace(/−/g,' minus ').replace(/\+/g,' plus ').replace(/= \?/g,'equals what?').replace(/◯/g,' blank ')
  .replace(/ = /g,' equals ').replace(/ > /g,' is greater than ').replace(/ < /g,' is less than ').replace(/(\d) R (\d)/g,'$1 remainder $2')
  .replace(/["“”]/g,'').replace(/!/g,'.').replace(/\s+/g,' ').trim()}

/* ---------- warm, slow voice ---------- */
const TTS='speechSynthesis'in window&&'SpeechSynthesisUtterance'in window?window.speechSynthesis:null;
const A={voice:store.get('voice',true),slow:store.get('slow',true),vol:store.get('vol',85),uri:store.get('uri',''),calm:store.get('calm',!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)),need:store.get('need',2)};
const NOVELTY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Ralph|Fred|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
const vScore=v=>{let n=0,s=v.name;if(/Natural|Neural/i.test(s))n+=50;if(/Premium|Enhanced/i.test(s))n+=40;if(/Google US English/i.test(s))n+=30;if(/Ava|Samantha|Allison|Susan|Zoe|Aria|Jenny|Serena|Nicky/i.test(s))n+=20;if(/en.US/i.test(v.lang))n+=10;return n};
let voices=[];
function loadVoices(){if(!TTS)return;voices=TTS.getVoices().filter(v=>/^en/i.test(v.lang)&&!NOVELTY.test(v.name)).sort((a,b)=>vScore(b)-vScore(a));if(voices.length&&!voices.some(v=>v.voiceURI===A.uri))A.uri=voices[0].voiceURI}
if(TTS){loadVoices();if(TTS.addEventListener)TTS.addEventListener('voiceschanged',loadVoices)}
let sq=[],sbusy=false,srun=0,waiters=[];
function hush(){srun++;sq=[];sbusy=false;if(TTS)TTS.cancel();const w=waiters;waiters=[];w.forEach(f=>f())}
function pump(run){
  if(run!==srun||sbusy)return;
  if(!sq.length){const w=waiters;waiters=[];w.forEach(f=>f());return}
  sbusy=true;const text=sq.shift();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=A.slow?.78:.92;u.pitch=1;u.volume=Math.max(.05,A.vol/100);
  const v=voices.find(x=>x.voiceURI===A.uri);if(v)u.voice=v;
  let once=false;const done=()=>{if(once)return;once=true;clearTimeout(t);if(run!==srun)return;sbusy=false;setTimeout(()=>pump(run),(/\?$/.test(text)?560:340)*FAST())};
  const t=setTimeout(done,text.length*140+3000);u.onend=done;u.onerror=done;TTS.speak(u);if(TTS.paused)TTS.resume();
}
function say(text,{queue=false}={}){return new Promise(res=>{
  if(!TTS||!A.voice||!text){res();return}
  if(!queue)hush();
  const parts=(spoken(text).match(/[^.?]+[.?]*/g)||[]).map(x=>x.trim()).filter(Boolean);
  if(!parts.length){res();return}
  sq.push(...parts);waiters.push(res);pump(srun)})}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hush()});

/* ---------- colors: each piece size keeps its own color, like color-coded fraction tiles ---------- */
const DCOL={1:'#9AA8B6',2:'#E8706B',3:'#F2A04B',4:'#EBCB4E',5:'#6DB563',6:'#5FA8E8',8:'#A585E0',10:'#E58AC8',12:'#3CC0B0'};
const dcol=d=>DCOL[d]||`hsl(${(d*53)%360} 62% 66%)`;
const PCOL=['#E8706B','#5FA8E8','#6DB563','#F2A04B','#A585E0','#E58AC8','#3CC0B0','#EBCB4E'];

/* ---------- boards (the virtual manipulatives) ---------- */
const fillN=(d,n,v='a')=>Array.from({length:d},(_,i)=>i<n?v:0);
function subOf(R,si){return R.type==='stack'?R.items[si]:R}
function piecesOf(sp){return sp.type==='bars'?sp.bars.map(b=>b.f):sp.type==='circles'?sp.items.map(c=>c.f):sp.type==='group'?[sp.f]:[]}
function countV(sp,v='a'){return piecesOf(sp).flat().filter(x=>x===v).length}
function getD(sp){return sp.type==='bars'?sp.bars[sp.only||0].d:sp.type==='circles'?sp.items[0].d:sp.d}
function setD(sp,d){if(sp.type==='bars'){const ix=sp.buildAll?sp.bars.map((_,i)=>i):[sp.only||0];ix.forEach(i=>{sp.bars[i].d=d;sp.bars[i].f=fillN(d,0)})}
  else if(sp.type==='circles'){(sp.buildAll?sp.items:[sp.items[0]]).forEach(c=>{c.d=d;c.f=fillN(d,0)})}else{sp.d=d;sp.f=fillN(d,0)}}
function shadeFirst(sp,n){const f=piecesOf(sp)[sp.only||0];for(let i=0;i<f.length;i++)f[i]=i<n?'a':0}
function canTap(mode,v){return mode==='shade'||(mode==='shadeB'&&v!=='a'&&v!=='x')||(mode==='cross'&&(v==='a'||v==='x'))}
function stepperHTML(si,d,word){return `<div class="stepper"><button type="button" data-s="${si}" data-act="minus" aria-label="Fewer parts">−</button><span>${d} ${d===1?word[0]:word[1]}</span><button type="button" data-s="${si}" data-act="plus" aria-label="More parts">+</button></div>`}
function toolsHTML(si,sp){const L={shade:'Shade',shadeB:'Add more',cross:'Take away',clear:'Clear'};return `<div class="toolsb">${sp.tools.map(t=>`<button type="button" class="quiet" data-s="${si}" data-act="tool:${t}" aria-pressed="${sp.mode===t}">${L[t]}</button>`).join('')}</div>`}
function sector(i,d,r){const a0=-Math.PI/2+i*2*Math.PI/d,a1=a0+2*Math.PI/d;const p=a=>`${(r*Math.cos(a)).toFixed(2)} ${(r*Math.sin(a)).toFixed(2)}`;return `M0 0 L${p(a0)} A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${p(a1)}Z`}
function boardHTML(sp,si,live){
  const tapOn=live&&sp.mode;const w=sp.word||['part','parts'];
  switch(sp.type){
  case 'stack':return `<div class="stk">`+sp.items.map((x,i)=>`<div class="stkit">${x.title?`<div class="btitle">${md(x.title)}</div>`:''}${boardHTML(x,i,live&&x.work)}</div>`).join('')+'</div>';
  case 'bars':{let o=`<div class="bars${sp.half?' half':''}${sp.compact||sp.bars.length>3?' compact':''}">`;
    if(sp.half)o+=`<div class="halflab">dashed line = 1 half</div>`;
    sp.bars.forEach((b,bi)=>{const col=dcol(b.d);o+=`<div class="barrow"><div class="blab">${b.label?md(b.label):''}</div><div class="bar" role="group" aria-label="bar with ${b.d} parts">`;
      const can=tapOn&&(sp.only==null||sp.only===bi||sp.buildAll);
      for(let i=0;i<b.d;i++){const v=b.f[i]||0,tap=can&&canTap(sp.mode,v),lab=b.d===1?'1 whole':b.d<=10&&sp.tiles!==false?`1/${b.d}`:'';
        o+=tap?`<button type="button" class="pc v-${v}" style="--c:${col}" data-s="${si}" data-b="${bi}" data-i="${i}" aria-label="part ${i+1}">${v==='x'?'':lab}</button>`:`<div class="pc v-${v}" style="--c:${col}">${v==='x'?'':lab}</div>`}
      o+=`</div></div>`});
    if(live&&sp.build)o+=stepperHTML(si,getD(sp),w);
    if(live&&sp.tools)o+=toolsHTML(si,sp);
    return o+'</div>'}
  case 'circles':{let o=`<div class="circs">`;
    sp.items.forEach((c,ci)=>{const col=dcol(c.d);o+=`<svg class="circ${sp.items.length>3?' sm':''}" viewBox="-54 -54 108 108" role="img" aria-label="circle with ${c.d} parts">`;
      const fillOf=v=>v==='a'?col:typeof v==='string'&&v[0]==='p'?PCOL[+v.slice(1)]:'var(--page)';
      const tap=tapOn&&(sp.buildAll||ci===0);
      if(c.d===1)o+=`<circle r="50" data-v="${c.f[0]||0}" style="fill:${fillOf(c.f[0])}" ${tap?`class="tap" data-s="${si}" data-b="${ci}" data-i="0"`:''}/>`;
      else for(let i=0;i<c.d;i++)o+=`<path d="${sector(i,c.d,50)}" data-v="${c.f[i]||0}" style="fill:${fillOf(c.f[i])}" ${tap?`class="tap" data-s="${si}" data-b="${ci}" data-i="${i}"`:''}/>`;
      o+='</svg>'});
    o+='</div>';
    if(sp.people)o+=`<div class="legend">${Array.from({length:sp.people},(_,i)=>`<span><i style="background:${PCOL[i]}"></i>Friend ${i+1}</span>`).join('')}</div>`;
    if(live&&sp.build)o+=stepperHTML(si,getD(sp),['slice','slices']);
    return o}
  case 'group':{let o=`<div class="grp" style="--c:${dcol(Math.max(2,Math.min(12,sp.d)))}">`;
    for(let i=0;i<sp.d;i++){const on=sp.f[i]==='a';o+=tapOn?`<button type="button" class="gi${on?' on':''}" data-s="${si}" data-i="${i}" aria-label="item ${i+1}">${sp.emoji}</button>`:`<div class="gi${on?' on':''}">${sp.emoji}</div>`}
    o+='</div>';if(live&&sp.build)o+=stepperHTML(si,sp.d,['thing','things']);return o}
  case 'line':{const W=700,x0=40,x1=660,y=86,N=sp.max*sp.d,X=k=>x0+(x1-x0)*k/N;let s=`<svg class="lineb" viewBox="0 0 ${W} 140" role="img" aria-label="number line from 0 to ${sp.max}">`;
    if(sp.bar)for(let k=0;k<N;k++)s+=`<rect x="${X(k)}" y="6" width="${X(k+1)-X(k)}" height="28" style="fill:${k<(sp.barFill||0)?dcol(sp.d):'var(--page)'};stroke:var(--ink);stroke-width:1.5"/>`+(sp.d<=8?`<text x="${(X(k)+X(k+1))/2}" y="25" text-anchor="middle" font-size="12">1/${sp.d}</text>`:'');
    for(let k=1;k<=(sp.hops||0);k++)s+=`<path d="M${X(k-1)} ${y-4} Q${(X(k-1)+X(k))/2} ${y-40} ${X(k)} ${y-4}" style="fill:none;stroke:var(--go);stroke-width:3"/>`;
    s+=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" style="stroke:var(--ink);stroke-width:3"/>`;
    for(let k=0;k<=N;k++){const wh=k%sp.d===0;s+=`<line x1="${X(k)}" y1="${y-(wh?16:10)}" x2="${X(k)}" y2="${y+(wh?16:10)}" style="stroke:var(--ink);stroke-width:${wh?3:2}"/>`;
      if(wh)s+=`<text x="${X(k)}" y="${y+42}" text-anchor="middle" font-size="24" font-weight="700">${k/sp.d}</text>`;
      if(tapOn)s+=`<rect class="hit" x="${X(k)-16}" y="${y-34}" width="32" height="68" rx="6" data-s="${si}" data-k="${k}"><title>mark ${k}</title></rect>`}
    if(sp.point!=null)s+=`<circle cx="${X(sp.point)}" cy="${y}" r="11" style="fill:var(--hot);stroke:var(--page);stroke-width:3"/>`;
    return s+'</svg>'}
  case 'area':{const S=240,{b,d,a,c}=sp,show=sp.show||0;let s=`<svg class="area" viewBox="-6 -6 ${S+12} ${S+12}" role="img" aria-label="area model">`;
    s+=`<rect width="${S}" height="${S}" style="fill:var(--page)"/>`;
    if(show>=1)s+=`<rect width="${S*a/b}" height="${S}" style="fill:var(--c1);opacity:.55"/>`;
    if(show>=2)s+=`<rect width="${S}" height="${S*c/d}" style="fill:var(--c2);opacity:.5"/>`;
    if(show>=1)for(let i=1;i<b;i++)s+=`<line x1="${S*i/b}" y1="0" x2="${S*i/b}" y2="${S}" style="stroke:var(--ink);stroke-width:1.6"/>`;
    if(show>=2)for(let j=1;j<d;j++)s+=`<line x1="0" y1="${S*j/d}" x2="${S}" y2="${S*j/d}" style="stroke:var(--ink);stroke-width:1.6"/>`;
    if(show>=2)s+=`<rect width="${S*a/b}" height="${S*c/d}" style="fill:none;stroke:var(--ink);stroke-width:5"/>`;
    s+=`<rect width="${S}" height="${S}" style="fill:none;stroke:var(--ink);stroke-width:3"/></svg>`;
    return s+`<div class="legend"><span><i style="background:var(--c1);opacity:.7"></i>${md(`{{${a}/${b}}}`)} going down</span>${show>=2?`<span><i style="background:var(--c2);opacity:.7"></i>${md(`{{${c}/${d}}}`)} going across</span>`:''}</div>`}
  case 'share':{const used=sp.plates.reduce((x,y)=>x+y,0),pile=sp.total-used;
    let o=`<div class="share"><div class="pile" aria-label="${pile} left in the pile">${pile?Array(pile).fill(`<span>${sp.emoji}</span>`).join(''):'<span class="muted" style="font-size:16px">The pile is empty</span>'}</div><div class="plates">`;
    sp.plates.forEach((n,i)=>o+=`<div class="plate"><div class="pi">${Array(n).fill(`<span>${sp.emoji}</span>`).join('')}</div><div class="pcnt">${sp.plateName} ${i+1}: ${n}</div></div>`);
    o+='</div>';
    if(sp.group&&pile>0&&pile<sp.size&&sp.plates.length)o+=`<div class="left">${pile} left over. Not enough for another group of ${sp.size}.</div>`;
    if(live&&sp.mode==='deal')o+=`<div class="row"><button type="button" class="btn" data-s="${si}" data-act="deal">Give one to each ${sp.plateName.toLowerCase()}</button><button type="button" class="quiet" data-s="${si}" data-act="reset">Start over</button></div>`;
    if(live&&sp.mode==='group')o+=`<div class="row"><button type="button" class="btn" data-s="${si}" data-act="group">Make a group of ${sp.size}</button><button type="button" class="quiet" data-s="${si}" data-act="reset">Start over</button></div>`;
    return o+'</div>'}
  case 'parts':{let o=`<div class="parts"><div class="btitle">Area model: ${sp.N} split into groups of ${sp.D}</div><div class="prow"><div class="pdl">${sp.D}</div>`;
    sp.chunks.forEach(c=>o+=`<div class="pseg" style="flex:${Math.max(c,sp.N/sp.D/8)} 1 0"><b>${sp.D} × ${c}</b><span>= ${sp.D*c}</span></div>`);
    o+=`<div class="pseg left" style="flex:${Math.max(sp.left/sp.D,sp.N/sp.D/8)} 1 0">${sp.chunks.length?`left: ${sp.left}`:`${sp.N} to share`}</div></div>`;
    if(sp.helper)o+=`<div class="helper"><b>Helper:</b>${sp.helper.map(m=>`<span>${sp.D} × ${m} = ${sp.D*m}</span>`).join('')}</div>`;
    return o+'</div>'}
  case 'ledger':{let o=`<table class="ledger" aria-label="written work"><tr><td class="v">${sp.N}</td><td class="note"></td></tr>`;
    sp.rows.forEach(r=>{o+=`<tr class="sub"><td class="v">− ${r.sub}</td><td class="note">${sp.D} × ${r.c}</td></tr><tr><td class="v">${r.left}</td><td class="note">left</td></tr>`});
    o+='</table>';
    if(sp.helper)o+=`<div class="helper"><b>Helper:</b>${sp.helper.map(m=>`<span>${sp.D} × ${m} = ${sp.D*m}</span>`).join('')}</div>`;
    return o}
  }return ''}
function makeBoard(spec,onChange){
  const el=h('div',{class:'board'});const B={el,spec,live:false};
  B.refresh=()=>{el.innerHTML=boardHTML(B.spec,0,B.live)};
  B.setLive=(live,mode)=>{B.live=!!live;const set=sp=>{if(mode!==undefined&&(sp.work||B.spec.type!=='stack'))sp.mode=mode};if(B.spec.type==='stack')B.spec.items.forEach(set);else set(B.spec);B.refresh()};
  el.addEventListener('click',e=>{if(!B.live)return;const t=e.target.closest('[data-s]');if(!t)return;const sp=subOf(B.spec,+t.dataset.s);if(!sp)return;
    const act=t.dataset.act;
    if(act==='plus'||act==='minus'){const d=getD(sp)+(act==='plus'?1:-1);if(d<1||d>24)return;setD(sp,d)}
    else if(act&&act.startsWith('tool:')){const m=act.slice(5);if(m==='clear'){piecesOf(sp).forEach(f=>f.fill(0))}else sp.mode=m}
    else if(act==='deal'){let pile=sp.total-sp.plates.reduce((x,y)=>x+y,0);for(let i=0;i<sp.plates.length&&pile>0;i++){sp.plates[i]++;pile--}}
    else if(act==='group'){const pile=sp.total-sp.plates.reduce((x,y)=>x+y,0);if(pile>=sp.size)sp.plates.push(sp.size)}
    else if(act==='reset'){sp.plates=sp.group?[]:sp.plates.map(()=>0)}
    else if(t.dataset.k!=null){sp.point=+t.dataset.k;if(sp.bar)sp.barFill=sp.point}
    else if(t.dataset.i!=null){const f=sp.type==='group'?sp.f:piecesOf(sp)[+t.dataset.b];const i=+t.dataset.i,v=f[i]||0,m=sp.mode;
      if(m==='shade')f[i]=v==='a'?0:'a';else if(m==='shadeB')f[i]=v==='b'?0:'b';else if(m==='cross')f[i]=v==='x'?'a':'x'}
    else return;
    B.refresh();if(onChange)onChange()});
  B.refresh();return B;
}

/* ---------- shared word lists ---------- */
const DENS=[2,3,4,5,6,8,10,12];
const NAMES=['Ava','Leo','Maya','Sam','Zoe','Omar','Lily','Jay','Nia','Ben','Priya','Theo','Rosa','Kai','Ella','Max','Aria','Finn','Iris','Noah'];
const ITEMS=[['🍪','cookies'],['🍓','strawberries'],['⚽','balls'],['✏️','pencils'],['🎈','balloons'],['🐟','crackers'],['🌸','flowers'],['🍎','apples'],['⭐','stickers'],['🧁','cupcakes'],['🍋','lemons'],['🧸','bears']];
const countUp=n=>n<=6?Array.from({length:n},(_,i)=>i+1).join(', ')+'.':'I count them one at a time.';
const halfOf=b=>b%2?`${(b-1)/2} and a half`:String(b/2);
const factors=n=>{const o=[];for(let i=1;i<=n;i++)if(n%i===0)o.push(i);return o};
const multiples=(b,L)=>{const o=[];for(let m=b;m<=L;m+=b)o.push(m);return o};
const F=(n,d)=>`{{${n}/${d}}}`;
const nm=p=>NAMES[p.nx%NAMES.length];
const itm=p=>ITEMS[p.cx%ITEMS.length];
function shape(s,d,n,emoji){const f=fillN(d,n);if(s==='circle')return{type:'circles',items:[{d,f}]};if(s==='group')return{type:'group',d,f,emoji};return{type:'bars',bars:[{d,f}]}}

/* ---------- problem kinds ---------- */
const K={};
K.identify={
  pool:()=>{const o=[];for(const d of DENS)for(let n=1;n<d;n++)for(const s of ['circle','bar','group'])if(!(s==='group'&&d>10))o.push({n,d,s});return o},
  make(p,ph){const{n,d,s}=p,it=itm(p);
    const pic=shape(s,d,n,it[0]);pic.title='The picture';
    const q=s==='group'?`What fraction of the ${it[1]} are colored in?`:`What fraction of the ${s} is shaded?`;
    const list=['Count all the equal parts. That is the bottom number.','Count the shaded parts. That is the top number.','Write the top number over the bottom number.'];
    const allTxt=`I count every part, shaded and white. ${countUp(d)} There are ${d} equal parts.`,shTxt=`Now I count only the shaded parts. ${countUp(n)} There ${n===1?'is':'are'} ${n}.`;
    const fin={li:2,prompt:'Now write the fraction. Shaded parts go on top. All the parts go on the bottom.',think:`The top number is ${n}, the shaded parts. The bottom number is ${d}, all the parts. The fraction is ${F(n,d)}.`,input:{t:'frac',a:[n,d]},cue:'Top number: the shaded parts. Bottom number: all the equal parts.'};
    const explain=`${n} shaded out of ${d} equal parts is ${F(n,d)}.`;
    if(ph==='pic'){const build=shape(s,1,0,it[0]);Object.assign(build,{build:true,work:true,title:'Build it here'});
      return{q,list,explain,board:{type:'stack',items:[pic,build]},ownMode:'shade',steps:[
        {li:0,prompt:'Count all the equal parts in the picture. Then press + until your whole has the same number of parts.',think:allTxt+` So I press plus until my whole has ${d} parts. ${d} is the bottom number.`,input:{t:'board',mode:'shade',check:R=>getD(R.items[1])===d},cue:'Count every part, the shaded ones and the white ones. Then use + and − to match.',act:R=>setD(R.items[1],d)},
        {li:1,prompt:'Now tap to shade the same number of parts as the picture.',think:shTxt+` So I shade ${n} of my parts.`,input:{t:'board',mode:'shade',check:R=>getD(R.items[1])===d&&countV(R.items[1])===n},cue:'Count the shaded parts in the picture slowly. Then tap that many of your parts.',act:R=>{if(getD(R.items[1])!==d)setD(R.items[1],d);shadeFirst(R.items[1],n)}},fin]}}
    return{q,list,explain,board:pic,steps:[
      {li:0,prompt:'How many equal parts are there in all?',think:allTxt+` ${d} is the bottom number.`,input:{t:'num',a:d},cue:'Count every part, shaded and white. Point to each one as you count.'},
      {li:1,prompt:'How many parts are shaded?',think:shTxt+` ${n} is the top number.`,input:{t:'num',a:n},cue:'Count only the colored parts. Go slowly.'},fin]}}};
K.numline={
  pool:()=>{const o=[];for(const d of [2,3,4,6,8])for(let n=1;n<=2*d;n++)o.push({n,d});return o},
  dress:p=>{p.v=pick(['place','read'])},
  make(p,ph){const{n,d}=p,v=p.v||'place',mx=n>d||p.cx%2?2:1;const line={type:'line',max:mx,d,bar:ph==='pic',barFill:0,point:v==='read'?n:null,hops:0,work:true};
    const cnt={li:0,prompt:'How many equal spaces are there from 0 to 1?',think:`I count the spaces between the marks, from 0 to 1. ${countUp(d)} There are ${d} equal spaces. Each space is ${F(1,d)}, so the bottom number is ${d}.`,input:{t:'num',a:d},cue:'Count the spaces between the marks, not the marks. Start at 0 and stop at 1.'};
    const hopAct=R=>{R.hops=n;R.barFill=n;R.point=n};
    if(v==='place')return{q:`Where does ${F(n,d)} go on the number line?`,list:['Count the equal spaces from 0 to 1. That is the bottom number.','Start at 0. Hop the top number of spaces. Tap where you land.'],explain:`${F(n,d)} is ${n} hop${n>1?'s':''} of ${F(1,d)} from 0.`,board:line,ownMode:'point',steps:[cnt,
      {li:1,prompt:`The top number is ${n}. Start at 0, hop ${n} space${n>1?'s':''}, and tap where you land.`,think:`The top number is ${n}. I start at 0 and hop ${n} time${n>1?'s':''}. ${countUp(n)} I land here.`,input:{t:'point',a:n},cue:`Put your finger on 0. Hop one space at a time and count to ${n}.`,act:hopAct}]};
    return{q:'What fraction is at the red dot?',list:['Count the equal spaces from 0 to 1. That is the bottom number.','Count the hops from 0 to the dot. That is the top number.','Write the fraction.'],explain:`The dot is ${n} hop${n>1?'s':''} of ${F(1,d)} from 0, so it is at ${F(n,d)}.`,board:line,steps:[cnt,
      {li:1,prompt:'Start at 0. How many hops to reach the dot?',think:`I start at 0 and hop to the dot. ${countUp(n)} That is ${n} hop${n>1?'s':''}.`,input:{t:'num',a:n},cue:'Hop one space at a time from 0. Count each hop.',act:hopAct},
      {li:2,prompt:'Write the fraction.',think:`${n} hops of ${F(1,d)} is ${F(n,d)}.`,input:{t:'frac',a:[n,d],equiv:true},cue:'Top: the hops. Bottom: the spaces from 0 to 1.'}]}}};
K.equiv3={
  pool:()=>{const o=[];for(const b of [2,3,4,5,6])for(const k of [2,3,4,5,6]){const B=b*k;if(!DENS.includes(B))continue;for(let a=1;a<b;a++)for(const dir of ['up','down'])o.push({a,b,k,dir})}return o},
  make(p,ph){const{a,b,k,dir}=p,B=b*k,A=a*k;const[gn,gd,tn,td]=dir==='up'?[a,b,A,B]:[A,B,a,b];
    const eq=`${F(gn,gd)} = {{?/${td}}}`,explain=`${F(gn,gd)} and ${F(tn,td)} cover the same amount, so they are equal.`;
    if(ph==='pic')return{q:'Find the missing number. Make both bars cover the same amount.',eq,explain,list:['Shade the bottom bar to match the top bar.','Count the shaded parts on the bottom bar.'],ownMode:'shade',
      board:{type:'bars',only:1,bars:[{d:gd,f:fillN(gd,gn),label:F(gn,gd)},{d:td,f:fillN(td,0),label:`{{?/${td}}}`}]},steps:[
      {li:0,prompt:'Tap parts of the bottom bar until it is shaded up to the same place as the top bar.',think:`The top bar is shaded up to here. I shade the bottom bar up to the same place. That takes ${tn} parts.`,input:{t:'board',mode:'shade',check:R=>R.bars[1].f.filter(x=>x==='a').length===tn},cue:'Look where the color stops on the top bar. Shade the bottom bar up to that same spot.',act:R=>{R.bars[1].f=fillN(td,tn)}},
      {li:1,prompt:'How many parts of the bottom bar are shaded? That is the missing top number.',think:`I count the shaded parts on the bottom bar. There are ${tn}. So ${F(gn,gd)} = ${F(tn,td)}.`,input:{t:'num',a:tn},cue:'Count only the shaded parts of the bottom bar.'}]};
    const up=dir==='up',sm=Math.min(gd,td),bg=Math.max(gd,td);
